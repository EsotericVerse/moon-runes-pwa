<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推演｜LOC 月典</title><meta name="description" content="時期、時間線、趨勢與軌跡。"><link rel="canonical" href="https://loc.lo3rwang.cc/evolution.html"><link rel="stylesheet" href="css/loc-responsive.css"><link rel="stylesheet" href="css/loc-nav.css"><style>
:root{--line:rgba(196,216,255,.14);--text:#edf4ff;--muted:#9fb1ca;--accent:#a9c7ff;--shadow:0 18px 50px rgba(0,0,0,.25)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:radial-gradient(circle at 15% 10%,rgba(90,130,210,.18),transparent 30%),linear-gradient(180deg,#081222,#060d18)}.app{width:min(1500px,100%);margin:auto;padding:22px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}.sidebar{position:sticky;top:22px;align-self:start;min-height:calc(100vh - 44px);padding:20px 16px;border:1px solid var(--line);background:rgba(6,15,28,.75);border-radius:24px;box-shadow:var(--shadow)}.brand{padding:4px 6px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}.brand h1{margin:0;font-size:18px}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.nav{display:grid;gap:14px}.nav-group{display:grid;gap:6px}.nav-label{padding:0 9px;color:var(--muted);font-size:10px;font-weight:700}.view-switch{width:100%;display:grid;gap:3px;padding:10px 11px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);font:inherit;text-align:left;cursor:pointer}.view-switch:hover,.view-switch.active{color:var(--text);border-color:var(--line);background:rgba(169,199,255,.08)}.view-switch.active{box-shadow:inset 2px 0 0 var(--accent)}.view-switch strong{font-size:13px}.view-switch small{font-size:10px}.view[hidden]{display:none!important}.hero{padding:28px 0 18px}.hero h1{margin:0;font-size:clamp(2rem,5vw,4rem)}.hero p{max-width:880px;color:var(--muted);line-height:1.7}.panel,.card,.keyword-card,.trajectory-card,.era-card,.event-card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(18,33,56,.82),rgba(10,21,37,.78));border-radius:18px;box-shadow:var(--shadow);padding:16px}.era-list,.event-list,.keyword-grid,.trajectory-list{display:grid;gap:10px;margin-top:16px}.keyword-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.era-card,.event-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.era-card label,.event-form label{display:grid;gap:5px;color:var(--muted);font-size:.8rem}.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#091525;color:var(--text)}textarea{min-height:72px}button{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(169,199,255,.08);color:var(--text);cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;color:var(--muted)}.trajectory-delta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.empty{padding:18px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.event-card small,.keyword-card small,.trajectory-card small{color:var(--muted)}.loc-site-footer{margin-top:32px;padding:20px 16px;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:900px){.app{grid-template-columns:1fr;padding:14px}.sidebar{position:static;min-height:0}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.keyword-grid,.trajectory-delta,.era-card,.event-form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="evolution" aria-label="全站導覽"></nav></div>
<div class="app"><aside class="sidebar"><div class="brand"><h1>Evolution</h1><p>推演</p></div><nav class="nav" aria-label="推演功能">
<div class="nav-group"><div class="nav-label">01</div><button class="view-switch active" data-view="period"><strong>時期</strong><small>ERA · 起訖 · 狀態</small></button></div>
<div class="nav-group"><div class="nav-label">02</div><button class="view-switch" data-view="timeline"><strong>時間線</strong><small>事件 · State Before / After</small></button></div>
<div class="nav-group"><div class="nav-label">03</div><button class="view-switch" data-view="trend"><strong>趨勢</strong><small>跨時期關鍵字脈絡</small></button></div>
<div class="nav-group"><div class="nav-label">04</div><button class="view-switch" data-view="trajectory"><strong>軌跡</strong><small>時期轉折 · 關鍵字升降</small></button></div>
</nav></aside><main>
<section class="view" data-evolution-view="period"><header class="hero"><p>Period</p><h1>時期</h1><p>建立與維護時間跨度；只有進入本頁才載入時期資料。</p></header><div class="era-list" id="eraList"><div class="empty">載入時期資料…</div></div></section>
<section class="view" data-evolution-view="timeline" hidden><header class="hero"><p>Timeline</p><h1>時間線</h1><p>事件與狀態變化屬於推演；只有進入本頁才載入。</p></header><section class="panel"><form id="timelineEventForm" class="event-form"><input type="hidden" id="timelineEventId"><label>日期<input id="timelineEventDate" type="date" required></label><label>事件類型<input id="timelineEventType" value="transition"></label><label class="full">事件名稱<input id="timelineEventTitle" required></label><label class="full">描述<textarea id="timelineEventDescription"></textarea></label><label>State Before<textarea id="timelineEventBefore"></textarea></label><label>State After<textarea id="timelineEventAfter"></textarea></label><label>時期<select id="timelineEventPeriod"><option value="">未指定</option></select></label><label>狀態<select id="timelineEventStatus"><option value="current">Current</option><option value="released">Released</option><option value="archived">Archived</option></select></label><div class="full"><button type="submit">儲存事件</button></div></form><div class="event-list" id="timelineEventList"><div class="empty">載入事件…</div></div></section></section>
<section class="view" data-evolution-view="trend" hidden><header class="hero"><p>Trend</p><h1>趨勢</h1><p>只在進入趨勢時載入 LOC3／LOC6 時期分析。</p></header><div class="keyword-grid" id="trendGrid"><div class="empty">尚未載入。</div></div></section>
<section class="view" data-evolution-view="trajectory" hidden><header class="hero"><p>Trajectory</p><h1>軌跡</h1><p>只在進入軌跡時載入比較資料。</p></header><div class="trajectory-list" id="trajectoryList"><div class="empty">尚未載入。</div></div></section>
</main></div>
<script src="js/loc-nav.js"></script><script>
const API='https://script.google.com/macros/s/AKfycby_-G_G5EqwvIRguRw9DtAt-_v9953N7z9dav5UuHoRajv1IDbas0y4HqOcXXYOa2ei/exec';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const loaded=new Set();let periods=[],events=[],analysisPromise=null,periodModule=null;
async function ensurePeriods(){if(periodModule)return periodModule;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='js/loc-periods.js';s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});periodModule=window.LOCPeriods;return periodModule}
async function loadPeriod(){if(loaded.has('period'))return;loaded.add('period');const host=$('#eraList');try{const lp=await ensurePeriods(),d=await lp.load({force:true});periods=d.eras||[];host.innerHTML=periods.map(e=>`<form class="era-card" data-era-id="${esc(e.era_id||'')}"><label>代號<input name="period" value="${esc(e.period||'')}" readonly></label><label>名稱<input name="name" value="${esc(e.name||'')}"></label><label>開始<input type="date" name="start_date" value="${esc(e.start_date||'')}"></label><label>結束<input type="date" name="end_date" value="${esc(e.end_date||'')}"></label><label>狀態<select name="status"><option value="current" ${e.status==='current'?'selected':''}>Current</option><option value="released" ${e.status==='released'?'selected':''}>Released</option><option value="archived" ${e.status==='archived'?'selected':''}>Archived</option></select></label><label class="full">說明<textarea name="description">${esc(e.description||'')}</textarea></label><div class="full"><button type="submit">儲存時期</button></div></form>`).join('');host.querySelectorAll('.era-card').forEach((form,i)=>form.addEventListener('submit',ev=>savePeriod(ev,periods[i])))}catch(err){host.innerHTML='<div class="empty">時期資料載入失敗：'+esc(err.message)+'</div>'}}
async function savePeriod(ev,current){ev.preventDefault();const fd=new FormData(ev.currentTarget);const era={...current,name:String(fd.get('name')||''),start_date:String(fd.get('start_date')||''),end_date:String(fd.get('end_date')||'')||null,status:String(fd.get('status')||'current'),description:String(fd.get('description')||'')};era.display_label=(era.period&&era.name)?era.period+'｜'+era.name:(era.name||era.period);const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'update_era',era}),redirect:'follow'});const d=await r.json();if(!r.ok||d?.ok===false){alert('時期更新失敗：'+(d?.error||r.status));return}window.LOCPeriods.invalidate();loaded.delete('period');loadPeriod()}
async function loadTimeline(){if(loaded.has('timeline'))return;loaded.add('timeline');try{const lp=await ensurePeriods();await lp.load({force:true});await lp.fillSelect($('#timelineEventPeriod'),{includeAll:true,allLabel:'未指定'});const u=new URL(API);u.searchParams.set('action','events');u.searchParams.set('user_id','lo3rwang');const r=await fetch(u,{cache:'no-store'}),d=await r.json();events=Array.isArray(d)?d:(d.events||[]);renderEvents();resetEvent()}catch(err){$('#timelineEventList').innerHTML='<div class="empty">事件載入失敗：'+esc(err.message)+'</div>'}}
function renderEvents(){const lp=window.LOCPeriods,eras=lp?.peek()?.eras||[],host=$('#timelineEventList');host.innerHTML=[...events].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(e=>`<article class="event-card"><strong>${esc(e.event_title||e.title||'未命名事件')}</strong><small>${esc(e.date||'')} · ${esc(lp?.label(e.era||e.period,e.date,eras)||'')}</small><p>${esc(e.description||'')}</p><button data-edit="${esc(e.id)}">編輯</button> <button data-delete="${esc(e.id)}">刪除</button></article>`).join('')||'<div class="empty">尚無事件。</div>'}
function resetEvent(){const f=$('#timelineEventForm');f?.reset();$('#timelineEventId').value='';$('#timelineEventDate').value=new Date().toISOString().slice(0,10)}
function fillEvent(e){$('#timelineEventId').value=e.id||'';$('#timelineEventDate').value=e.date||'';$('#timelineEventType').value=e.event_type||'transition';$('#timelineEventTitle').value=e.event_title||e.title||'';$('#timelineEventDescription').value=e.description||'';$('#timelineEventBefore').value=e.state_before||'';$('#timelineEventAfter').value=e.state_after||'';$('#timelineEventPeriod').value=window.LOCPeriods.normalizePeriod(e.era||e.period||'');$('#timelineEventStatus').value=e.status||'current'}
async function postEvent(action,event){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,event}),redirect:'follow'}),d=await r.json();if(!r.ok||d?.ok===false)throw new Error(d?.error||'request failed');return d}
$('#timelineEventForm').addEventListener('submit',async ev=>{ev.preventDefault();const id=$('#timelineEventId').value,e={id:id||('EV-'+Date.now()),user_id:'lo3rwang',date:$('#timelineEventDate').value,event_type:$('#timelineEventType').value,event_title:$('#timelineEventTitle').value,description:$('#timelineEventDescription').value,state_before:$('#timelineEventBefore').value,state_after:$('#timelineEventAfter').value,era:$('#timelineEventPeriod').value,status:$('#timelineEventStatus').value,confidence:'recorded',system_id:'lo3rwang',primary_loc:'LOC8'};await postEvent(id?'update_event':'event',e);loaded.delete('timeline');loadTimeline()});$('#timelineEventList').addEventListener('click',async ev=>{const eb=ev.target.closest('[data-edit]');if(eb){const e=events.find(x=>String(x.id)===eb.dataset.edit);if(e)fillEvent(e);return}const db=ev.target.closest('[data-delete]');if(db&&confirm('刪除這筆事件？')){await postEvent('delete_event',{id:db.dataset.delete,user_id:'lo3rwang'});loaded.delete('timeline');loadTimeline()}});
async function loadAnalysis(){if(analysisPromise)return analysisPromise;const lp=await ensurePeriods();if(!lp.peek())await lp.load();analysisPromise=Promise.all([fetch('data/json/registries/LOC3_PERIOD_KEYWORD_ANALYSIS.json').then(r=>r.json()).catch(()=>({periods:[]})),fetch('data/json/registries/LOC6_PERIOD_KEYWORD_ANALYSIS.json').then(r=>r.json()).catch(()=>({periods:[]}))]);return analysisPromise}
async function renderTrend(){if(loaded.has('trend'))return;loaded.add('trend');const [loc3,loc6]=await loadAnalysis(),lp=window.LOCPeriods,eras=lp.peek()?.eras||[];const key=x=>lp.resolveDate(x?.start_date,eras)?.period||lp.normalizePeriod(String(x?.period||'')),m3=new Map((loc3.periods||[]).map(x=>[key(x),x])),m6=new Map((loc6.periods||[]).map(x=>[key(x),x]));$('#trendGrid').innerHTML=eras.map(e=>{const a=m3.get(e.period)||{},b=m6.get(e.period)||{},kws=[...(a.normalized_top_keywords||[]).slice(0,5).map(x=>x.term),...(b.keywords||[]).slice(0,5).map(x=>x.term)],uniq=[...new Set(kws)].slice(0,10);return `<article class="keyword-card"><strong>${esc(e.display_label||e.period)}</strong><small>${esc(e.start_date||'—')} ～ ${esc(e.end_date||'現在')}</small><div class="chips">${uniq.length?uniq.map(k=>`<span class="chip">${esc(k)}</span>`).join(''):'<span class="chip">尚無分析</span>'}</div></article>`}).join('')}
async function renderTrajectory(){if(loaded.has('trajectory'))return;loaded.add('trajectory');const [loc3]=await loadAnalysis(),lp=window.LOCPeriods,eras=lp.peek()?.eras||[];const key=x=>lp.resolveDate(x?.start_date,eras)?.period||lp.normalizePeriod(String(x?.period||'')),m3=new Map((loc3.periods||[]).map(x=>[key(x),x])),km=item=>new Map((item?.normalized_semantic_families||item?.normalized_top_keywords||[]).map(x=>[String(x.term||''),Number(x.percent||0)])),cards=[];for(let i=1;i<eras.length;i++){const from=eras[i-1],to=eras[i],a=km(m3.get(from.period)||{}),b=km(m3.get(to.period)||{}),terms=new Set([...a.keys(),...b.keys()]),rows=[...terms].map(term=>({term,delta:Number(((b.get(term)||0)-(a.get(term)||0)).toFixed(1))})),up=rows.filter(x=>x.delta>0).sort((x,y)=>y.delta-x.delta).slice(0,4),down=rows.filter(x=>x.delta<0).sort((x,y)=>x.delta-y.delta).slice(0,4);cards.push(`<article class="trajectory-card"><strong>${esc(from.display_label||from.period)} → ${esc(to.display_label||to.period)}</strong><div class="trajectory-delta"><div><b>比重上升</b><div class="chips">${up.map(x=>`<span class="chip">${esc(x.term)} +${x.delta}pt</span>`).join('')||'<span class="chip">尚無足夠資料</span>'}</div></div><div><b>比重下降</b><div class="chips">${down.map(x=>`<span class="chip">${esc(x.term)} ${x.delta}pt</span>`).join('')||'<span class="chip">尚無足夠資料</span>'}</div></div></div></article>`)}$('#trajectoryList').innerHTML=cards.join('')||'<div class="empty">目前沒有足夠資料。</div>'}
function switchView(name,update=true){const valid=['period','timeline','trend','trajectory'];if(!valid.includes(name))name='period';$$('[data-evolution-view]').forEach(v=>v.hidden=v.dataset.evolutionView!==name);$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(update)history.replaceState(null,'','evolution.html#'+name);if(name==='period')loadPeriod();if(name==='timeline')loadTimeline();if(name==='trend')renderTrend();if(name==='trajectory')renderTrajectory()}
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));const initial=['period','timeline','trend','trajectory'].includes(location.hash.slice(1))?location.hash.slice(1):'period';switchView(initial,false);
</script><footer class="loc-site-footer"><div><a href="index.html">LOC月典(LunaCodex)</a></div><div>By <a href="lo3rwang.html">Lucas Oscar Wang 政德</a></div></footer></body></html>
