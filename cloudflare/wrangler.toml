name = "loc-state"
main = "loc-state-worker.js"
compatibility_date = "2026-09-12"

# Copy to wrangler.toml, create one KV namespace, then fill the real ids.
[[kv_namespaces]]
binding = "LOC_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"

[vars]
PUBLIC_ORIGIN = "https://loc.lo3rwang.cc"

# Never commit LOC_WRITE_TOKEN here.
# Set it with: wrangler secret put LOC_WRITE_TOKEN
