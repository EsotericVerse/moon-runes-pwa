<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="refresh" content="0; url=search.html?content_type=knowledge" />
<link rel="canonical" href="search.html" />
<title>知識庫搜尋已整合至 LOC 搜尋引擎</title>
<script>
  const p=new URLSearchParams(location.search);
  const target=new URL('search.html',location.href);
  target.searchParams.set('content_type','knowledge');
  const q=p.get('q')||p.get('query');
  if(q) target.searchParams.set('q',q);
  location.replace(target.href);
</script>
</head>
<body>
<p>FAQ／知識庫搜尋已整合至 <a href="search.html?content_type=knowledge">LOC 搜尋引擎</a>。</p>
</body>
</html>
