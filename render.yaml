services:
  - type: web
    name: fortune-api
    runtime: python
    rootDir: card_api
    buildCommand: pip install -r requirements.txt && python build_facebook_keyword_index.py && python build_threads_search_index.py && python build_loc4_runtime_index.py
    startCommand: uvicorn runtime_text_bundle:app --host 0.0.0.0 --port $PORT
