<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07182d">
<title>統計｜LOC 月典</title>
<meta name="description" content="LOC 統計：排行榜、符文統計、來源管理與匯入入口。">
<link rel="canonical" href="https://loc.lo3rwang.cc/statics.html">
<link rel="stylesheet" href="css/loc-nav.css">
<style>
:root{color-scheme:dark;--bg:#07182d;--panel:#10233c;--line:rgba(190,174,255,.2);--text:#f7f3ff;--muted:#b8c1d2;--gold:#e7c27d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07182d,#07111f);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}.page{width:min(1120px,calc(100% - 28px));margin:auto;padding:30px 0 60px}.hero{padding:18px 0 26px}.hero h1{margin:0;font-size:clamp(2.5rem,7vw,5rem)}.hero p{max-width:760px;color:var(--muted)}section{padding:28px 0;border-top:1px solid var(--line)}h2{margin:0 0 8px}.card{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.card p{margin:0;color:var(--muted)}.card a{color:var(--gold)}
.daily-record-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.daily-record-form,.daily-stats-panel{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.12)}.daily-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.daily-form-grid label{display:grid;gap:5px;color:var(--muted);font-size:.8rem}.daily-form-grid .full{grid-column:1/-1}.daily-form-grid input,.daily-form-grid select{min-height:40px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#0b1d31;color:var(--text)}.daily-record-submit{margin-top:12px;padding:9px 13px;border:0;border-radius:9px;background:var(--gold);color:#17120a;font-weight:800}.daily-record-status{margin-top:9px;color:var(--muted);font-size:.8rem}.daily-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.daily-metrics>div{padding:10px;border:1px solid var(--line);border-radius:10px}.daily-metrics small,.daily-metrics strong{display:block}.daily-history-list{display:grid;gap:7px}.daily-history-row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;padding:8px;border-bottom:1px solid var(--line)}.daily-history-pagination{margin-top:12px}.daily-history-pages{display:flex;gap:5px;flex-wrap:wrap}.daily-page-btn{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text)}@media(max-width:720px){.daily-record-grid,.daily-form-grid{grid-template-columns:1fr}.daily-form-grid .full{grid-column:auto}.daily-history-row{grid-template-columns:1fr}}
</style>
</head>
<body class="loc-responsive-page">
<div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="statics" aria-label="全站導覽"></nav></div>
<main class="page">
<header class="hero"><h1>統計</h1><p>把排行榜、符文統計與資料來源管理集中到同一頁；匯入功能目前保留位置，暫不開放。</p></header>
<section id="ranking"><h2>排行榜</h2><div class="card"><p>現有排行榜功能仍可從 <a href="search.html#rankingView">搜尋資料排行榜</a> 開啟；後續統一搬入此頁。</p></div></section>
<section id="runes"><h2>符文統計</h2><div class="card"><p>符文統計集中入口。月之符文頁的「符文統計」導覽會指向此區。</p></div></section>
<section id="sources"><h2>來源管理</h2><div class="card"><p>集中檢視搜尋資料來源、筆數、時間範圍與分類。</p></div></section>
<section id="daily"><h2>每日符文</h2><div class="card"><p>每日符文的手動紀錄與趨勢統計集中在這裡；線上即時抽牌仍由 Lots 處理。</p><div class="daily-record-grid"><form class="daily-record-form" id="dailyRecordForm"><h3>手動記錄實體牌</h3><div class="daily-form-grid"><label>日期<input id="dailyRecordDate" type="date" required></label><label>類型<select id="dailyRecordKind"><option value="daily_draw">主抽</option><option value="daily_draw_supplement">補抽</option></select></label><label>符文<select id="dailyRecordRune" required><option value="">選擇符文</option></select></label><label>方向<select id="dailyRecordDirection"><option>正位</option><option>半正位</option><option>半逆位</option><option>逆位</option></select></label><label class="full">備註<input id="dailyRecordNote" type="text" placeholder="可留空"></label></div><button class="daily-record-submit" type="submit">儲存紀錄</button><div class="daily-record-status" id="dailyRecordStatus">尚未寫入任何資料。</div></form><div class="daily-stats-panel"><h3>每日符文趨勢統計</h3><p id="dailyStatsStatus">載入已記錄的每日符文資料…</p><div class="daily-metrics"><div><small>紀錄數</small><strong id="dailyMetricCount">—</strong></div><div><small>主抽</small><strong id="dailyMetricPrimary">—</strong></div><div><small>補抽</small><strong id="dailyMetricSupplement">—</strong></div></div><div class="daily-history-list" id="dailyHistoryList"></div><div class="daily-history-pagination" id="dailyHistoryPagination" hidden><div id="dailyHistoryPageInfo"></div><div id="dailyHistoryPages"></div></div></div></div></div></section>
<section id="import"><h2>匯入</h2><div class="card"><p>匯入網頁暫時不開放，先保留功能位置。</p></div></section>
</main>
<script src="js/loc-nav.js" defer></script>
<script type="module" src="js/rune-daily-records.js?v=20260908-1"></script>
</body>
</html>
