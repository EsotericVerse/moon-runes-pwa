<h1>Lucas Oscar Wang 政德</h1>
<p class="lead">自稱<strong>文字工匠</strong>、<strong>語言治理架構者</strong>、<strong>校對者</strong>。</p>

<section class="profile-block" id="governance-root">
<p><strong>鑑古知今，求同存異。</strong><br>
<strong>不在其位，不謀其政。</strong><br>
<strong>隨心所欲，而不逾己。</strong></p>
</section>

<section class="profile-block" id="intro">
<p>我用 LOC 整理語言，也整理我自己。</p>
<p>你可以不用同意我，也可以不用理解我。若我的文字對你有所幫助，歡迎進來看看，但我絕對不勉強。</p>
</section>
