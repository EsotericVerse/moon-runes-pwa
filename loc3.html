<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="refresh" content="0; url=search.html?content_type=lyrics_work" />
<link rel="canonical" href="search.html" />
<title>音樂搜尋已整合至綜合搜尋</title>
<script>
  const q=new URLSearchParams(location.search);
  const target=new URL('search.html',location.href);
  target.searchParams.set('content_type','lyrics_work');
  if(q.get('q')) target.searchParams.set('q',q.get('q'));
  location.replace(target.href);
</script>
</head>
<body>
<p>LOC3 歌曲搜尋已整合至 <a href="search.html?content_type=lyrics_work">Unified Search</a>。</p>
</body>
</html>
