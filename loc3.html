<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081522" />
  <meta name="description" content="LOC3 政德風歌詞語意搜尋，從情緒、道理命題、狀態紀錄、轉折與落點尋找此刻適合的歌。" />
  <title>LOC3｜歌詞語意搜尋</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <style>
    :root{color-scheme:dark;--bg:#07131f;--panel:rgba(12,29,43,.88);--soft:rgba(19,43,58,.72);--line:rgba(160,214,220,.18);--text:#f2f7f6;--muted:#aebfc1;--moon:#d9f0e8;--mint:#7ed8c5;--gold:#e5c17b;--danger:#ffb4ad;--shadow:0 24px 70px rgba(0,0,0,.34)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% 5%,rgba(74,143,145,.23),transparent 31rem),radial-gradient(circle at 88% 82%,rgba(84,74,151,.18),transparent 28rem),var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.65}
    a{color:inherit}.page{width:min(1080px,calc(100% - 30px));margin:auto;padding:28px 0 60px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:34px}.brand{font-weight:850;letter-spacing:.12em;text-decoration:none}.navs{display:flex;gap:14px;flex-wrap:wrap}.nav{color:var(--muted);font-size:.86rem;text-decoration:none}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:end;margin-bottom:25px}.eyebrow{margin:0 0 8px;color:var(--mint);font-weight:800;font-size:.76rem;letter-spacing:.18em}.hero h1{margin:0;font-size:clamp(2.3rem,7vw,4.6rem);line-height:1.05;letter-spacing:-.045em}.intro{margin:15px 0 0;color:var(--muted);max-width:690px}.countbox{text-align:right;color:var(--muted);font-size:.86rem}.countbox strong{display:block;color:var(--moon);font-size:2rem;line-height:1.1}
    .search-panel{padding:clamp(18px,4vw,32px);border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(16px)}label{display:block;margin-bottom:9px;font-weight:750}textarea{width:100%;min-height:112px;padding:16px 18px;color:var(--text);font:inherit;resize:vertical;border:1px solid rgba(255,255,255,.16);border-radius:15px;background:rgba(0,0,0,.18);outline:none}textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(126,216,197,.12)}
    .examples{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 20px}.chip{padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--soft);font:inherit;font-size:.82rem;cursor:pointer}.chip:hover{color:var(--text);border-color:var(--mint)}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}select{width:100%;padding:10px 12px;color:var(--text);border:1px solid var(--line);border-radius:11px;background:#102535;font:inherit}.actions{display:flex;align-items:center;gap:12px}.submit{padding:12px 22px;border:0;border-radius:12px;color:#07131f;background:linear-gradient(135deg,var(--moon),var(--mint));font:inherit;font-weight:850;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.hint{color:var(--muted);font-size:.82rem}
    .status{min-height:28px;margin:20px 2px 8px;color:var(--muted)}.status.error{color:var(--danger)}.results{display:grid;gap:15px}.card{position:relative;padding:22px;border:1px solid var(--line);border-radius:19px;background:var(--panel);box-shadow:0 12px 35px rgba(0,0,0,.18)}.rank{position:absolute;right:18px;top:18px;color:var(--mint);font-size:.77rem;font-weight:800}.card h2{margin:0 60px 7px 0;font-size:1.34rem}.meta,.tags{display:flex;flex-wrap:wrap;gap:7px}.pill{padding:3px 8px;border-radius:999px;color:var(--muted);background:var(--soft);font-size:.75rem}.summary{margin:15px 0;color:#d6e0df}.arc{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:8px;margin:14px 0;padding:12px;border-radius:13px;background:rgba(0,0,0,.17);font-size:.83rem}.arc b{color:var(--mint);font-weight:700}.arrow{color:var(--gold)}.evidence{margin:12px 0;color:var(--muted);font-size:.88rem;border-left:2px solid var(--gold);padding-left:12px}.keywordline{margin:10px 0 2px;color:var(--muted);font-size:.84rem}.keywordline strong{color:var(--gold)}.playrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}.play{display:inline-flex;padding:9px 14px;border-radius:10px;text-decoration:none;background:var(--mint);color:#07131f;font-weight:850}.secondary{padding:8px 11px;border:1px solid var(--line);border-radius:10px;color:var(--muted);background:transparent;font:inherit;cursor:pointer}details{margin-top:12px;color:var(--muted);font-size:.86rem}details a{color:var(--gold)}.empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}footer{margin-top:32px;color:var(--muted);font-size:.8rem;text-align:center}
    @media(max-width:720px){.hero{grid-template-columns:1fr}.countbox{text-align:left}.filters{grid-template-columns:1fr}.arc{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:center}.actions{align-items:flex-start;flex-direction:column}.submit{width:100%}.topbar{align-items:flex-start;flex-direction:column}}
  </style>
  <link rel="stylesheet" href="css/loc-nav.css" />
</head>
<body>
  <div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="music" aria-label="全站導覽"></nav></div>
  <main class="page">
    <header class="hero"><div><p class="eyebrow">LOC3 · LYRICS SEMANTIC SEARCH</p><h1>此刻，想聽<br />什麼樣的歌？</h1><p class="intro">不必記得歌名。描述你的情緒、處境、想法或正在思考的道理，從歌詞的情緒、命題、狀態、轉折與落點找到適合的作品。</p></div><div class="countbox"><strong id="workCount">403</strong>組唯一歌詞作品<br />同詞旋律已合併呈現</div></header>
    <section class="search-panel">
      <form id="searchForm">
        <label for="query">用一句話描述現在</label>
        <textarea id="query" maxlength="500" placeholder="例如：我想離開一段一直消耗自己的關係，但仍想保留對未來的相信。" required></textarea>
        <div class="examples" id="examples"></div>
        <div class="filters">
          <select id="period"><option value="">所有創作時期</option></select>
          <select id="category"><option value="">所有歌詞類型</option></select>
          <select id="playlist"><option value="">所有主題播放清單</option></select>
        </div>
        <div class="actions"><button class="submit" id="submit" type="submit">尋找歌曲</button><span class="hint">語意只決定作品；播放數與作者偏好只挑選同詞版本。</span></div>
      </form>
    </section>
    <div class="status" id="status" aria-live="polite"></div>
    <section class="results" id="results"></section>
    <footer>LOC3 Music · 政德風歌詞語意實驗 · 搜尋結果不是心理或醫療建議</footer>
  </main>
  <script>
    const API='https://moon-runes-pwa.onrender.com';
    const prompts=['想離開消耗自己的關係，重新找回界線','很疲憊，但還想留一點希望','終於自由了，卻不知道下一步往哪裡','想聽幸福而安穩的日常','失去重要的人，想好好告別','不再配合別人的劇本，拿回選擇權','送給朋友的生日祝福','一個人走了很久，仍願意相信未來'];
    const el=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function examples(){el('examples').innerHTML=prompts.slice(0,6).map(x=>`<button type="button" class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{el('query').value=b.dataset.q;el('query').focus()})}
    async function eraLabels(){try{const r=await fetch('data/shared/LOC_ERA_REGISTRY.json',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();return Object.fromEntries((d.eras||[]).map(x=>[String(x.period||'').toLowerCase(),x.display_label||x.period]))}catch(_){return {}}}
    function options(id,items,labelMap){const select=el(id);select.length=1;(items||[]).forEach(item=>{const o=document.createElement('option');o.value=item.value;const key=String(item.value||'').toLowerCase();const label=labelMap?.[key]||item.label||item.value;o.textContent=`${label}（${item.count}）`;select.appendChild(o)})}
    function applyFacets(d,periodLabels){if(!d?.facets)return;el('workCount').textContent=d.dataset?.work_count??'—';options('period',d.facets.periods,periodLabels);options('category',d.facets.categories);options('playlist',d.facets.playlists)}
    async function facets(){
      const periodLabels=await eraLabels();
      try{
        const local=await fetch('data/shared/LOC3_FACETS.json',{cache:'no-store'});
        if(local.ok)applyFacets(await local.json(),periodLabels);
      }catch(_){}
      try{
        const r=await fetch(`${API}/loc3/facets`);
        if(!r.ok)throw new Error('facets API unavailable');
        applyFacets(await r.json(),periodLabels);
      }catch(_){
        /* 下拉選單已由本機 facets 提供；Render 喚醒不影響 option 顯示。 */
      }
    }
    function version(v,label='在 Suno 播放'){if(!v)return'';const preview=v.ig_preview_url?`<a class="play" href="${esc(v.ig_preview_url)}" target="_blank" rel="noopener">觀看 Reels ↗</a>`:'';return `<a class="play" href="${esc(v.suno_url)}" target="_blank" rel="noopener">${label} ↗</a>${preview}<span class="hint">${Number(v.plays||0).toLocaleString()} 次播放 · ${Number(v.likes||0).toLocaleString()} 個喜歡</span>`}
    function card(r){
      const alt=r.alternate_versions||[];
      const keys=(r.matched_terms&&r.matched_terms.length?r.matched_terms:r.semantic_keywords||r.tags||[]).slice(0,8);
      const rational=r.discourse_mode?'<span class="pill">'+esc(r.discourse_mode)+'</span>':'';
      const finalLabel=r.final_state||((r.semantic_completion==='complete_without_emotion')?'不需強制落點':'落點未標示');
      const melody=r.recommended_version?.style_prompt?'<details><summary>旋律／編曲資訊</summary><p>'+esc(r.recommended_version.style_prompt)+'</p></details>':'';
      return `<article class="card"><span class="rank">#${r.rank} · ${(r.score*100).toFixed(1)}%</span><h2>${esc(r.title)}</h2><div class="meta"><span class="pill">${esc(r.period||'未分期')}</span>${r.era_name?`<span class="pill">${esc(r.era_name)}</span>`:''}<span class="pill">歌詞類型：${esc(r.category||'待分類')}</span>${rational}${r.ending_structure?`<span class="pill">${esc(r.ending_structure)}</span>`:''}${r.version_count>1?`<span class="pill">同詞 ${r.version_count} 個旋律版本</span>`:''}</div>${r.summary?`<p class="summary">${esc(r.summary)}</p>`:''}${keys.length?`<div class="keywordline"><strong>關鍵字／命題：</strong> ${keys.map(esc).join(' · ')}</div>`:''}<div class="arc"><b>${esc(r.start_state||'起點未標示')}</b><span class="arrow">→</span><b>${esc(r.turn_method||'轉折未標示')}</b><span class="arrow">→</span><b>${esc(finalLabel)}</b></div><div class="playrow">${version(r.recommended_version)}</div>${melody}${alt.length?`<details><summary>另外 ${alt.length} 個同詞旋律版本</summary>${alt.map((v,i)=>`<p>${version(v,`播放版本 ${i+2}`)}</p>`).join('')}</details>`:''}</article>`}
    el('searchForm').onsubmit=async e=>{e.preventDefault();const q=el('query').value.trim();if(!q)return;el('submit').disabled=true;el('status').className='status';el('status').textContent='正在穿過歌詞，尋找相近的轉折……';el('results').innerHTML='';try{const body={query:q,top_k:8,period:el('period').value,category:el('category').value,playlist:el('playlist').value};const r=await fetch(`${API}/loc3/search`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'搜尋失敗');el('status').textContent=d.count?`找到 ${d.count} 組歌詞作品。相似度用於相對排序，不代表作品好壞。`:'目前沒有足夠接近的作品，換一種說法再試一次。';el('results').innerHTML=d.count?d.results.map(card).join(''):'<div class="empty">沒有硬湊答案。這次，月光先留白。</div>'}catch(err){el('status').className='status error';el('status').textContent=`暫時無法搜尋：${err.message}。若 Render 剛休眠，請稍候約一分鐘再試。`}finally{el('submit').disabled=false}};
    examples();facets();
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js'));
  </script>
  <script src="js/loc-nav.js"></script>
</body>
</html>
