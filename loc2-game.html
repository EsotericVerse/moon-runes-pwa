<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07182d">
<title>月符沙盒遊戲｜Alpha</title>
<style>
:root{color-scheme:dark;--bg:#07182d;--panel:#10233c;--soft:#172f50;--line:rgba(190,174,255,.22);--text:#f7f3ff;--muted:#b8c1d2;--purple:#b49eff;--gold:#e7c27d;--danger:#ff9d9d;--ok:#9fe0ba}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(114,83,184,.22),transparent 28rem),linear-gradient(180deg,#07182d,#07111f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;line-height:1.55}
a{color:var(--gold);text-decoration:none}.wrap{width:min(1180px,calc(100% - 26px));margin:auto;padding:22px 0 56px}
nav{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.brand{font-weight:900;margin-right:auto}
.hero,.panel{border:1px solid var(--line);background:rgba(16,35,60,.9);border-radius:20px;padding:20px}.hero h1{margin:.15em 0;font-size:clamp(2rem,6vw,4rem)}
.muted{color:var(--muted)}.board{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:14px;margin-top:14px}.player,.event,.log{border:1px solid var(--line);background:rgba(16,35,60,.92);border-radius:18px;padding:16px}
.score{font-size:2rem;font-weight:900;color:var(--gold)}.turn{outline:2px solid var(--purple)}
.event h2{margin:.2em 0}.req{font-weight:900;color:var(--gold);font-size:1.15rem}.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.rune{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px;min-height:116px;cursor:pointer;color:var(--text);text-align:left}.rune.selected{outline:2px solid var(--gold);transform:translateY(-2px)}.rune b{display:block;font-size:1.25rem}.tag{display:inline-block;margin-top:8px;padding:2px 7px;border-radius:999px;background:#243f62;color:#d9e5f5;font-size:.72rem}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:999px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#c7b7ff,#e8c57f);color:#171021;border:0}.btn:disabled{opacity:.45;cursor:not-allowed}
.status{padding:12px 14px;border-left:3px solid var(--gold);background:rgba(231,194,125,.07);border-radius:8px;color:var(--muted)}.log{margin-top:14px;max-height:260px;overflow:auto}.log p{margin:7px 0;color:var(--muted)}.log strong{color:var(--text)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.legend div{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:.82rem}
@media(max-width:900px){.board{grid-template-columns:1fr}.hand{grid-template-columns:repeat(5,minmax(80px,1fr));overflow:auto}.legend{grid-template-columns:repeat(2,1fr)}} 
</style>
</head><body><main class="wrap">
<nav><a class="brand" href="loc2.html">月符沙盒遊戲</g/a><a href="loc2.html">規則文件</a><a href="index.html">LOC 首頁</a></nav>
<section class="hero"><div class="muted">Playable Alpha · Local Two Player</div><h1>抽牌，回答世界。</h1><p class="muted">兩位玩家共用事件牌，但各自擁有一套 1–64 符文牌庫。每回合各出三張牌，依事件需求計算覆蓋；先取得並守住 16 De 的玩家勝利。</p>
<div class="controls"><button class="btn primary" id="newGame">開始新遊戲</button><button class="btn" id="newEvent" disabled>下一事件</button></div>
<div id="status" class="status">按「開始新遊戲」建立牌局。</div>
<div class="legend"><div><b>SL</b> 靈魂／生命</div><div><b>ML</b> 連結／礦物</div><div><b>NE</b> 自然／元素</div><div><b>OC</b> 秩序／無序</div></div>
</section>
<section class="board">
<div class="player" id="p0"><div class="muted">PLAYER A</div><div class="score"><span id="score0">0</span> De</div><div class="muted">牌庫 <span id="deck0">64</span></div><div class="hand" id="hand0"></div></div>
<div class="event"><div class="muted" id="eventId">EVENT</div><h2 id="eventName">尚未開始</h2><div class="req" id="eventReq">—</div><p id="eventDesc" class="muted">世界還沒有提出問題。</p><div class="controls"><button class="btn primary" id="submit" disabled>送出三張符文</button><button class="btn" id="resonate" disabled>自我共振 +1</button><button class="btn" id="disrupt" disabled>破壞性共振 −2</button></div><div id="result" class="status">每位玩家每回合先選三張牌。</div></div>
<div class="player" id="p1"><div class="muted">PLAYER B</div><div class="score"><span id="score1">0</span> De</div><div class="muted">牌庫 <span id="deck1">64</span></div><div class="hand" id="hand1"></div></div>
</section>
<section class="log"><strong>對局紀錄</strong><div id="log"></div></section>
</main><script type="module" src="js/loc2-game.js"></script></body></html>
