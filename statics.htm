<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07182d">
<title>統計｜LOC 月典</title>
<meta name="description" content="LOC 統計：排行榜、符文統計、來源管理與匯入入口。">
<link rel="stylesheet" href="css/loc-nav.css">
<style>
:root{color-scheme:dark;--bg:#07182d;--panel:#10233c;--line:rgba(190,174,255,.2);--text:#f7f3ff;--muted:#b8c1d2;--gold:#e7c27d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07182d,#07111f);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}.page{width:min(1120px,calc(100% - 28px));margin:auto;padding:30px 0 60px}.hero{padding:18px 0 26px}.hero h1{margin:0;font-size:clamp(2.5rem,7vw,5rem)}.hero p{max-width:760px;color:var(--muted)}section{padding:28px 0;border-top:1px solid var(--line)}h2{margin:0 0 8px}.card{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.card p{margin:0;color:var(--muted)}.card a{color:var(--gold)}
</style>
</head>
<body class="loc-responsive-page">
<div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="statics" aria-label="全站導覽"></nav></div>
<main class="page">
<header class="hero"><h1>統計</h1><p>把排行榜、符文統計與資料來源管理集中到同一頁；匯入功能目前保留位置，暫不開放。</p></header>
<section id="ranking"><h2>排行榜</h2><div class="card"><p>現有排行榜功能仍可從 <a href="search.html#rankingView">搜尋資料排行榜</a> 開啟；後續統一搬入此頁。</p></div></section>
<section id="runes"><h2>符文統計</h2><div class="card"><p>符文統計集中入口。月之符文頁的「符文統計」導覽會指向此區。</p></div></section>
<section id="sources"><h2>來源管理</h2><div class="card"><p>集中檢視搜尋資料來源、筆數、時間範圍與分類。</p></div></section>
<section id="import"><h2>匯入</h2><div class="card"><p>匯入網頁暫時不開放，先保留功能位置。</p></div></section>
</main>
<script src="js/loc-nav.js" defer></script>
</body>
</html>
