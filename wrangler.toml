name = "loc-state"
main = "cloudflare/loc-state-worker.js"
compatibility_date = "2026-09-12"
workers_dev = true
preview_urls = false

# Dedicated Worker origin. Cloudflare creates/manages DNS and TLS for this hostname.
[[routes]]
pattern = "api.lo3rwang.cc"
custom_domain = true

# Temporary compatibility route. Keep until api.lo3rwang.cc is verified in production.
[[routes]]
pattern = "loc.lo3rwang.cc/api/loc-state/*"
zone_name = "lo3rwang.cc"

[[kv_namespaces]]
binding = "LOC_KV"
id = "69132df38f8f43a6a40cae39ebfe5460"

[vars]
PUBLIC_ORIGIN = "https://loc.lo3rwang.cc"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# Never commit LOC_WRITE_TOKEN here.
# Keep it as a Cloudflare Worker secret.
