<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOC KM Upload</title>
<link rel="stylesheet" href="css/loc-responsive.css"><link rel="stylesheet" href="css/loc-nav.css">
<style>
:root{color-scheme:dark;--bg:#07131f;--panel:#0d2030;--line:rgba(160,214,220,.2);--text:#f2f7f6;--muted:#aebfc1;--mint:#7ed8c5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
main{width:min(820px,calc(100% - 28px));margin:auto;padding:40px 0 70px}.card{padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
h1{margin:.2rem 0 1rem;font-size:clamp(2rem,7vw,3.7rem)}p{color:var(--muted);line-height:1.7}.drop{display:block;margin:20px 0;padding:28px;border:1px dashed var(--line);border-radius:16px;text-align:center;cursor:pointer}
input[type=file]{display:none}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:11px 16px;border:1px solid var(--line);border-radius:11px;background:#173447;color:var(--text);font:inherit;font-weight:800;cursor:pointer}.btn.primary{background:var(--mint);color:#07131f;border:0}.btn:disabled{opacity:.45}
pre{white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;padding:14px;border-radius:12px;background:#06121d;color:#d8e5e4}.status{margin-top:16px;color:var(--muted)}.ok{color:var(--mint)}.err{color:#ffb4ad}
.meta{margin:14px 0;color:var(--muted);font-size:.9rem}
</style>
<style id="loc-site-footer-style">
.loc-site-footer{margin-top:32px;padding:20px 16px;text-align:center;font-size:13px;line-height:1.6;color:var(--muted,#7f8794);border-top:1px solid var(--line,rgba(127,135,148,.22))}
.loc-site-footer a{color:inherit;text-decoration:none}
.loc-site-footer a:hover{text-decoration:underline}
.loc-site-footer span{margin:0 6px;opacity:.8}
</style>
</head>
<body class="loc-responsive-page">
<div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="km-upload" aria-label="全站導覽"></nav></div>
<main>
<p>LOC7 · Knowledge Intake</p><h1>KM JSON Upload</h1>
<p>把更新後的 JSON 直接送進 KM inbox。頁面只負責驗證 JSON 與上傳，不在瀏覽器保存任何 GitHub token。</p>
<section class="card">
<label class="drop" for="file"><strong>選擇 JSON</strong><br><span id="fileName">尚未選擇檔案</span></label>
<input id="file" type="file" accept=".json,application/json">
<div class="meta" id="meta"></div>
<div class="row">
<button class="btn primary" id="upload" disabled>上傳進 KM</button>
<button class="btn" id="clear" type="button">清除</button>
</div>
<div class="status" id="status"></div>
<pre id="preview" hidden></pre>
</section>
</main>
<script src="js/loc-nav.js"></script>
<script>
const API='https://moon-runes-pwa.onrender.com';
let current=null;
const el=id=>document.getElementById(id);
el('file').addEventListener('change',async()=>{
 const f=el('file').files[0]; current=null; el('upload').disabled=true; el('status').textContent='';
 if(!f)return;
 el('fileName').textContent=f.name;
 try{
   const text=await f.text(); const data=JSON.parse(text);
   current={filename:f.name,data};
   const count=Array.isArray(data)?data.length:(data&&typeof data==='object'?Object.keys(data).length:0);
   el('meta').textContent=`${(f.size/1024).toFixed(1)} KB · 頂層 ${count} 項 · JSON 格式正常`;
   el('preview').hidden=false; el('preview').textContent=JSON.stringify(data,null,2).slice(0,12000);
   el('upload').disabled=false;
 }catch(e){el('status').className='status err';el('status').textContent='JSON 格式錯誤：'+e.message;el('preview').hidden=true;}
});
el('clear').onclick=()=>{el('file').value='';current=null;el('fileName').textContent='尚未選擇檔案';el('meta').textContent='';el('status').textContent='';el('preview').hidden=true;el('upload').disabled=true;};
el('upload').onclick=async()=>{
 if(!current)return; el('upload').disabled=true; el('status').className='status';el('status').textContent='上傳中…';
 try{
  const r=await fetch(API+'/km/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...current,source:'km_upload_page'})});
  const d=await r.json(); if(!r.ok)throw new Error(d.detail||'上傳失敗');
  el('status').className='status ok';
  el('status').textContent=d.mode==='github'?`已寫入 GitHub KM：${d.path}`:`已寫入暫存 KM inbox：${d.path}（尚未啟用 GitHub 持久寫入）`;
 }catch(e){el('status').className='status err';el('status').textContent=e.message;}
 finally{el('upload').disabled=false;}
};
</script>
