<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07182d">
<title>搜尋｜LOC 月典</title>
<meta name="description" content="LOC 月典全站搜尋。搜尋頁只負責搜尋，不載入排行榜、統計、時期或其他工作區。">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/loc-nav.css">
<style>
:root{color-scheme:dark;--bg:#07182d;--panel:rgba(12,29,48,.88);--line:rgba(180,158,255,.2);--text:#f5f1ff;--muted:#b7bfd0;--gold:#e7c27d;--mint:#8ed8c8;--danger:#ffb4ad}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 10% 8%,rgba(103,75,171,.22),transparent 30rem),linear-gradient(180deg,#07182d,#06111f);line-height:1.65}.page{width:min(1040px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.hero{margin:18px 0 20px}.hero p{margin:0;color:var(--muted)}.hero h1{margin:3px 0 0;font-size:clamp(2rem,6vw,4.4rem);line-height:1.05}.search-panel,.source-summary,.result-card{border:1px solid var(--line);border-radius:18px;background:var(--panel)}.search-panel{padding:18px}.search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.search-input{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#0d2139;color:var(--text);font:inherit;outline:none}.search-input:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(142,216,200,.1)}.search-button{min-width:92px;border:0;border-radius:12px;background:linear-gradient(135deg,#d9f0e8,#8ed8c8);color:#07131f;font:inherit;font-weight:850;cursor:pointer}.search-button:disabled{opacity:.55;cursor:wait}.source-summary{margin-top:12px;padding:10px 14px;color:var(--muted);font-size:.78rem}.source-summary strong{color:var(--text)}.status{min-height:28px;margin:18px 2px 8px;color:var(--muted)}.status.error{color:var(--danger)}.results{display:grid;gap:12px}.result-card{padding:17px}.result-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px}.pill{padding:2px 8px;border-radius:999px;background:rgba(180,158,255,.08);color:var(--muted);font-size:.72rem}.result-card h2{margin:0;font-size:1.08rem}.result-card p{margin:8px 0 0;color:#d7ddeb;white-space:pre-wrap}.result-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.result-links a{display:inline-flex;padding:7px 10px;border:1px solid var(--line);border-radius:10px;color:var(--gold);text-decoration:none;font-size:.78rem;font-weight:800}.empty{padding:24px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}.loc-site-footer{margin-top:34px;padding:18px;text-align:center;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line)}@media(max-width:620px){.search-row{grid-template-columns:1fr}.search-button{min-height:46px}}
</style>
</head>
<body>
<div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="search" aria-label="全站導覽"></nav></div>
<main class="page">
<header class="hero"><p>LOC · Search</p><h1>搜尋</h1><p>只做全站搜尋。排行榜、資料來源管理與其他統計功能已獨立到統計頁。</p></header>
<section class="search-panel" aria-label="搜尋">
<form id="searchForm" class="search-row" role="search">
<label class="sr-only" for="query">搜尋文字</label>
<input id="query" class="search-input" type="search" autocomplete="off" placeholder="輸入文字搜尋" required>
<button id="submit" class="search-button" type="submit">搜尋</button>
</form>
<div id="sourceSummary" class="source-summary">搜尋資料：讀取靜態摘要中…</div>
</section>
<div id="status" class="status" role="status" aria-live="polite"></div>
<section id="results" class="results" aria-label="搜尋結果"></section>
<footer class="loc-site-footer">LOC 月典 · Search</footer>
</main>
<script src="js/search-source-stats.js"></script>
<script src="js/loc-nav.js"></script>
<script>
(() => {
  'use strict';
  const API='https://moon-runes-pwa.onrender.com';
  const form=document.getElementById('searchForm');
  const input=document.getElementById('query');
  const button=document.getElementById('submit');
  const status=document.getElementById('status');
  const results=document.getElementById('results');
  const sourceSummary=document.getElementById('sourceSummary');

  const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const fmt=value=>Number.isFinite(Number(value))?Number(value).toLocaleString('zh-TW'):'—';

  function paintSourceSummary(){
    const stats=window.LOC_SEARCH_SOURCE_STATS?.search_summary;
    if(!stats){sourceSummary.textContent='搜尋資料：靜態摘要暫時無法讀取。';return;}
    sourceSummary.innerHTML=`搜尋資料：<strong>${fmt(stats.char_count)} 字</strong> · <strong>${fmt(stats.comparable_records)} 筆可比較資料</strong>。統計由預先產生的 JS 快照提供，搜尋頁不重新掃描資料。`;
  }

  function flattenGroups(payload){
    const groups=payload?.groups;
    if(groups&&typeof groups==='object'){
      const rows=[];
      for(const [group,items] of Object.entries(groups)){
        if(Array.isArray(items)) for(const item of items) rows.push({group,item});
      }
      return rows;
    }
    if(Array.isArray(payload?.results)) return payload.results.map(item=>({group:'results',item}));
    return [];
  }

  function itemTitle(item){
    return item?.title||item?.符文名稱||item?.name||item?.result_id||item?.id||'搜尋結果';
  }
  function itemSummary(item){
    return item?.summary||item?.interpretation||item?.text||item?.description||item?.payload?.summary||'';
  }
  function itemLinks(item){
    const candidates=[
      item?.url,
      item?.public_path,
      item?.payload?.url,
      item?.payload?.public_path,
      item?.payload?.canonical_url,
      item?.payload?.youtube_mv_url,
      item?.payload?.ig_preview_url
    ].filter(Boolean);
    return [...new Set(candidates)].slice(0,3);
  }

  function render(payload){
    const rows=flattenGroups(payload);
    if(!rows.length){results.innerHTML='<div class="empty">沒有找到足夠接近的結果。</div>';return 0;}
    results.innerHTML=rows.slice(0,50).map(({group,item})=>{
      const meta=[item?.primary_loc,item?.content_type,group].filter(Boolean);
      const links=itemLinks(item);
      return `<article class="result-card">
        <div class="result-meta">${meta.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
        <h2>${esc(itemTitle(item))}</h2>
        ${itemSummary(item)?`<p>${esc(itemSummary(item))}</p>`:''}
        ${links.length?`<div class="result-links">${links.map((url,i)=>`<a href="${esc(url)}"${/^https?:/i.test(url)?' target="_blank" rel="noopener"':''}>${i===0?'查看來源':'相關連結'}</a>`).join('')}</div>`:''}
      </article>`;
    }).join('');
    return rows.length;
  }

  async function search(query){
    button.disabled=true;
    status.className='status';
    status.textContent='搜尋中…';
    results.innerHTML='';
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),15000);
    try{
      const response=await fetch(`${API}/search`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query,top_k:50,content_type:'',source:'',period:'',start_date:'',end_date:''}),
        signal:controller.signal
      });
      const payload=await response.json();
      if(!response.ok) throw new Error(payload?.detail||`HTTP ${response.status}`);
      const count=render(payload);
      status.textContent=count?`找到 ${count} 筆結果。`:'沒有找到足夠接近的結果。';
      const url=new URL(location.href);url.searchParams.set('q',query);history.replaceState(null,'',url);
    }catch(error){
      status.className='status error';
      status.textContent=error?.name==='AbortError'?'搜尋逾時，請稍後再試。':`暫時無法搜尋：${error.message}`;
      results.innerHTML='';
    }finally{
      clearTimeout(timer);
      button.disabled=false;
    }
  }

  form.addEventListener('submit',event=>{
    event.preventDefault();
    const query=input.value.trim();
    if(query) search(query);
  });

  paintSourceSummary();
  const initial=new URLSearchParams(location.search).get('q')?.trim();
  if(initial){input.value=initial;search(initial);}
})();
</script>
</body>
</html>
