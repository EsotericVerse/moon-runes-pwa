<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081522" />
  <meta name="description" content="LOC 搜尋引擎｜從符文、作品、媒體、知識與時間語意中，以同一個入口搜尋 lo3rwang／政德風語言系統。" />
  <title>LOC 搜尋引擎｜lo3rwang</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <style>
    :root{color-scheme:dark;--bg:#07131f;--panel:rgba(12,29,43,.88);--soft:rgba(19,43,58,.72);--line:rgba(160,214,220,.18);--text:#f2f7f6;--muted:#aebfc1;--moon:#d9f0e8;--mint:#7ed8c5;--gold:#e5c17b;--danger:#ffb4ad;--shadow:0 24px 70px rgba(0,0,0,.34)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% 5%,rgba(74,143,145,.23),transparent 31rem),radial-gradient(circle at 88% 82%,rgba(84,74,151,.18),transparent 28rem),var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.65}
    a{color:inherit}.page{width:min(1120px,calc(100% - 30px));margin:auto;padding:28px 0 60px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:34px}.brand{font-weight:850;letter-spacing:.12em;text-decoration:none}.navs{display:flex;gap:14px;flex-wrap:wrap}.nav{color:var(--muted);font-size:.86rem;text-decoration:none}.hero{margin-bottom:24px}.eyebrow{margin:0 0 8px;color:var(--mint);font-weight:800;font-size:.76rem;letter-spacing:.18em}.hero h1{margin:0;font-size:clamp(2.4rem,7vw,5rem);line-height:1.02;letter-spacing:-.045em}.intro{margin:15px 0 0;color:var(--muted);max-width:760px}
    .search-panel{padding:clamp(18px,4vw,32px);border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(16px)}label{display:block;margin-bottom:9px;font-weight:750}textarea{width:100%;min-height:104px;padding:16px 18px;color:var(--text);font:inherit;resize:vertical;border:1px solid rgba(255,255,255,.16);border-radius:15px;background:rgba(0,0,0,.18);outline:none}textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(126,216,197,.12)}
    .quick{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 18px}.chip{padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--soft);font:inherit;font-size:.82rem;cursor:pointer}.chip:hover{color:var(--text);border-color:var(--mint)}.filters{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px;margin-bottom:15px}select{width:100%;padding:10px 12px;color:var(--text);border:1px solid var(--line);border-radius:11px;background:#102535;font:inherit}.actions{display:flex;gap:12px;align-items:center}.submit{padding:12px 24px;border:0;border-radius:12px;color:#07131f;background:linear-gradient(135deg,var(--moon),var(--mint));font:inherit;font-weight:850;cursor:pointer}.submit:disabled{opacity:.55}.hint{color:var(--muted);font-size:.82rem}
    .status{min-height:30px;margin:22px 2px 8px;color:var(--muted)}.status.error{color:var(--danger)}.groups{display:grid;gap:22px}.group{border-top:1px solid var(--line);padding-top:18px}.grouphead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:11px}.grouphead h2{margin:0;font-size:1.05rem;letter-spacing:.03em}.grouphead span{color:var(--muted);font-size:.8rem}.cards{display:grid;gap:12px}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 12px 35px rgba(0,0,0,.18)}.card h3{margin:0 0 8px;font-size:1.2rem}.knowledge-image{display:block;width:min(100%,760px);max-height:430px;object-fit:contain;margin:12px 0;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.18)}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}.pill{padding:3px 8px;border-radius:999px;color:var(--muted);background:var(--soft);font-size:.75rem}.summary{margin:8px 0;color:#d6e0df}.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.play{display:inline-flex;padding:8px 12px;border-radius:10px;text-decoration:none;background:var(--mint);color:#07131f;font-weight:820}.secondary{display:inline-flex;padding:8px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--muted)}.empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}footer{margin-top:36px;color:var(--muted);font-size:.8rem;text-align:center}
    @media(max-width:720px){.filters{grid-template-columns:1fr}.actions{align-items:flex-start;flex-direction:column}.submit{width:100%}.topbar{align-items:flex-start;flex-direction:column}}
  </style>
  <link rel="stylesheet" href="css/loc-nav.css" />
</head>
<body>
  <div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="search" aria-label="全站導覽"></nav></div>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">LOC RAG · SEMANTIC VECTOR SEARCH</p>
      <h1>從一句話，<br />走進整個語言系統。</h1>
      <p class="intro">LOC 搜尋引擎是「LOC RAG 語意向量搜尋」的介面簡稱。月之符文是語意種子；LOC1–8 的籤詩、情境、作品、媒體、治理、知識與關係／時間資料由同一個檢索入口統整。</p>
    </header>
    <section class="search-panel">
      <form id="searchForm">
        <label for="query">你想找什麼？</label>
        <textarea id="query" maxlength="500" placeholder="例如：自我治理、自由之後怎麼選方向、人生月台、界線、月光……" required></textarea>
        <div class="quick" id="quick"></div>
        <div class="filters">
          <select id="contentType">
            <option value="">全部內容</option>
            <option value="oracle">籤詩模式（測試）</option>
            <option value="rune_record">基本符文</option>
            <option value="suno_song">Suno 歌曲</option>
            <option value="lyrics_work">歌詞</option>
            <option value="text_work">文字作品</option>
            <option value="multimedia">多媒體作品</option>
            <option value="knowledge">文件／知識庫</option>
            <option value="knowledge_image">圖片／知識圖</option>
            <option value="era">ERA／時間</option>
          </select>
          <select id="period"><option value="">所有 ERA／創作時期</option></select>
          <select id="category"><option value="">所有內容類型／風格</option></select>
          
        </div>
        <div class="actions"><button class="submit" id="submit" type="submit">搜尋 LOC</button><span class="hint">籤詩模式先讀 Lots，再以關鍵字展開相關歌詞、文字、多媒體、文件與 ERA；一般搜尋則依來源分組。</span></div>
      </form>
    </section>
    <div class="status" id="status" aria-live="polite"></div>
    <section class="groups" id="groups"></section>
    <footer>LOC 搜尋引擎 · LOC RAG 語意向量搜尋 · system_id: lo3rwang</footer>
  </main>
  <script>
    const API='https://moon-runes-pwa.onrender.com';
    const prompts=['自我治理','人生月台','自由之後不知道往哪裡','界線與拒絕','微月光','月符的語言系統'];
    const labels={oracle:'籤詩結果',runes:'月符',works:'Suno 歌曲／歌詞',textworks:'文字作品',relationships:'跨 LOC 關聯',media:'多媒體作品',knowledge:'文件／知識庫',timeline:'ERA／時間'};
    const locLabels={LOC1:'LOC1 · Lots',LOC3:'LOC3 · Music',LOC4:'LOC4 · Writing',LOC5:'LOC5 · Resonance',LOC6:'LOC6 · Governance',LOC7:'LOC7 · Text Architecture',LOC8:'LOC8 · Integration'};
    const el=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function bootFromUrl(){
      const p=new URLSearchParams(location.search);
      const type=p.get('content_type')||'';
      const q=p.get('q')||'';
      if(type&&[...el('contentType').options].some(o=>o.value===type)) el('contentType').value=type;
      if(q) el('query').value=q;
      const music=['','oracle','suno_song','lyrics_work','multimedia'].includes(el('contentType').value);
      el('period').disabled=!music;el('category').disabled=!music;
      if(q) el('searchForm').requestSubmit();
    }
    function quick(){el('quick').innerHTML=prompts.map(x=>`<button type="button" class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{el('query').value=b.dataset.q;el('query').focus()})}
    const FACET_CACHE_KEY='loc-search-facets-v1';
    const FACET_CACHE_TTL=24*60*60*1000;
    const FACET_FALLBACK={
      eras:[
        {period:'P2',label:'P2'},{period:'P3',label:'P3'},{period:'P4',label:'P4'},
        {period:'P5',label:'P5'},{period:'P6',label:'P6'},{period:'P7',label:'P7'},{period:'P8',label:'P8 · 治理自己'}
      ],
      loc3:{
        categories:[
          {value:'其他／待複查'},{value:'勸戒論述型'},{value:'幸福甜美型'},{value:'思辨論述型'},
          {value:'治理宣言型'},{value:'祝福紀念型'},{value:'轉折型'},{value:'轉折型候選'}
        ],
        playlists:[
          {value:'1.微月光剛開始的自創'},{value:'1.微月光的兩人爭執'},{value:'1.微月光的甜蜜'},
          {value:'2.節奏王者'},{value:'3.單身很好'},{value:'3.白晝之月Daytime Moon'},
          {value:'4.人生月台系列'},{value:'5.順其自然'},{value:'6.治理自己'},
          {value:'微月光的暗影詩章'},{value:'生日快樂'}
        ]
      }
    };
    function resetDynamicOptions(select){while(select.options.length>1)select.remove(1)}
    const FACET_CACHE_KEY='loc-search-facets-v1';
    const FACET_CACHE_TTL=24*60*60*1000;
    const FALLBACK_FACETS={
      eras:[
        {period:'P2',label:'P2｜重啟與格式形成期'},
        {period:'P3',label:'P3｜微月光與關係敘事期'},
        {period:'P4',label:'P4｜現實壓力與治理轉折期'},
        {period:'P5',label:'P5｜人生月台與語言重建期'},
        {period:'P6',label:'P6｜順其自然與界線整合期'},
        {period:'P7',label:'P7｜自由的風期'},
        {period:'P8',label:'P8｜自我治理與未來展望期'}
      ],
      categories:[
        {value:'其他／待複查'},
        {value:'勸戒論述型'},
        {value:'幸福甜美型'},
        {value:'思辨論述型'},
        {value:'治理宣言型'},
        {value:'祝福紀念型'},
        {value:'轉折型'},
        {value:'轉折型候選'}
      ]
    };
    function resetOptions(select,placeholder){select.innerHTML=`<option value="">${placeholder}</option>`}
    function fill(select,items,valueKey,labelKey){
      const existing=new Set([...select.options].map(o=>o.value));
      for(const item of items||[]){
        const value=item?.[valueKey]??item?.value??'';
        const label=item?.[labelKey]??item?.label??item?.value??value;
        if(!value||existing.has(String(value))) continue;
        const o=document.createElement('option');
        o.value=value;o.textContent=label;select.appendChild(o);existing.add(String(value));
      }
    }
    const FACET_CACHE_KEY='loc-search-facets-v1';
    const FACET_CACHE_TTL=24*60*60*1000;
    const FALLBACK_FACETS={
      eras:[
        {period:'P2',label:'P2'},{period:'P3',label:'P3'},{period:'P4',label:'P4'},
        {period:'P5',label:'P5'},{period:'P6',label:'P6'},{period:'P7',label:'P7'},
        {period:'P8',label:'P8 · 治理自己'}
      ],
      categories:[
        {value:'其他／待複查'},{value:'勸戒論述型'},{value:'幸福甜美型'},
        {value:'思辨論述型'},{value:'治理宣言型'},{value:'祝福紀念型'},
        {value:'轉折型'},{value:'轉折型候選'}
      ]
    };
    function applyFacets(data){
      fill(el('period'),data?.eras||[],'period','label');
      fill(el('category'),data?.loc3?.categories||data?.categories||[],'value','value');
    }
    function readFacetCache(){
      try{
        const cached=JSON.parse(localStorage.getItem(FACET_CACHE_KEY)||'null');
        if(cached?.data) applyFacets(cached.data);
        return cached;
      }catch(_){return null}
    }
    async function facets(){
      applyFacets(FALLBACK_FACETS);
      const cached=readFacetCache();
      if(cached&&Date.now()-Number(cached.saved_at||0)<FACET_CACHE_TTL)return;
      try{
        const r=await fetch(`${API}/search/facets`,{cache:'no-store'});
        if(!r.ok)throw new Error('facets unavailable');
        const d=await r.json();
        applyFacets(d);
        localStorage.setItem(FACET_CACHE_KEY,JSON.stringify({saved_at:Date.now(),data:d}));
      }catch(_){}
    }
    function linksFor(r){
      const p=r.payload||{}; const out=[];
      if(r.content_type==='rune_record'){const n=String(r.result_id||'').replace('RUNE-','');out.push(`<a class="secondary" href="list.html#${esc(n)}">查看符文資料</a>`)}
      if(r.content_type==='lyrics_work'){const v=p.recommended_version||{};if(v.suno_url)out.push(`<a class="play" href="${esc(v.suno_url)}" target="_blank" rel="noopener">Suno 播放 ↗</a>`);if(v.ig_preview_url)out.push(`<a class="secondary" href="${esc(v.ig_preview_url)}" target="_blank" rel="noopener">觀看 Reels ↗</a>`)}
      if(r.content_type==='reel'&&p.url)out.push(`<a class="play" href="${esc(p.url)}" target="_blank" rel="noopener">觀看 Reels ↗</a>`);
      if(r.content_type==='knowledge_document'&&p.path)out.push(`<a class="secondary" href="${esc(p.path)}">閱讀文件</a>`);
      if(r.content_type==='knowledge_image'&&p.path)out.push(`<a class="secondary" href="${esc(p.path)}" target="_blank" rel="noopener">查看原圖 ↗</a>`);
      if(r.content_type==='era')out.push('<a class="secondary" href="life.html">時間線專頁</a>');
      return out.length?`<div class="links">${out.join('')}</div>`:'';
    }
    function oracleCard(r){
      const p=r.payload||{},terms=p.extension_terms||[];
      return `<article class="card"><div class="meta"><span class="pill">LOC1 · Lots</span><span class="pill">${esc(p.rune_name||'')} · ${esc(p.direction||'')}</span><span class="pill">${esc(p.question_category||'')}</span></div><h3>籤詩：${esc(p.lot||r.summary||'')}</h3>${p.direction_text?`<p class="summary"><strong>方位語意：</strong>${esc(p.direction_text)}</p>`:''}${terms.length?`<p class="summary"><strong>延伸字樣：</strong>${terms.map(esc).join(' · ')}</p>`:''}</article>`;
    }
    function musicCard(r){
      const p=r.payload||{},score=Number(r.score||0),v=p.recommended_version||{},keys=(p.matched_terms?.length?p.matched_terms:(p.semantic_keywords||p.tags||[])).slice(0,8);
      const melody=v.style_prompt?`<details><summary>旋律／編曲資訊</summary><p class="summary">${esc(v.style_prompt)}</p></details>`:'';
      const alternates=(p.alternate_versions||[]).length?`<details><summary>另外 ${p.alternate_versions.length} 個同詞旋律版本</summary></details>`:'';
      return `<article class="card"><div class="meta"><span class="pill">${esc(locLabels.LOC3)}</span><span class="pill">作品類別：${esc(p.origin_label||'一般歌曲')}</span><span class="pill">歌詞類型：${esc(p.lyric_type||p.category||'待分類')}</span>${r.period?`<span class="pill">${esc(r.period)}</span>`:''}${p.era_name?`<span class="pill">${esc(p.era_name)}</span>`:''}${score?`<span class="pill">相關度 ${(score*100).toFixed(1)}%</span>`:''}</div><h3>${esc(r.title||r.result_id)}</h3>${r.summary?`<p class="summary">${esc(r.summary)}</p>`:''}${keys.length?`<p class="summary"><strong>關鍵字／命題：</strong>${keys.map(esc).join(' · ')}</p>`:''}${p.start_state||p.turn_method||p.final_state?`<p class="summary"><strong>語意路徑：</strong>${esc(p.start_state||'—')} → ${esc(p.turn_method||'—')} → ${esc(p.final_state||'—')}</p>`:''}${linksFor(r)}${melody}${alternates}</article>`;
    }
    function card(r){const score=Number(r.score||0),p=r.payload||{};const img=r.content_type==='knowledge_image'&&p.path?`<img class="knowledge-image" src="${esc(p.path)}" alt="${esc(r.title||'LOC 知識圖')}" loading="lazy" />`:'';return `<article class="card"><div class="meta"><span class="pill">${esc(locLabels[r.primary_loc]||r.primary_loc||'LOC')}</span><span class="pill">${esc(r.content_type||'record')}</span>${r.period?`<span class="pill">${esc(r.period)}</span>`:''}${score?`<span class="pill">相關度 ${(score*100).toFixed(1)}%</span>`:''}</div><h3>${esc(r.title||r.result_id)}</h3>${img}${r.summary?`<p class="summary">${esc(r.summary)}</p>`:''}${linksFor(r)}</article>`}
    function relationshipCard(r){
      const p=r.payload||{},src=p.source||{},targets=p.targets||[],kw=p.keywords||[],loc6=p.loc6_interpretation||{};
      return `<article class="card"><div class="meta"><span class="pill">跨 LOC 關聯</span><span class="pill">${esc(p.direction||'')}</span></div><h3>${esc(r.title||r.result_id)}</h3>${r.summary?`<p class="summary">${esc(r.summary)}</p>`:''}<div class="meta"><span class="pill">${esc(src.primary_loc||'LOC3')}：${esc(src.title||'')}</span>${targets.map(t=>`<span class="pill">${esc(t.primary_loc||'')}：${esc(t.title||'')}${t.chapter_count?` · ${t.chapter_count}章`:''}</span>`).join('')}</div>${kw.length?`<p class="summary"><strong>關鍵字：</strong>${kw.map(esc).join(' · ')}</p>`:''}${loc6.label?`<p class="summary"><strong>LOC6：</strong>${esc(loc6.label)} — ${esc(loc6.note||'')}</p>`:''}</article>`}
    }

    function render(groups){const order=['oracle','runes','works','textworks','relationships','media','knowledge','timeline'];let html='';for(const key of order){const items=groups?.[key]||[];if(!items.length)continue;const renderer=key==='oracle'?oracleCard:(key==='relationships'?relationshipCard:(key==='works'?musicCard:card));html+=`<section class="group"><div class="grouphead"><h2>${labels[key]}</h2><span>${items.length} 筆</span></div><div class="cards">${items.map(renderer).join('')}</div></section>`}el('groups').innerHTML=html||'<div class="empty">目前沒有足夠接近的結果。可以換一種說法，或取消內容類型篩選。</div>'}
    el('contentType').addEventListener('change',()=>{const music=['','oracle','suno_song','lyrics_work','multimedia'].includes(el('contentType').value);el('period').disabled=!music;el('category').disabled=!music});
    el('searchForm').onsubmit=async e=>{e.preventDefault();const q=el('query').value.trim();if(!q)return;el('submit').disabled=true;el('status').className='status';el('status').textContent='正在同時查詢符文、作品、媒體、知識與時間……';el('groups').innerHTML='';try{const body={query:q,top_k:6,content_type:el('contentType').value,period:el('period').value,category:el('category').value};const r=await fetch(`${API}/search`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'搜尋失敗');el('status').textContent=d.total_count?`找到 ${d.total_count} 筆跨 LOC 結果。不同來源分開排序，以避免把不同語意引擎的分數錯當成同一尺度。`:'沒有找到足夠接近的內容。';render(d.groups)}catch(err){el('status').className='status error';el('status').textContent=`暫時無法搜尋：${err.message}。若 Render 剛喚醒，請稍候再試。`}finally{el('submit').disabled=false}};
    quick();facets();bootFromUrl();
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js'));
  </script>
  <script src="js/loc-nav.js"></script>
</body>
</html>
