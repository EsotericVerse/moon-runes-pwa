<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081522" />
  <meta name="description" content="LOC 搜尋引擎｜從符文、作品、媒體、知識與時間語意中，以同一個入口搜尋 lo3rwang／政德風語言系統。" />
  <title>LOC 搜尋引擎｜lo3rwang</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <style>
    :root{color-scheme:dark;--bg:#07131f;--panel:rgba(12,29,43,.88);--soft:rgba(19,43,58,.72);--line:rgba(160,214,220,.18);--text:#f2f7f6;--muted:#aebfc1;--moon:#d9f0e8;--mint:#7ed8c5;--gold:#e5c17b;--danger:#ffb4ad;--shadow:0 24px 70px rgba(0,0,0,.34)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 10% 8%,rgba(103,75,171,.24),transparent 30rem),radial-gradient(circle at 88% 88%,rgba(35,105,135,.18),transparent 30rem),linear-gradient(180deg,#07182d 0%,#091729 62%,#06111f 100%);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.65}
    a{color:inherit}.page{width:min(1120px,calc(100% - 30px));margin:auto;padding:28px 0 60px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:34px}.brand{font-weight:850;letter-spacing:.12em;text-decoration:none}.navs{display:flex;gap:14px;flex-wrap:wrap}.nav{color:var(--muted);font-size:.86rem;text-decoration:none}.hero{margin-bottom:24px}.eyebrow{margin:0 0 8px;color:var(--mint);font-weight:800;font-size:.76rem;letter-spacing:.18em}.hero h1{margin:0;font-size:clamp(2.4rem,7vw,5rem);line-height:1.02;letter-spacing:-.045em}.intro{margin:15px 0 0;color:var(--muted);max-width:760px}
    .search-panel{padding:clamp(18px,4vw,32px);border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(16px)}label{display:block;margin-bottom:9px;font-weight:750}textarea{width:100%;min-height:104px;padding:16px 18px;color:var(--text);font:inherit;resize:vertical;border:1px solid rgba(255,255,255,.16);border-radius:15px;background:rgba(0,0,0,.18);outline:none}textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(126,216,197,.12)}
    .suggestions{margin:14px 0 18px}.suggestions-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}.suggestions-head strong{font-size:.9rem}.suggestions-head span{color:var(--muted);font-size:.78rem}.suggestion-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.suggestion-card{min-height:74px;padding:12px 13px;border:1px solid var(--line);border-radius:14px;color:var(--text);background:var(--soft);text-align:left;font:inherit;cursor:pointer;transition:.16s ease}.suggestion-card:hover,.suggestion-card:focus-visible{border-color:var(--mint);transform:translateY(-1px);outline:none}.suggestion-card strong{display:block;font-size:.88rem}.suggestion-card small{display:block;margin-top:4px;color:var(--muted);font-size:.75rem;line-height:1.4}.filters{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:10px;margin-bottom:15px}select{width:100%;padding:10px 12px;color:var(--text);border:1px solid var(--line);border-radius:11px;background:#102535;font:inherit}.actions{display:flex;gap:12px;align-items:center}.submit{padding:12px 24px;border:0;border-radius:12px;color:#07131f;background:linear-gradient(135deg,var(--moon),var(--mint));font:inherit;font-weight:850;cursor:pointer}.submit:disabled{opacity:.55}.hint{color:var(--muted);font-size:.82rem}
    .status{min-height:30px;margin:22px 2px 8px;color:var(--muted)}.status.error{color:var(--danger)}.groups{display:grid;gap:22px}.group{border-top:1px solid var(--line);padding-top:18px}.grouphead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:11px}.grouphead h2{margin:0;font-size:1.05rem;letter-spacing:.03em}.grouphead span{color:var(--muted);font-size:.8rem}.cards{display:grid;gap:12px}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 12px 35px rgba(0,0,0,.18)}.card h3{margin:0 0 8px;font-size:1.2rem}.knowledge-image{display:block;width:min(100%,760px);max-height:430px;object-fit:contain;margin:12px 0;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.18)}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}.pill{padding:3px 8px;border-radius:999px;color:var(--muted);background:var(--soft);font-size:.75rem}.summary{margin:8px 0;color:#d6e0df}.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.play{display:inline-flex;padding:8px 12px;border-radius:10px;text-decoration:none;background:var(--mint);color:#07131f;font-weight:820}.secondary{display:inline-flex;padding:8px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--muted)}.empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}footer{margin-top:36px;color:var(--muted);font-size:.8rem;text-align:center}
    @media(max-width:720px){.suggestion-grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.actions{align-items:flex-start;flex-direction:column}.submit{width:100%}.topbar{align-items:flex-start;flex-direction:column}}
  </style>
  <link rel="stylesheet" href="css/loc-nav.css" />
</head>
<body>
  <div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="search" aria-label="全站導覽"></nav></div>
  <main class="page">
    <header class="hero loc-header">
      <p class="loc-header-meta">LOC7 · RAG · Semantic Search</p>
      <h1 class="loc-header-title">LOC 搜尋引擎</h1>
      <h2 class="loc-header-subtitle">從一句話，找到相關的內容。</h2>
      <p class="loc-header-copy">輸入一個詞、一句話或一個情境，LOC 會從符文、作品、文字、影像、治理、知識與時期資料中找出相關內容，並整理成同一個搜尋結果。</p>
    </header>
    <section class="search-panel">
      <form id="searchForm">
        <label for="query">你想找什麼？</label>
        <textarea id="query" maxlength="500" placeholder="輸入你想查的內容" required></textarea>
        <div class="suggestions" aria-label="搜尋建議">
          <div class="suggestions-head">
            <strong>可以先從這些例子開始</strong>
            <span>點一下就會帶入搜尋框</span>
          </div>
          <div class="suggestion-grid" id="quick">
            <button type="button" class="suggestion-card" data-q="已讀不回"><strong>已讀不回</strong><small>歌曲 · 關係 · 文章</small></button>
            <button type="button" class="suggestion-card" data-q="人生月台"><strong>人生月台</strong><small>作品 · 時期 · 狀態</small></button>
            <button type="button" class="suggestion-card" data-q="自我治理"><strong>自我治理</strong><small>治理 · 政德風 · 時期</small></button>
            <button type="button" class="suggestion-card" data-q="界線"><strong>界線</strong><small>作品 · 治理 · 多媒體</small></button>
            <button type="button" class="suggestion-card" data-q="月之符文"><strong>月之符文</strong><small>符文 · 知識 · 系統</small></button>
            <button type="button" class="suggestion-card" data-q="自由的風"><strong>自由的風</strong><small>歌曲 · 時期 · 狀態</small></button>
          </div>
        </div>
        <div class="filters">
          <select id="contentType" aria-label="資料種類">
            <option value="">全部資料種類</option>
            <option value="oracle">籤詩／解牌</option>
            <option value="rune_record">月之符文</option>
            <option value="lyrics_work">音樂／歌詞</option>
            <option value="text_work">文字作品</option>
            <option value="multimedia">多媒體作品</option>
            <option value="governance_fragment">治理／政德風</option>
            <option value="governance_article">LOC6 文章／Threads</option>
            <option value="knowledge_image">圖片／知識圖</option>
            <option value="knowledge">文件／知識庫</option>
            <option value="relationship">跨 LOC 關係</option>
            <option value="era">ERA／時間</option>
          </select>
          <select id="period" aria-label="時期">
            <option value="">全部時期</option>
            <option value="P1">P1｜Suno原型探索期</option>
            <option value="P2">P2｜重啟與格式形成期</option>
            <option value="P3">P3｜微月光與關係敘事期</option>
            <option value="P4">P4｜現實壓力與治理轉折期</option>
            <option value="P5">P5｜人生月台與語言重建期</option>
            <option value="P6">P6｜順其自然與界線整合期</option>
            <option value="P7">P7｜自由的風期</option>
            <option value="P8">P8｜自我治理與未來展望期</option>
          </select>
        </div>
        <div class="actions"><button class="submit" id="submit" type="submit">搜尋 LOC</button><button class="submit" id="browse" type="button">瀏覽目前類型</button><span class="hint">資料種類決定要搜尋哪一種語言資產；時期是跨作品與紀錄的時間維度。籤詩模式仍先讀 Lots，再向其他資料展開。</span></div>
      </form>
    </section>
    <div class="status" id="status" aria-live="polite"></div>
    <section class="groups" id="groups"></section>
    <footer>LOC 搜尋引擎 · LOC RAG 語意向量搜尋 · system_id: lo3rwang</footer>
  </main>
  <script>
    const API='https://moon-runes-pwa.onrender.com';
    const promptSets={
      default:[
        {q:'已讀不回',title:'已讀不回',desc:'歌曲 · 關係 · 文章'},
        {q:'人生月台',title:'人生月台',desc:'作品 · 時期 · 狀態'},
        {q:'自我治理',title:'自我治理',desc:'治理 · 政德風 · 時期'},
        {q:'界線',title:'界線',desc:'作品 · 治理 · 多媒體'},
        {q:'月之符文',title:'月之符文',desc:'符文 · 知識 · 系統'},
        {q:'自由的風',title:'自由的風',desc:'歌曲 · 時期 · 狀態'}
      ],
      lyrics_work:[
        {q:'已讀不回',title:'已讀不回',desc:'LOC3 · 歌曲／歌詞'},
        {q:'人生月台',title:'人生月台',desc:'LOC3 · 時期作品'},
        {q:'自由的風',title:'自由的風',desc:'LOC3 · 主題／歌曲'},
        {q:'微月光',title:'微月光',desc:'LOC3 · 歌曲／主題'},
        {q:'界線',title:'界線',desc:'LOC3 · 歌詞命題'},
        {q:'自我治理',title:'自我治理',desc:'LOC3 · 現行創作'}
      ],
      text_work:[
        {q:'人生月台',title:'人生月台',desc:'LOC4 · 文字／敘事'},
        {q:'界線',title:'界線',desc:'LOC4 · 文章／文字'},
        {q:'月之符文',title:'月之符文',desc:'LOC4 · 符文文本'},
        {q:'自由',title:'自由',desc:'LOC4 · 主題文字'},
        {q:'未知',title:'未知',desc:'LOC4 · 敘事命題'},
        {q:'自我治理',title:'自我治理',desc:'LOC4 · 文字表達'}
      ],
      multimedia:[
        {q:'月之符文',title:'月之符文',desc:'LOC5 · 圖像／影音'},
        {q:'自由的風',title:'自由的風',desc:'LOC5 · Reels／視覺'},
        {q:'界線',title:'界線',desc:'LOC5 · 多媒體表達'},
        {q:'微月光',title:'微月光',desc:'LOC5 · 影像／聲音'},
        {q:'宣傳',title:'宣傳',desc:'LOC5 · 公開影音'},
        {q:'月光',title:'月光',desc:'LOC5 · 視覺意象'}
      ],
      governance_fragment:[
        {q:'自我治理',title:'自我治理',desc:'LOC6 · 治理核心'},
        {q:'界線',title:'界線',desc:'LOC6 · 邊界／治理'},
        {q:'免錢的最貴',title:'免錢的最貴',desc:'LOC6 · 價值判準'},
        {q:'我不跟你走劇本',title:'我不跟你走劇本',desc:'LOC6 · 敘事主權'},
        {q:'慈悲不是投降',title:'慈悲不是投降',desc:'LOC6 · 防衛邊界'},
        {q:'錯誤',title:'錯誤',desc:'LOC6 · 錯誤治理'}
      ],
      governance_article:[
        {q:'自我治理',title:'自我治理',desc:'LOC6 · 治理文章'},
        {q:'自由',title:'自由',desc:'LOC6 · Threads 長文'},
        {q:'選擇',title:'選擇',desc:'LOC6 · 價值／決策'},
        {q:'責任',title:'責任',desc:'LOC6 · 治理語言'},
        {q:'尊重',title:'尊重',desc:'LOC6 · 關係／界線'},
        {q:'政德風',title:'政德風',desc:'LOC6 · 風格演變'}
      ],
      knowledge:[
        {q:'LOC 是什麼',title:'LOC 是什麼',desc:'LOC7 · 系統知識'},
        {q:'月之符文',title:'月之符文',desc:'LOC7 · 文件／FAQ'},
        {q:'LOC2 怎麼玩',title:'LOC2 怎麼玩',desc:'LOC7 · 規則知識'},
        {q:'文字建築學',title:'文字建築學',desc:'LOC7 · 結構分析'},
        {q:'Graph RAG',title:'Graph RAG',desc:'LOC7 · 檢索／關係'},
        {q:'自我治理',title:'自我治理',desc:'LOC7 · 跨文件知識'}
      ]
    };
    const labels={oracle:'籤詩結果',runes:'月符',works:'Suno 歌曲／歌詞',textworks:'文字作品',relationships:'跨 LOC 關聯',governance:'治理／政德風',loc6_articles:'LOC6 文章',media:'多媒體作品',knowledge:'文件／知識庫',timeline:'時期／時間'};
    const locLabels={LOC1:'LOC1 · Lots',LOC3:'LOC3 · Music',LOC4:'LOC4 · Writing',LOC5:'LOC5 · Resonance',LOC6:'LOC6 · Governance',LOC7:'LOC7 · Text Architecture',LOC8:'LOC8 · Integration'};
    const el=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function bootFromUrl(){
      const p=new URLSearchParams(location.search);
      const type=p.get('content_type')||'';
      const q=p.get('q')||'';
      if(type&&[...el('contentType').options].some(o=>o.value===type)) el('contentType').value=type;
      if(q) el('query').value=q;
      if(q) el('searchForm').requestSubmit();
    }
    function quick(){
      const type=el('contentType').value;
      const alias={knowledge_image:'multimedia',relationship:'knowledge',oracle:'default',rune_record:'default',era:'default'};
      const key=promptSets[type]?type:(alias[type]||'default');
      const prompts=promptSets[key]||promptSets.default;
      el('quick').innerHTML=prompts.map(x=>`
        <button type="button" class="suggestion-card" data-q="${esc(x.q)}">
          <strong>${esc(x.title)}</strong>
          <small>${esc(x.desc)}</small>
        </button>`).join('');
      document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
        el('query').value=b.dataset.q;
        el('query').focus();
      });
    }
    const ERA_CACHE_KEY='loc-search-era-registry-v3';
    const ERA_CACHE_TTL=24*60*60*1000;
    const ERA_FALLBACK=[
      {period:'P1',display_label:'P1｜Suno原型探索期'},
      {period:'P2',display_label:'P2｜重啟與格式形成期'},
      {period:'P3',display_label:'P3｜微月光與關係敘事期'},
      {period:'P4',display_label:'P4｜現實壓力與治理轉折期'},
      {period:'P5',display_label:'P5｜人生月台與語言重建期'},
      {period:'P6',display_label:'P6｜順其自然與界線整合期'},
      {period:'P7',display_label:'P7｜自由的風期'},
      {period:'P8',display_label:'P8｜自我治理與未來展望期'}
    ];
    function applyEras(eras){
      const select=el('period'),current=select.value;
      select.innerHTML='<option value="">全部時期</option>';
      for(const era of eras||[]){
        const value=era.period||'';
        if(!value)continue;
        const o=document.createElement('option');
        o.value=value;
        o.textContent=era.display_label||era.label||era.name||value;
        select.appendChild(o);
      }
      if([...select.options].some(o=>o.value===current))select.value=current;
    }
    function readEraCache(){
      try{return JSON.parse(localStorage.getItem(ERA_CACHE_KEY)||'null')}catch(_){return null}
    }
    async function facets(){
      applyEras(ERA_FALLBACK);
      const cached=readEraCache();
      const cachedEras=Array.isArray(cached?.data?.eras)?cached.data.eras:[];
      if(cachedEras.length)applyEras(cachedEras);
      const fresh=cachedEras.length>0&&Date.now()-Number(cached.saved_at||0)<ERA_CACHE_TTL;
      if(fresh)return;
      try{
        const r=await fetch('data/shared/LOC_ERA_REGISTRY.json',{cache:'no-store'});
        if(!r.ok)throw new Error('ERA registry unavailable');
        const d=await r.json();
        if(Array.isArray(d.eras)&&d.eras.length){
          applyEras(d.eras);
          localStorage.setItem(ERA_CACHE_KEY,JSON.stringify({
            saved_at:Date.now(),
            schema_version:d.schema_version||'0.1',
            data:{eras:d.eras}
          }));
        }
      }catch(_){}
    }
    function linksFor(r){
      const p=r.payload||{}; const out=[];
      if(r.content_type==='rune_record'){const n=String(r.result_id||'').replace('RUNE-','');out.push(`<a class="secondary" href="list.html#${esc(n)}">查看符文資料</a>`)}
      if(r.content_type==='lyrics_work'){const v=p.recommended_version||{};if(v.suno_url)out.push(`<a class="play" href="${esc(v.suno_url)}" target="_blank" rel="noopener">Suno 播放 ↗</a>`);if(v.ig_preview_url)out.push(`<a class="secondary" href="${esc(v.ig_preview_url)}" target="_blank" rel="noopener">觀看 Reels ↗</a>`)}
      if(r.content_type==='reel'&&p.url)out.push(`<a class="play" href="${esc(p.url)}" target="_blank" rel="noopener">觀看 Reels ↗</a>`);
      if((r.content_type==='knowledge_document'||r.content_type==='governance_article')&&p.path)out.push(`<a class="secondary" href="${esc(p.path)}">閱讀文章</a>`);
      if(r.content_type==='knowledge_image'&&p.path)out.push(`<a class="secondary" href="${esc(p.path)}" target="_blank" rel="noopener">查看原圖 ↗</a>`);
      if(r.content_type==='era')out.push('<a class="secondary" href="life.html#era-trend">脈絡分析</a>');
      return out.length?`<div class="links">${out.join('')}</div>`:'';
    }
    function oracleCard(r){
      const p=r.payload||{},terms=p.extension_terms||[];
      return `<article class="card"><div class="meta"><span class="pill">LOC1 · Lots</span><span class="pill">${esc(p.rune_name||'')} · ${esc(p.direction||'')}</span><span class="pill">${esc(p.question_category||'')}</span></div><h3>籤詩：${esc(p.lot||r.summary||'')}</h3>${p.direction_text?`<p class="summary"><strong>方位語意：</strong>${esc(p.direction_text)}</p>`:''}${terms.length?`<p class="summary"><strong>延伸字樣：</strong>${terms.map(esc).join(' · ')}</p>`:''}</article>`;
    }
    function musicCard(r){
      const p=r.payload||{},score=Number(r.score||0),v=p.recommended_version||{},keys=(p.matched_terms?.length?p.matched_terms:(p.semantic_keywords||p.tags||[])).slice(0,8);
      const melody=v.style_prompt?`<details><summary>旋律／編曲資訊</summary><p class="summary">${esc(v.style_prompt)}</p></details>`:'';const lyrics=p.lyrics?`<details><summary>展開完整歌詞</summary><p class="summary">${esc(p.lyrics)}</p></details>`:'';
      const alternates=(p.alternate_versions||[]).length?`<details><summary>另外 ${p.alternate_versions.length} 個同詞旋律版本</summary></details>`:'';
      return `<article class="card"><div class="meta"><span class="pill">${esc(locLabels.LOC3)}</span><span class="pill">作品類別：${esc(p.origin_label||'一般歌曲')}</span><span class="pill">歌詞類型：${esc(p.lyric_type||p.category||'待分類')}</span>${r.period?`<span class="pill">${esc(r.period)}</span>`:''}${p.era_name?`<span class="pill">${esc(p.era_name)}</span>`:''}${score?`<span class="pill">相關度 ${(score*100).toFixed(1)}%</span>`:''}</div><h3>${esc(r.title||r.result_id)}</h3>${r.summary?`<p class="summary">${esc(r.summary)}</p>`:''}${keys.length?`<p class="summary"><strong>關鍵字／命題：</strong>${keys.map(esc).join(' · ')}</p>`:''}${p.start_state||p.turn_method||p.final_state?`<p class="summary"><strong>語意路徑：</strong>${esc(p.start_state||'—')} → ${esc(p.turn_method||'—')} → ${esc(p.final_state||'—')}</p>`:''}${linksFor(r)}${lyrics}${melody}${alternates}</article>`;
    }
    function card(r){const score=Number(r.score||0),p=r.payload||{};const fullText=p.text||p.content||p.body||p.full_text||'';const img=r.content_type==='knowledge_image'&&p.path?`<img class="knowledge-image" src="${esc(p.path)}" alt="${esc(r.title||'LOC 知識圖')}" loading="lazy" />`:'';return `<article class="card"><div class="meta"><span class="pill">${esc(locLabels[r.primary_loc]||r.primary_loc||'LOC')}</span><span class="pill">${esc(r.content_type||'record')}</span>${r.period?`<span class="pill">${esc(r.period)}</span>`:''}${score?`<span class="pill">相關度 ${(score*100).toFixed(1)}%</span>`:''}</div><h3>${esc(r.title||r.result_id)}</h3>${img}${r.summary?`<p class="summary">${esc(r.summary)}</p>`:''}${fullText?`<details><summary>展開全文</summary><p class="summary">${esc(fullText)}</p></details>`:''}${linksFor(r)}</article>`}
    function loc6ArticleCard(r){
      const p=r.payload||{};
      const source=(p.source_role==='main_post'||p.evidence_role==='primary')?'Threads 主貼文':'LOC6 維護文章';
      const terms=(p.matched_terms||p.keywords||[]).slice(0,8);
      const text=r.summary||'';
      const preview=text.length>220?text.slice(0,220)+'…':text;
      const canExpand=text.length>220;
      return `<article class="card"><div class="meta"><span class="pill">LOC6 · Article</span><span class="pill">${esc(source)}</span>${r.period?`<span class="pill">${esc(r.period)}</span>`:''}${p.date?`<span class="pill">${esc(p.date)}</span>`:''}</div><h3>${esc(r.title||r.result_id)}</h3><p class="summary">${esc(preview)}</p>${canExpand?`<details><summary>展開原文</summary><p class="summary">${esc(text)}</p></details>`:''}${terms.length?`<p class="summary"><strong>語意標籤：</strong>${terms.map(esc).join(' · ')}</p>`:''}${linksFor(r)}</article>`;
    }
    function relationshipCard(r){
      const p=r.payload||{},src=p.source||{},targets=p.targets||[],kw=p.keywords||[],loc6=p.loc6_interpretation||{};
      return `<article class="card"><div class="meta"><span class="pill">跨 LOC 關聯</span><span class="pill">${esc(p.direction||'')}</span></div><h3>${esc(r.title||r.result_id)}</h3>${r.summary?`<p class="summary">${esc(r.summary)}</p>`:''}<div class="meta"><span class="pill">${esc(src.primary_loc||'LOC3')}：${esc(src.title||'')}</span>${targets.map(t=>`<span class="pill">${esc(t.primary_loc||'')}：${esc(t.title||'')}${t.chapter_count?` · ${t.chapter_count}章`:''}</span>`).join('')}</div>${kw.length?`<p class="summary"><strong>關鍵字：</strong>${kw.map(esc).join(' · ')}</p>`:''}${loc6.label?`<p class="summary"><strong>LOC6：</strong>${esc(loc6.label)} — ${esc(loc6.note||'')}</p>`:''}</article>`}
    }

    function render(groups){const order=['oracle','runes','works','textworks','relationships','governance','loc6_articles','media','knowledge','timeline'];let html='';for(const key of order){const items=groups?.[key]||[];if(!items.length)continue;const renderer=key==='oracle'?oracleCard:(key==='relationships'?relationshipCard:(key==='works'?musicCard:(key==='loc6_articles'?loc6ArticleCard:card)));html+=`<section class="group"><div class="grouphead"><h2>${labels[key]}</h2><span>${items.length} 筆</span></div><div class="cards">${items.map(renderer).join('')}</div></section>`}el('groups').innerHTML=html||'<div class="empty">目前沒有足夠接近的結果。可以換一種說法，或取消內容類型篩選。</div>'}
    let browseOffset=0;
    async function browse(reset=true){
      const type=el('contentType').value;
      if(!['lyrics_work','text_work','governance_article','governance_fragment'].includes(type)){
        el('status').className='status error';
        el('status').textContent='請先選擇可瀏覽的資料種類：音樂／歌詞、文字作品、LOC6 文章或治理／政德風。';
        return;
      }
      if(reset){browseOffset=0;el('groups').innerHTML='';}
      el('browse').disabled=true;
      el('status').className='status';
      el('status').textContent='正在載入作品列表與文字……';
      try{
        const body={content_type:type,offset:browseOffset,limit:24,period:el('period').value};
        const r=await fetch(`${API}/search/browse`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const d=await r.json();
        if(!r.ok)throw new Error(d.detail||'瀏覽失敗');
        const key=type==='lyrics_work'?'works':(type==='text_work'?'textworks':(type==='governance_article'?'loc6_articles':'governance'));
        const existing=reset?[]:[...document.querySelectorAll('#groups .card')];
        const groups={};groups[key]=d.items||[];
        if(reset){render(groups);}else{
          const wrap=el('groups').querySelector('.cards');
          const renderer=key==='works'?musicCard:(key==='loc6_articles'?loc6ArticleCard:card);
          if(wrap)wrap.insertAdjacentHTML('beforeend',(d.items||[]).map(renderer).join(''));
        }
        browseOffset+=d.items?.length||0;
        el('status').textContent=`已載入 ${browseOffset} / ${d.total_count} 筆。${d.has_more?' 可繼續載入更多。':' 已到列表末端。'}`;
        el('browse').textContent=d.has_more?'載入更多':'重新瀏覽';
        el('browse').dataset.more=d.has_more?'1':'0';
      }catch(err){
        el('status').className='status error';
        el('status').textContent=`暫時無法瀏覽：${err.message}`;
      }finally{el('browse').disabled=false;}
    }
    el('browse').onclick=()=>browse(el('browse').dataset.more!=='1');
    el('contentType').addEventListener('change',()=>{browseOffset=0;el('browse').dataset.more='0';el('browse').textContent='瀏覽目前類型';});
    el('searchForm').onsubmit=async e=>{e.preventDefault();const q=el('query').value.trim();if(!q)return;el('submit').disabled=true;el('status').className='status';el('status').textContent='正在同時查詢符文、作品、媒體、知識與時期資料……';el('groups').innerHTML='';try{const body={query:q,top_k:6,content_type:el('contentType').value,period:el('period').value};const r=await fetch(`${API}/search`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'搜尋失敗');el('status').textContent=d.total_count?`找到 ${d.total_count} 筆跨 LOC 結果。不同來源分開排序，以避免把不同語意引擎的分數錯當成同一尺度。`:'沒有找到足夠接近的內容。';render(d.groups)}catch(err){el('status').className='status error';el('status').textContent=`暫時無法搜尋：${err.message}。若 Render 剛喚醒，請稍候再試。`}finally{el('submit').disabled=false}};
    el('contentType').addEventListener('change',quick);
    quick();
    facets().finally(bootFromUrl);
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js'));
  </script>
  <script src="js/loc-nav.js"></script>
</body>
</html>
