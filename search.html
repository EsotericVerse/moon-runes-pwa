<body class="loc-responsive-page loc-page-search">
  <div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="search" aria-label="全站導覽"></nav></div>
  <main class="page">
    <header class="hero loc-header">
      <p class="loc-header-meta">LOC7 · RAG · Semantic Search</p>
      <h1 class="loc-header-title">LOC 搜尋引擎</h1>
      <h2 class="loc-header-subtitle">從一句話，找到相關的內容。</h2>
      <p class="loc-header-copy">輸入一個詞、一句話或一個情境，LOC 會從符文、作品、文字、影像、治理、知識與時期資料中找出相關內容，並整理成同一個搜尋結果。</p>
    </header>
    <section class="search-panel">
      <form id="searchForm">
        <label for="query">你想找什麼？</label>
        <textarea id="query" maxlength="500" placeholder="輸入關鍵字、作品名稱、句子或概念" required></textarea>

        <div class="primary-actions">
          <button class="submit" id="submit" type="submit">搜尋</button>
          <button class="clear-btn" id="clearSearch" type="button">清除全部</button>
        </div>

        <section class="filter-shell" id="advancedSearch">
          <button class="filter-toggle" id="advancedToggle" type="button" aria-expanded="false" aria-controls="advancedPanel">
            <span class="filter-toggle-main">
              <strong>篩選搜尋</strong>
              <small>資料種類 · ERA／時期</small>
            </span>
            <span class="filter-count" id="filterCount" hidden>0</span>
            <span class="filter-chevron" aria-hidden="true">⌄</span>
          </button>

          <div class="active-filters" id="activeFilters">
            <span class="filter-chip muted">目前搜尋：全部資料</span>
          </div>

          <div class="filter-panel" id="advancedPanel" hidden>
            <nav class="filter-tabs" aria-label="搜尋篩選分類">
              <button type="button" class="filter-tab active" data-filter-target="filterType">資料種類</button>
              <button type="button" class="filter-tab" data-filter-target="filterTime">ERA／時期</button>
            </nav>

            <div class="filter-section active" id="filterType">
              <div class="filter-section-head">
                <strong>資料種類</strong>
                <span>先決定你要找的是作品、媒體，還是 LOC 系統資料。</span>
              </div>
              <select id="contentType">
                <option value="">全部資料種類</option>
                <optgroup label="作品 / 媒體">
                  <option value="lyrics_work">音樂／歌詞</option>
                  <option value="text_work">文字作品</option>
                  <option value="multimedia">影音／Reels</option>
                  <option value="knowledge_image">圖片／知識圖</option>
                </optgroup>
                <optgroup label="LOC 系統資料">
                  <option value="oracle">籤詩／解牌</option>
                  <option value="rune_record">月之符文</option>
                  <option value="governance_fragment">治理／政德風語句</option>
                  <option value="governance_article">LOC6 文章</option>
                  <option value="knowledge">文件／知識庫</option>
                  <option value="relationship">跨 LOC 關係</option>
                  <option value="era">時期／時間</option>
                </optgroup>
              </select>
              <div class="browse-inline">
                <button class="browse-btn" id="browse" type="button">依這個種類瀏覽</button>
                <small>不輸入關鍵字也可以；先選資料種類，再直接瀏覽。</small>
              </div>
            </div>

            <div class="filter-section" id="filterTime" hidden>
              <div class="filter-section-head">
                <strong>ERA／時期</strong>
                <span>依 LOC 的長期狀態階段篩選，不混入歌曲專用分類。</span>
              </div>
              <div class="field era-field">
                <label for="period">ERA／時期</label>
                <select id="period">
                  <option value="">全部時期</option>
                  <option value="P0">P0</option>
                  <option value="P0.5">P0.5</option>
                  <option value="P1">P1</option>
                  <option value="P2">P2</option>
                  <option value="P3">P3</option>
                  <option value="P4">P4</option>
                  <option value="P5">P5</option>
                  <option value="P6">P6</option>
                  <option value="P7">P7</option>
                  <option value="P8">P8</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <div class="suggestions" aria-label="搜尋建議">
          <div class="suggestions-head">
            <strong>快速範例</strong>
            <span>點一下只會填入搜尋框，再按「搜尋」</span>
          </div>
          <div class="suggestion-grid" id="quick">
            <button type="button" class="suggestion-card" data-q="已讀不回"><strong>已讀不回</strong><small>歌曲 · 關係 · 文章</small></button>
            <button type="button" class="suggestion-card" data-q="人生月台"><strong>人生月台</strong><small>作品 · 時期 · 狀態</small></button>

            <button type="button" class="suggestion-card" data-q="月之符文"><strong>月之符文</strong><small>符文 · 知識 · 系統</small></button>
            <button type="button" class="suggestion-card" data-q="自由的風"><strong>自由的風</strong><small>歌曲 · 時期 · 狀態</small></button>
          </div>
        </div>
      </form>
    </section>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="status" id="corpusStatus" aria-live="polite"></div>
    <section class="groups" id="groups"></section>
    <nav class="pagination" id="pagination" aria-label="搜尋結果分頁" hidden>
      <div class="pagination-info" id="paginationInfo"></div>
      <div class="pagination-pages" id="paginationPages"></div>
    </nav>
    <footer>LOC Search · 語言框架上的資料搜尋與關聯檢索 · system_id: lo3rwang</footer>
  </main>

    function pageWindow(current,totalPages){
      const out=[];
      const start=Math.max(1,Math.min(current-2,Math.max(1,totalPages-4)));
      const end=Math.min(totalPages,Math.max(5,current+2));
      for(let i=start;i<=end;i++) out.push(i);
      return out;
    }

    function renderPagination(total,page,onPage){
      const nav=el('pagination'),info=el('paginationInfo'),pages=el('paginationPages');
      if(!nav||!info||!pages)return;
      if(total<=PAGE_SIZE){
        nav.hidden=true;
        pages.innerHTML='';
        return;
      }
      const totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
      const safePage=Math.min(Math.max(1,page),totalPages);
      const from=(safePage-1)*PAGE_SIZE+1;
      const to=Math.min(total,safePage*PAGE_SIZE);
      info.textContent=`第 ${from}–${to} 筆，共 ${total} 筆 · 第 ${safePage} / ${totalPages} 頁`;

      const nums=pageWindow(safePage,totalPages);
      let html=`<button class="page-btn" type="button" data-page="${safePage-1}" ${safePage===1?'disabled':''}>上一頁</button>`;
      if(nums[0]>1){
        html+=`<button class="page-btn" type="button" data-page="1">1</button>`;
        if(nums[0]>2)html+='<span class="pagination-info">…</span>';
      }
      html+=nums.map(n=>`<button class="page-btn ${n===safePage?'active':''}" type="button" data-page="${n}" aria-current="${n===safePage?'page':'false'}">${n}</button>`).join('');
      if(nums[nums.length-1]<totalPages){
        if(nums[nums.length-1]<totalPages-1)html+='<span class="pagination-info">…</span>';
        html+=`<button class="page-btn" type="button" data-page="${totalPages}">${totalPages}</button>`;
      }
      html+=`<button class="page-btn" type="button" data-page="${safePage+1}" ${safePage===totalPages?'disabled':''}>下一頁</button>`;
      pages.innerHTML=html;
      nav.hidden=false;
      pages.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>{
        const next=Number(btn.dataset.page||1);
        if(next<1||next>totalPages||next===safePage)return;
        onPage(next);
      }));
    }

    function renderSearchPage(page=1){
      const rows=flattenGroups(searchState.groups);
      searchState.total=rows.length;
      const totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
      searchState.page=Math.min(Math.max(1,page),totalPages);
      const start=(searchState.page-1)*PAGE_SIZE;
      const slice=rows.slice(start,start+PAGE_SIZE);

      let html=searchState.synthesis?synthesisCard(searchState.synthesis,searchState.graph):'';
      html+=resultLocationOverview(searchState.groups);

      const evidenceBlocks=[];
      for(const key of RESULT_ORDER){
        const items=slice.filter(row=>row.key===key).map(row=>row.item);
        if(!items.length)continue;
        const renderer=rendererForGroup(key);
        const allCount=(searchState.groups?.[key]||[]).length;
        const meta=GROUP_LOCATION_META[key]||{loc:'LOC',label:labels[key]||key};
        evidenceBlocks.push(`<details class="evidence-section">
          <summary><span>${esc(meta.loc)} · ${esc(meta.label)}</span><small>本頁 ${items.length} 筆 · 共 ${allCount} 筆</small></summary>
          <div class="evidence-body"><div class="cards">${items.map(renderer).join('')}</div></div>
        </details>`);
      }
      if(evidenceBlocks.length){
        html+=`<section class="group"><div class="grouphead"><h2>詳細證據</h2><span>需要時再展開原始命中資料</span></div><div class="cards">${evidenceBlocks.join('')}</div></section>`;
      }

      el('groups').innerHTML=html||'<div class="empty">目前沒有足夠接近的結果。可以換一種說法，或取消資料種類篩選。</div>';
      renderPagination(rows.length,searchState.page,next=>{
        renderSearchPage(next);
        el('groups').scrollIntoView({behavior:'smooth',block:'start'});
      });
    }

    function render(groups,synthesis=null,graph=null){
      browseState.active=false;
      searchState={groups:groups||{},synthesis,graph,page:1,total:0};
      renderSearchPage(1);
    }

    async function browse(page=1){
      const type=el('contentType').value;
      if(!['lyrics_work','text_work','governance_article','governance_fragment'].includes(type)){
        el('status').className='status error';
        el('status').textContent='請先選擇可瀏覽的資料種類：音樂／歌詞、文字作品、LOC6 文章或治理／政德風。';
        return;
      }
      const safePage=Math.max(1,Number(page)||1);
      el('browse').disabled=true;
      el('status').className='status';
      el('status').textContent=`正在載入第 ${safePage} 頁……`;
      try{
        const body={content_type:type,offset:(safePage-1)*PAGE_SIZE,limit:PAGE_SIZE,period:el('period').value};
        const r=await fetch(`${API}/search/browse`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const d=await r.json();
        if(!r.ok)throw new Error(d.detail||'瀏覽失敗');
        const key=type==='lyrics_work'?'works':(type==='text_work'?'textworks':(type==='governance_article'?'loc6_articles':'governance'));
        browseState={active:true,type,key,page:safePage,total:Number(d.total_count||0),items:d.items||[]};
        const renderer=rendererForGroup(key);
        el('groups').innerHTML=browseState.items.length
          ? `<section class="group"><div class="grouphead"><h2>${labels[key]}</h2><span>每頁 ${PAGE_SIZE} 筆</span></div><div class="cards">${browseState.items.map(renderer).join('')}</div></section>`
          : '<div class="empty">這一頁沒有資料。</div>';
        renderPagination(browseState.total,safePage,next=>{
          browse(next);
          el('groups').scrollIntoView({behavior:'smooth',block:'start'});
        });
        const from=browseState.total?((safePage-1)*PAGE_SIZE+1):0;
        const to=Math.min(browseState.total,safePage*PAGE_SIZE);
        el('status').textContent=`第 ${from}–${to} 筆，共 ${browseState.total} 筆。`;
        el('browse').textContent='重新瀏覽第 1 頁';
      }catch(err){
        el('status').className='status error';
        el('status').textContent=`暫時無法瀏覽：${err.message}`;
      }finally{el('browse').disabled=false;}
    }

    function clearAllSearch(){
      el('searchForm').reset();
      el('query').value='';
      el('groups').innerHTML='';
      el('status').className='status';
      el('status').textContent='';
      el('corpusStatus').textContent='';
      searchState={groups:{},synthesis:null,graph:null,page:1,total:0};
      browseState={active:false,type:'',key:'',page:1,total:0,items:[]};
      if(el('pagination'))el('pagination').hidden=true;
      el('browse').textContent='依資料種類瀏覽';
      const panel=el('advancedPanel');
      const toggle=el('advancedToggle');
      if(panel) panel.hidden=true;
      if(toggle) toggle.setAttribute('aria-expanded','false');
      document.querySelectorAll('.filter-tab').forEach((btn,i)=>btn.classList.toggle('active',i===0));
      document.querySelectorAll('.filter-section').forEach((sec,i)=>{sec.hidden=i!==0;sec.classList.toggle('active',i===0);});
      updateFilterSummary();
      quick();
      applyEras(ERA_FALLBACK);
      el('query').focus();
      history.replaceState(null,'',location.pathname);
    }
    function selectedText(id){
      const node=el(id);
      if(!node || !node.value) return '';
      if(node.tagName==='SELECT') return node.options[node.selectedIndex]?.textContent||'';
      return node.value;
    }
    function updateFilterSummary(){
      const chips=[];
      const type=selectedText('contentType');
      const period=selectedText('period');
      if(el('contentType')?.value) chips.push(type);
      if(el('period')?.value) chips.push(period);
      el('activeFilters').innerHTML=chips.length
        ? chips.map(x=>`<span class="filter-chip">${esc(x)}</span>`).join('')
        : '<span class="filter-chip muted">目前搜尋：全部資料</span>';
      const count=chips.length;
      const badge=el('filterCount');
      badge.textContent=String(count);
      badge.hidden=!count;
    }
    el('advancedToggle').onclick=()=>{
      const panel=el('advancedPanel');
      const willOpen=panel.hidden;
      panel.hidden=!willOpen;
      el('advancedToggle').setAttribute('aria-expanded',String(willOpen));
    };
    document.querySelectorAll('.filter-tab').forEach(btn=>btn.onclick=()=>{
      const target=btn.dataset.filterTarget;
      document.querySelectorAll('.filter-tab').forEach(x=>x.classList.toggle('active',x===btn));
      document.querySelectorAll('.filter-section').forEach(sec=>{
        const active=sec.id===target;
        sec.hidden=!active;
        sec.classList.toggle('active',active);
      });
    });
    ['contentType','period'].forEach(id=>el(id)?.addEventListener('change',updateFilterSummary));
    updateFilterSummary();
    el('clearSearch').onclick=clearAllSearch;
    el('browse').onclick=()=>browse(1);
    el('contentType').addEventListener('change',()=>{browseState={active:false,type:'',key:'',page:1,total:0,items:[]};if(el('pagination'))el('pagination').hidden=true;el('browse').textContent='瀏覽目前類型';});
    el('searchForm').onsubmit=async e=>{e.preventDefault();const q=el('query').value.trim();if(!q)return;el('submit').disabled=true;el('status').className='status';el('status').textContent='正在同時查詢符文、作品、媒體、知識與時期資料……';el('groups').innerHTML='';try{const body={query:q,top_k:10,content_type:el('contentType').value,period:el('period').value};const r=await fetch(`${API}/search`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'搜尋失敗');el('status').textContent=d.total_count?`找到 ${d.total_count} 筆跨 LOC 證據；已先整理資料分布、整合分析與 Graph 關係。`:'沒有找到足夠接近的內容。';render(d.groups,d.synthesis,d.graph)}catch(err){el('status').className='status error';el('status').textContent=`暫時無法搜尋：${err.message}`}finally{el('submit').disabled=false}};
    el('contentType').addEventListener('change',quick);
    quick();
    facets().finally(bootFromUrl);
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js'));
  </script>
  <script src="js/loc-nav.js"></script>
</body>
</html>
