name: One-time cleanup two merged import branches
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-prune-post-merge-20261009.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: "github.event.head_commit.message == 'ops: prune remaining merged import branches 20261009'"
    runs-on: ubuntu-latest
    steps:
      - name: Delete two merged refs
        uses: actions/github-script@v7
        with:
          script: |
            const branches = ["feat/import-batch-format-management-20261009","governance/freeze-import-management-20261009"];
            if (context.ref !== 'refs/heads/main') throw new Error('Main ref required');
            const {owner, repo} = context.repo;
            for (const name of branches) {
              if (name === 'main') throw new Error('Main is protected');
              await github.rest.git.deleteRef({owner, repo, ref: `heads/${name}`});
              core.info(`Deleted ${name}`);
            }
            core.summary.addRaw(`Deleted ${branches.length} merged refs, preserving main`);
            await core.summary.write();
