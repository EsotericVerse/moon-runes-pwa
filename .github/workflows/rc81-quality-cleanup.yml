name: RC8.1 UIUX quality tool cleanup

on:
  push:
    branches:
      - 'RC8.1UI/UX'
    paths:
      - '.github/workflows/rc81-quality-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup-quality-tools:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC8.1UI/UX
        uses: actions/checkout@v4
        with:
          ref: 'RC8.1UI/UX'
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Remove persistent Lighthouse CI dependency
        run: npm uninstall --save-dev @lhci/cli

      - name: Audit resulting dependency graph
        run: npm audit --audit-level=high

      - name: Commit synchronized manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: keep RC8.1 quality tools audit-clean"
            git push origin HEAD:RC8.1UI/UX
          fi
