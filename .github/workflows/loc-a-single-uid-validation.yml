name: LOC A-line single UID isolated verification
# Verification iteration 2: update UID fixtures and importer adapter assertions.
on:
  push:
    branches: [fix/loc-place-id-layout-20261026]
    paths: ['.github/workflows/loc-a-single-uid-validation.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies (no deploy)
        run: npm ci --no-audit --no-fund
      - name: A-line focused tests
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/test-trace-place-id-layout.mjs scripts/test-trace-map-save.mjs scripts/test-trace-organizer.mjs scripts/test-trace-autocomplete.mjs scripts/test-trace-hierarchy.mjs 2>&1 | tee /tmp/trace-single-uid.log
      - name: Full bootstrap regression
        run: npm run test:bootstrap
      - name: Next production build (no deployment)
        run: npm run build
      - name: Real Chrome Trace screen (desktop and narrow viewport)
        run: node scripts/test-trace-browser-smoke.mjs
      - name: ISR remains off
        run: node scripts/verify-release-isr.mjs
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loc-a-single-uid-diagnostics
          path: /tmp/trace-single-uid.log
          retention-days: 3
          if-no-files-found: ignore
