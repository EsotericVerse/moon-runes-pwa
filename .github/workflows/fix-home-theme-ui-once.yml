name: Fix homepage theme UI once
on:
  push:
    paths:
      - 'tools/fix_home_theme_ui_once.py'
      - '.github/workflows/fix-home-theme-ui-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_home_theme_ui_once.py
      - run: |
          grep -q 'function buildIndex(){' js/loc-nav.js
          grep -q 'THEME CONTROL NEUTRAL UI' css/style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/loc-nav.js css/style.css
          git commit -m "fix: remove homepage extra tier and neutralize theme control"
          git push
