name: RC3 four-char semantic rules once

on:
  push:
    paths:
      - '.github/workflows/rc3-four-char-semantic-rules-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply governance and examples
        shell: python
        run: |
          import json
          from pathlib import Path

          lex_path = Path('data/json/registries/LUNARUNE_DERIVED_LEXICON.json')
          evo_path = Path('data/json/registries/LUNARUNE_EVOLUTION_HISTORY.json')

          lex = json.loads(lex_path.read_text(encoding='utf-8'))
          gov = lex.setdefault('governance', {})
          gov['whole_expression_precedence'] = '完整詞組的整體詞義與主體性優先於內部子詞；例如「日月星辰」不能因「星辰→星」就停在星。'
          gov['group_totality_rule'] = '同組多符文組合若整體語意明確指向該群組的循環、總體規律或生命定律，整體主體歸「命」；不是任意同組排列自動歸命，仍須先判斷完整詞組是否具有總體性。'
          gov['derived_keyword_rule'] = '超過 Canon 固定關鍵詞格式、但能穩定指向單一符文的固定詞或成語，列為衍生關鍵詞進 Graph，不回寫 Base66 Canon 關鍵詞。'

          additions = [
            {
              'term': '花枝招展',
              'surface_runes': ['花','枝'],
              'lexical_class': '成語／形容語',
              'relation': 'derived_keyword',
              'resolved_rune': '花',
              'status': 'confirmed',
              'keyword_role': 'derived_keyword',
              'source': '治理實作範例',
              'evidence': '完整詞「花枝招展」描述如花枝般鮮明盛放的姿態；此處「花枝」不是動物名，整體主體歸花。',
              'note': '四字完整詞可消除「花枝」二字的多義性；完整詞組語境優先於子詞。'
            },
            {
              'term': '生老病死',
              'surface_runes': ['生','老','病','死'],
              'lexical_class': '並列總稱／生命循環',
              'relation': 'group_totality_to_fate',
              'resolved_rune': '命',
              'status': 'confirmed',
              'source': '治理實作範例',
              'evidence': '生、老、病、死同屬生命組；四者合起來描述生命不可避免的整體循環與定律，主體上升為命。',
              'note': '典型同組 ABCD → 命；不是四字相加，而是群組總體規律。'
            },
            {
              'term': '風火雷土',
              'surface_runes': ['風','火','雷','土'],
              'lexical_class': '並列總稱／自然元素規律',
              'relation': 'group_totality_to_fate',
              'resolved_rune': '命',
              'status': 'confirmed',
              'source': '治理實作範例',
              'evidence': '風、火、雷、土皆屬元素組；當四者作為同組整體規律來理解時，主體上升為命。',
              'note': '同組多符文共同表達世界運作的總體定律時，歸命。'
            },
            {
              'term': '日月星辰',
              'surface_runes': ['日','月','星','辰'],
              'lexical_class': '並列總稱／天時秩序',
              'relation': 'group_totality_to_fate',
              'resolved_rune': '命',
              'status': 'confirmed',
              'source': '治理實作範例',
              'evidence': '日、月、星、辰皆屬秩序組；完整四字表達天體與時序的總體規律，主體上升為命。',
              'note': '完整詞組優先於內部「星辰→星」的二字規則；ABCD 整體可重新決定主體。'
            }
          ]
          existing = {e.get('term'): e for e in lex.get('entries', [])}
          for item in additions:
            existing[item['term']] = item
          original_order = [e.get('term') for e in lex.get('entries', []) if e.get('term')]
          for item in additions:
            if item['term'] not in original_order:
              original_order.append(item['term'])
          lex['entries'] = [existing[t] for t in original_order]
          lex['version'] = '1.2-rc3'
          lex_path.write_text(json.dumps(lex, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          evo = json.loads(evo_path.read_text(encoding='utf-8'))
          ge = evo.setdefault('governance_evolution', [])
          ge = [x for x in ge if x.get('title') != '完整詞組與同組總體律']
          ge.append({
            'order': 7,
            'title': '完整詞組與同組總體律',
            'before': '二字主體性規則若直接套入四字詞，可能被子詞判定綁住。',
            'after': '先判完整詞組；若同組多符文共同表達循環、總體規律或生命定律，主體可上升至命。',
            'effect': '建立 phrase > subphrase 的判定層級，讓少量規則可處理四字整體語意。'
          })
          evo['governance_evolution'] = sorted(ge, key=lambda x: x.get('order', 0))

          cases = evo.setdefault('semantic_history_cases', [])
          names = {'花枝招展 → 花','生老病死 → 命','風火雷土 → 命','日月星辰 → 命'}
          cases = [x for x in cases if x.get('title') not in names]
          cases.extend([
            {
              'order': 9,
              'title': '花枝招展 → 花',
              'kind': 'context_disambiguation',
              'before': '子詞「花枝」本身具有植物與動物名等多義性。',
              'after': '進入完整詞「花枝招展」後，多義被完整語境解除，整體主體歸花。',
              'note': '完整詞組可以反向消除二字詞的歧義。'
            },
            {
              'order': 10,
              'title': '生老病死 → 命',
              'kind': 'group_totality_to_fate',
              'before': '生、老、病、死可分別判為四個生命組符文。',
              'after': '四者作為生命整體循環時，主體上升為命。',
              'note': '同組多符文的總體性可產生高一層語意主體。'
            },
            {
              'order': 11,
              'title': '風火雷土 → 命',
              'kind': 'group_totality_to_fate',
              'before': '風、火、雷、土分別是元素組中的個別符文。',
              'after': '作為元素整體規律時，主體上升為命。',
              'note': '命在此表示世界運作的總體定律，而不是其中任一元素。'
            },
            {
              'order': 12,
              'title': '日月星辰 → 命',
              'kind': 'whole_expression_override',
              'before': '內部子詞「星辰」可先解析為星。',
              'after': '完整四字描述天時與秩序總體規律時，完整詞組優先，主體改判為命。',
              'note': '明確證明 phrase-level ownership 可覆寫 subphrase ownership。'
            }
          ])
          evo['semantic_history_cases'] = sorted(cases, key=lambda x: x.get('order', 0))
          evo['version'] = '1.2-rc3'
          evo_path.write_text(json.dumps(evo, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/rc3-four-char-semantic-rules-once.yml')
          if workflow.exists():
            workflow.unlink()
      - name: Commit result and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/json/registries/LUNARUNE_DERIVED_LEXICON.json data/json/registries/LUNARUNE_EVOLUTION_HISTORY.json .github/workflows/rc3-four-char-semantic-rules-once.yml
          git commit -m "feat(graph): add phrase-level ownership rules"
          git push
