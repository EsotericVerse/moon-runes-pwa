name: Run theme patch once

on:
  push:
    paths:
      - 'tools/add_time_theme_once.py'
      - '.github/workflows/run-theme-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/add_time_theme_once.py
      - run: |
          grep -q 'THEME_STORAGE_KEY' js/loc-nav.js
          grep -q 'TIME THEME SYSTEM' css/style.css
          grep -q 'data-loc-theme-select' js/loc-nav.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/loc-nav.js css/style.css
          git commit -m "feat: add automatic time-based theme control"
          git push
