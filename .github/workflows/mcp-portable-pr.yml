name: MCP Portable regression (PR)

# Manual read-only verification. No secrets, production DB calls, deploys or migrations.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-portable-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-portable-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Check MCP and Extension source syntax
        run: |
          node --check app/loc/mcp/router.mjs
          node --check app/loc/mcp/authority-client.mjs
          node --check app/loc/mcp/galaxy-read.mjs
          node --check app/loc/mcp/public-sql-gate.mjs
          node --check app/loc/providers/loc-gateway.mjs
          node --check app/loc/import/short-append-service.mjs
          node --check workers/loc-authority/index.mjs
          node --check workers/loc-authority/native-oauth.mjs
          node --check app/loc/auth/loc-browser.mjs
          node --check app/loc/mcp/loc-access.mjs
          node --check extensions/loc-galaxy-link/background.js
          node --check app/loc/providers/kysely-mcp.mjs
          node --check extensions/loc-web-capture-v2/background.js
          node --check extensions/loc-web-capture-v2/content.js
      - name: Verify private Galaxy, explicit search, PR warning and QoS
        run: |
          node --test \
            scripts/test-loc-mcp-authority.mjs \
            scripts/test-loc-mcp-routing.mjs \
            scripts/test-loc-mcp-galaxy-read.mjs \
            scripts/test-loc-mcp-sql-standalone.mjs \
            scripts/test-loc-extension-portable.mjs \
            scripts/test-mcp-qos.mjs \
            scripts/test-loc-web-capture-v2.mjs
      - name: Verify native Auth, no vendor SDK, PKCE, and append-only extension
        run: |
          node --test \
            scripts/test-loc-native-oauth.mjs \
            scripts/test-loc-mcp-native-access.mjs \
            scripts/test-loc-no-vendor-auth-runtime.mjs \
            scripts/test-loc-auth-provider-settings.mjs \
            scripts/test-loc-login-ux.mjs \
            scripts/test-loc-galaxy-link-extension.mjs \
            scripts/test-loc-short-append-service.mjs \
            scripts/test-loc-short-edge-authorization.mjs
      - name: Verify complete native Authority and zero-deploy database switching
        run: |
          npm run test:authority
          node --test scripts/test-loc-sql-standalone-deployment.mjs
          node --test scripts/test-zenstack-policy-runtime.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check standalone cross-engine SQL Gateways
        run: |
          deno check --config services/loc-mcp-sql/deno.json services/loc-mcp-sql/main.ts
          deno check --config services/loc-sql/deno.json services/loc-sql/main.ts
