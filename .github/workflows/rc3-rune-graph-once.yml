name: RC3 Rune Graph Once
on:
  push:
    paths:
      - 'tools/rc3_rune_graph_once.py'
      - '.github/workflows/rc3-rune-graph-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration
        run: python tools/rc3_rune_graph_once.py
      - name: Verify syntax and integration
        run: |
          node --check js/rune-context-graph.js
          python - <<'PY'
          from pathlib import Path
          for p in ['runes.html','context.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert s.count('id="runeSemanticGraph"') == 1
              assert s.count('js/rune-context-graph.js') == 1
          js=Path('js/rune-context-graph.js').read_text(encoding='utf-8')
          assert 'LOC4_TEXT_CORPUS' not in js
          assert 'CORPUS_MANIFEST' not in js
          print('verify ok')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runes.html context.html js/loc-nav.js
          git commit -m 'feat: integrate shared no-API rune context graph'
          git push
