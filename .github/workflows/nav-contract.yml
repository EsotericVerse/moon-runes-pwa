name: NAV Contract

on:
  pull_request:
    paths:
      - "app/GlobalNav.jsx"
      - "app/ScopeNav.jsx"
      - "app/modular-v2/**"
      - "app/site-registry.js"
      - "app/use-current-scope.js"
      - "scripts/verify-nav-all.mjs"
      - "scripts/verify-nav-registry.mjs"
      - "scripts/verify-scope-registry.mjs"
      - ".github/workflows/nav-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-nav-all.mjs
