name: RC3 Rune Data Pipeline Once
on:
  push:
    paths:
      - 'tools/rc3_rune_data_pipeline_once.py'
      - '.github/workflows/rc3-rune-data-pipeline-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pipeline integration
        run: python tools/rc3_rune_data_pipeline_once.py
      - name: Verify runtime and pages
        run: |
          node --check js/rune-analytics.js
          node --check js/rune-context-graph.js
          python - <<'PY'
          from pathlib import Path
          for p in ['statics.html','evolution.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert s.count('js/rune-analytics.js') == 1
          s=Path('statics.html').read_text(encoding='utf-8')
          assert 'runeKeywordRanking' in s
          e=Path('evolution.html').read_text(encoding='utf-8')
          for ident in ['runeEvolutionOverview','runeEvolutionTimeline','runeTrendGrid','runeTrajectoryList']:
              assert ident in e
          a=Path('js/rune-analytics.js').read_text(encoding='utf-8')
          assert 'data/json/core/runes.json' in a
          assert 'LOC4_TEXT_CORPUS' not in a
          print('verify ok')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statics.html evolution.html
          git commit -m 'feat: fill evolution and rankings from rune data'
          git push
