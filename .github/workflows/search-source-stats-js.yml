name: Search Source Stats JS

on:
  push:
    paths:
      - 'data/json/generated/search/SEARCH_SOURCE_STATS.json'
      - 'tools/build_search_source_stats_js.py'
      - '.github/workflows/search-source-stats-js.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build browser JS snapshot
        run: python tools/build_search_source_stats_js.py
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- js/search-source-stats.js; then
            echo 'No snapshot change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/search-source-stats.js
          git commit -m 'Update search source statistics JS snapshot'
          git push
