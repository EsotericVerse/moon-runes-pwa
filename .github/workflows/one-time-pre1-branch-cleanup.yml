name: One-time LOC pre-1.0 archived branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-pre1-branch-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: loc-pre1-branch-cleanup
  cancel-in-progress: false

jobs:
  archive-then-remove-old-branches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact branch audit and protect main
        env:
          GH_TOKEN: ${{ github.token }}
