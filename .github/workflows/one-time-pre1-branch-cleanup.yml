          AUDITED_BRANCHES
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[] | "\(.name)|\(.commit.sha)"' | sort > live-branches.txt
          { cat expected-branches.txt; printf 'main|%s\n' "${GITHUB_SHA}"; } | sort > audited-with-main.txt
          diff -u audited-with-main.txt live-branches.txt
          test "$(wc -l < expected-branches.txt)" -eq 96
          test -z "$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number')"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "${GITHUB_SHA}"
          echo 'Audited 96 non-main refs; open PR count 0; main fixed.'

      - name: Create verified complete pre-1.0 Git bundle backup
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' --tags
          mkdir -p pre1-backup
          cp expected-branches.txt pre1-backup/branch-heads.txt
          git bundle create pre1-backup/loc-before-1.0-branches.bundle --all
          git bundle verify pre1-backup/loc-before-1.0-branches.bundle
          git bundle list-heads pre1-backup/loc-before-1.0-branches.bundle > pre1-backup/contents.txt
          test "$(grep -c 'refs/remotes/origin/' pre1-backup/contents.txt)" -ge 97
          echo 'Complete Git bundle archive verified before any deletion.'

      - name: Preserve recovery artifact before deletion
        uses: actions/upload-artifact@v4
        with:
          name: LOC-pre1-full-branch-history-recovery
          path: pre1-backup/
          retention-days: 90
          if-no-files-found: error

      - name: Delete audited non-main references only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "${GITHUB_SHA}"
          test -z "$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number')"
          count=0
          while IFS='|' read -r branch sha; do
            test -n "$branch"
            test "$branch" != main
            case "$branch" in refs/*|/*|*..*) echo "Unsafe branch name: $branch"; exit 1;; esac
            live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq '.commit.sha')"
            test "$live_sha" = "$sha" || { echo "Branch changed; aborting: $branch"; exit 1; }
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            count=$((count+1))
            echo "Removed $count/96: $branch"
          done < expected-branches.txt
          test "$count" -eq 96
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' > remaining.txt
          test "$(wc -l < remaining.txt)" -eq 1
          grep -qx main remaining.txt
          echo 'Verified: only main remains; tags and releases were not modified.'
