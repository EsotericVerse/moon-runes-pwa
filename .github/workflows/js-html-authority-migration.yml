name: JS HTML Authority Migration

on:
  push:
    paths:
      - '.github/workflows/js-html-authority-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove fixed-copy workspace override from list runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/list.js')
          text = p.read_text(encoding='utf-8')
          start_marker = '  function organizeRuneWorkspace(){\n'
          end_marker = '\n  organizeRuneWorkspace();\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('organizeRuneWorkspace block not found exactly')
          end += len(end_marker)
          text = text[:start] + text[end:]
          if 'organizeRuneWorkspace' in text:
              raise SystemExit('organizeRuneWorkspace reference remains')
          p.write_text(text, encoding='utf-8')
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/list.js
          git commit -m "refactor: keep rune workspace fixed copy in HTML" || exit 0
          git push
