name: RC3 star boundary cases once

on:
  push:
    paths:
      - '.github/workflows/rc3-star-boundary-cases-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply star boundary governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lex_path = Path('data/json/registries/LUNARUNE_DERIVED_LEXICON.json')
          evo_path = Path('data/json/registries/LUNARUNE_EVOLUTION_HISTORY.json')

          lex = json.loads(lex_path.read_text(encoding='utf-8'))
          g = lex.setdefault('governance', {})
          g['highest_principle_rule'] = '完整詞組若存在能直接統攝整體語意的最高原則符文，該符文優先於一般群組總體提升。星作為最高原則時，前提是「星」仍保有天體／天象語意；若完整詞已詞彙化成非天體義，先依完整詞義判斷。例：日月星辰→星；明星不因含星而歸星。'
          g['star_boundary_rule'] = '星通常可統攝天體／天象語意，但固定詞可覆寫：星火屬禍；明星為非天體義，不套用星的最高原則。'

          entries = lex.setdefault('entries', [])
          by_term = {e.get('term'): e for e in entries}
          cases = [
            {
              'term':'星火',
              'surface_runes':['星','火'],
              'lexical_class':'固定詞／名詞',
              'relation':'semantic_ownership_shift',
              'resolved_rune':'禍',
              'status':'confirmed',
              'source':'治理實作範例',
              'evidence':'「星火」雖含星、火，但屬現行治理特例，整體主體歸禍。',
              'note':'星的天體最高原則在固定詞「星火」中不適用；完整詞義優先。'
            },
            {
              'term':'明星',
              'surface_runes':['明','星'],
              'lexical_class':'固定名詞',
              'relation':'lexicalized_out_of_celestial_domain',
              'resolved_rune':None,
              'status':'special',
              'source':'治理實作範例',
              'evidence':'「明星」現代常用義指知名人物，不是天體；不能因含「星」就套用天體最高原則。',
              'note':'用來限制星的最高原則適用域：先判完整詞義，再判星是否仍為天體語義。'
            }
          ]
          for c in cases:
              if c['term'] in by_term:
                  by_term[c['term']].update(c)
              else:
                  entries.append(c)
          lex['version'] = '1.4-rc3'
          lex_path.write_text(json.dumps(lex, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          evo = json.loads(evo_path.read_text(encoding='utf-8'))
          gov = evo.setdefault('governance_evolution', [])
          if not any(x.get('title') == '最高原則的適用域' for x in gov):
              gov.append({
                'order': max([x.get('order',0) for x in gov] or [0]) + 1,
                'title':'最高原則的適用域',
                'before':'只要詞中出現星，容易把星的最高原則過度套用。',
                'after':'先確認星是否仍保有天體／天象語義；固定詞若已詞彙化改義，完整詞義優先。',
                'effect':'保留日月星辰→星，同時正確處理星火→禍與明星非天體義。'
              })
          cases_evo = evo.setdefault('semantic_history_cases', [])
          by_title = {x.get('title'): x for x in cases_evo}
          new_cases = [
            {
              'title':'星火 → 禍',
              'kind':'semantic_ownership_shift',
              'before':'表面含星與火，若只看字面可能誤套星或火。',
              'after':'完整固定詞依治理規則主體歸禍。',
              'note':'最高原則有適用域；完整詞義可覆寫單字原則。'
            },
            {
              'title':'明星 → 非天體義',
              'kind':'lexicalized_out_of_domain',
              'before':'表面含明與星。',
              'after':'現代常用義指知名人物，不屬天體語義，因此不套用星的最高原則。',
              'note':'詞彙化會限制符文最高原則的適用範圍。'
            }
          ]
          next_order = max([x.get('order',0) for x in cases_evo] or [0]) + 1
          for c in new_cases:
              if c['title'] in by_title:
                  by_title[c['title']].update(c)
              else:
                  c['order'] = next_order
                  next_order += 1
                  cases_evo.append(c)
          evo['version'] = '1.4-rc3'
          evo_path.write_text(json.dumps(evo, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rc3-star-boundary-cases-once.yml
          git add data/json/registries/LUNARUNE_DERIVED_LEXICON.json data/json/registries/LUNARUNE_EVOLUTION_HISTORY.json
          git commit -m 'fix(graph): constrain star highest-principle scope'
          git push
