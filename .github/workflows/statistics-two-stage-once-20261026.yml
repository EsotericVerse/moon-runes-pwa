name: One-time Statistics two-stage selector verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/statistics-two-stage-once-20261026.yml'
      - 'app/modular/modules/statistics/**'
      - 'app/styles/scope-system.css'
      - 'scripts/test-statistics-compare-options.mjs'
      - 'scripts/test-app-bootstrap.mjs'
permissions:
  contents: read
jobs:
  verify-without-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Selector logic tests
        run: node --test scripts/test-statistics-compare-options.mjs
      - name: Whole Bootstrap / Admin / Culture regressions
        run: npm run test:bootstrap
      - name: Non-ISR static Next.js build
        shell: bash
        run: npm run build:static 2>&1 | tee /tmp/statistics-build.log
      - name: Scan generated assets for retired ISR
        run: node scripts/verify-release-static-export.mjs
      - name: Confirm Statistics pages render without connection errors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8767 --bind 127.0.0.1 --directory out >/tmp/statistics-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for route in statics lo3rwang/statics; do
            id="${route//\//-}"
            timeout 60s google-chrome --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --disable-background-networking \
              --virtual-time-budget=16000 --dump-dom "http://127.0.0.1:8767/$route/" \
              >"/tmp/statistics-$id.html" 2>"/tmp/statistics-$id.log"
            test -s "/tmp/statistics-$id.html"
            if grep -Eq '目前資料庫連結失敗|目前資料庫連線失敗|資料庫連結失敗|class="[^"]*scope-error' "/tmp/statistics-$id.html"; then
              echo "::error::Statistics error in $route"
              exit 1
            fi
            echo "LOCAL CHROME OK $route rendered DOM bytes=$(wc -c <"/tmp/statistics-$id.html")"
          done
      - name: Dynamic browser tab, category and item interaction
        run: node scripts/test-statistics-two-stage-browser.mjs
      - name: Report Next warnings and errors
        if: always()
        run: |
          if test -f /tmp/statistics-build.log; then
            echo '### Build warnings and errors' >> "$GITHUB_STEP_SUMMARY"
            (grep -Ein '(^|[[:space:]])(warning|warn|error|failed)[:[:space:]]' /tmp/statistics-build.log || true) | tail -n 120 >> "$GITHUB_STEP_SUMMARY"
          fi
