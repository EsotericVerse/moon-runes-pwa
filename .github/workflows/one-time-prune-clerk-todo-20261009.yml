name: One-time prune Clerk TODO branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-prune-clerk-todo-20261009.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: "github.event.head_commit.message == 'ops: prune merged Clerk TODO documentation branch 20261009'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Main required');
            const {owner,repo} = context.repo;
            const branch = 'docs/todo-nextjs-server-clerk-runtime-20261009';
            const pr = await github.rest.pulls.get({owner,repo,pull_number:476});
            if (!pr.data.merged || pr.data.head.ref !== branch) throw new Error('PR merge guard');
            await github.rest.git.deleteRef({owner,repo,ref:`heads/${branch}`});
            core.info(`Deleted ${branch}`);
