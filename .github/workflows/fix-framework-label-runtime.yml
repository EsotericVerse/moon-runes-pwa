name: Fix framework label runtime
on:
  push:
    paths:
      - '.github/workflows/fix-framework-label-runtime.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale framework label overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/main.js')
          s=p.read_text()
          s=s.replace('想理解整體則查看「LOC1–8 模組架構」。','想理解整體則查看「LOC架構圖」。')
          s=s.replace('''  document.querySelectorAll('a[href="#framework-map"]').forEach(link => {\n    if (link.textContent.includes("LOC")) link.textContent = "LOC1–8 模組架構";\n  });\n''','')
          p.write_text(s)
          PY
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-framework-label-runtime.yml
          git add js/main.js
          git commit -m "Remove stale LOC1-8 framework label override"
          git push
