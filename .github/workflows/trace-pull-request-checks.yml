name: Trace manual integration check
# Manual-only: no PR-triggered builds or source-text test assertions.
# No deployment, ISR, R2/DO writes, or Neon sync.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Next.js app without ISR deployment
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/trace-next-build.log
      - name: Render real public Trace in local Chrome, including narrow mobile layouts
        if: success()
        timeout-minutes: 5
        run: node scripts/test-trace-browser-smoke.mjs
      - name: Verify ISR remains suspended
        if: success() || failure()
        run: node scripts/verify-release-isr.mjs
      - name: Preserve failure diagnostics
        if: failure()
        run: |
          echo "## Trace verification failure" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/trace-next-build.log ]; then
            tail -n 180 /tmp/trace-next-build.log >> "$GITHUB_STEP_SUMMARY"
          fi
