name: LunaRunes game integration checks
on:
  pull_request:
    paths:
      - 'app/lrunes/game/**'
      - 'app/loc/LocApp.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lunarunes-game-ci.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and verify lockfile
        run: |
          npm install --no-audit --no-fund
          git diff --exit-code package-lock.json
      - name: Verify application build
        run: npm run build
