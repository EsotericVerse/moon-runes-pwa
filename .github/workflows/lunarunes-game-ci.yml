name: LunaRunes game integration checks
on:
  push:
    branches: [main]
    paths:
      - 'app/lrunes/game/**'
      - 'app/loc/LocApp.jsx'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test-lunarunes-boardgame.mjs'
      - '.github/workflows/lunarunes-game-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and verify lockfile
        run: |
          npm ci --no-audit --no-fund
      - name: Test game rules
        run: npm run test:game
      # Full app build already runs in the main architecture check; do not duplicate it here.
