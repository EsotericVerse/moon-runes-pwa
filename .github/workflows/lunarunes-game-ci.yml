name: LunaRunes game integration checks
on:
  push:
    branches: [main]
    paths:
      - 'app/lrunes/game/**'
      - 'app/loc/LocApp.jsx'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test-lunarunes-boardgame.mjs'
      - '.github/workflows/lunarunes-game-ci.yml'
  pull_request:
    paths:
      - 'app/lrunes/game/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test-lunarunes-boardgame.mjs'
      - '.github/workflows/lunarunes-game-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install dependencies and verify lockfile
        run: |
          npm ci --no-audit --no-fund
      - name: Test game rules
        run: npm run test:game
      # The main-branch build does not run for an unmerged security patch.
      # Validate a draft PR before the user considers merging it.
      - name: Audit dependency security (high and critical)
        if: github.event_name == 'pull_request'
        run: npm audit --audit-level=high
      - name: Build static export on PR
        if: github.event_name == 'pull_request'
        run: npm run build
      # Main pushes continue to use the existing architecture build.
