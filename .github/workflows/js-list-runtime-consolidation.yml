name: JS List Runtime Consolidation

on:
  push:
    paths:
      - '.github/workflows/js-list-runtime-consolidation.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate fixed-copy and draw renderers from list runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/list.js')
          text = p.read_text(encoding='utf-8')

          text = text.replace("  const headerCopies = Array.from(document.querySelectorAll('.loc-header-copy'));\n", "")

          start_marker = "  function keywordForDirection(runeRow, directionName){\n"
          end_marker = "  function infoBox(label, value){\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('draw enhancement block not found exactly')
          text = text[:start] + text[end:]

          text = text.replace("  headerCopies.forEach(node => node.remove());\n", "")
          text = text.replace('  if (overviewCopy) overviewCopy.textContent = "點選圖上的八個群組，可查看各組說明與符文資料。";\n', "")

          forbidden = ['renderRitualPreview', 'enhanceDrawCards', 'headerCopies']
          remains = [token for token in forbidden if token in text]
          if remains:
              raise SystemExit('retired list runtime responsibilities remain: ' + ', '.join(remains))

          p.write_text(text, encoding='utf-8')
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/list.js
          git commit -m "refactor: limit list runtime to library data" || exit 0
          git push

# trigger
