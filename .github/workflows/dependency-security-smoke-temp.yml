name: Temporary dependency security verification
on:
  push:
    branches: [feat/security-close-legacy-deps-20261024]
    paths:
      - package.json
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-security-smoke-temp.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Resolve lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit npm-generated lockfile only
        if: github.event_name == 'push'
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): regenerate security lockfile [skip ci]'
            git push origin HEAD:feat/security-close-legacy-deps-20261024
          fi
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
      - name: Verify boardgame.io local game client
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import assert from 'node:assert/strict';
          const require=createRequire(import.meta.url);
          const {Client}=require('boardgame.io/client');
          const {Client:ReactClient}=require('boardgame.io/react');
          assert.equal(typeof ReactClient,'function');
          const game={name:'security-local-smoke',setup:()=>({n:0}),moves:{inc:({G})=>{G.n+=1}}};
          const client=Client({game,numPlayers:2});
          client.start();
          assert.equal(client.getState().G.n,0);
          client.moves.inc();
          assert.equal(client.getState().G.n,1);
          client.stop();
          NODE
      - name: Test game rules
        run: npm run test:game
      - name: Build static Next app
        run: npm run build
      - name: Audit all moderate-and-above advisories
        run: npm audit --audit-level=moderate
