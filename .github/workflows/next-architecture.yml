name: Next Architecture Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - '.github/workflows/next-architecture.yml'
  workflow_dispatch:

concurrency:
  group: next-architecture-main
  cancel-in-progress: true

jobs:
  build-next-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Current repository contracts
        run: npm run verify
      - name: Verify public database API
        run: npm run verify:db-public
      - name: Build Current static export
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser accessibility checks
        run: npm run test:ui
