name: Next Architecture Build

on:
  pull_request:
    paths:
      - "app/**"
      - "assets/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - ".github/workflows/next-architecture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-next-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Refresh lockfile for dependency changes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh package lock"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Current repository contracts
        run: npm run verify
      - name: Verify public database API
        run: npm run verify:db-public
      - name: Build Current static export
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser accessibility checks
        run: npm run test:ui
