name: Next Architecture Build

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/next-architecture.yml"
  workflow_dispatch:

jobs:
  build-next-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify direct Neon text query
        run: npm run verify:text-engine && npm run verify:rune-keyword-rules && npm run verify:rune-draw
      - name: Verify public Neon Data API
        run: npm run verify:neon-public
      - name: Verify modularity and build Current static export
        run: npm run build
