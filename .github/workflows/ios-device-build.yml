name: LOC iOS Device Unsigned IPA
run-name: LOC iOS IPA · ${{ github.ref_name }} · ${{ github.sha }}

# Manual only: no new IPA until requested by the owner.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach unsigned IPA to this existing RC prerelease (optional)'
        required: false
        type: string

permissions:
  contents: write

# Keep only the newest main build when several app commits land together.
concurrency:
  group: loc-ios-device-main
  cancel-in-progress: true

jobs:
  build-device-ipa:
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Checkout LOC
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify native build tools
        run: |
          xcodebuild -version
          xcrun --find swift
      - name: Install dependency lockfile
        run: npm ci --no-audit --no-fund
      - name: Release security audit
        run: npm run audit:security
      - name: Game regression tests
        run: npm run test:game
      - name: Bootstrap performance and Admin regression tests
        run: npm run test:bootstrap
      - name: Build LOC static export for the native shell
        run: |
          npm run build:static
          test -f out/index.html
      - name: Check Guest and Admin static route exports
        run: node scripts/verify-release-static-export.mjs
      - name: Verify numeric source Rune card files (never rewrite)
        run: python3 scripts/prepare-ios-static-assets.py out
      - name: Generate ephemeral iOS project and sync
        run: |
          npx cap add ios
          npx cap sync ios
          test -f ios/App/App.xcodeproj/project.pbxproj
      - name: Install approved native LOC launcher icon
        run: |
          set -euo pipefail
          source_icon="assets/site/icons/loc-app-emblem.png"
          target_icon="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          test -s "$source_icon"
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          swift scripts/prepare-ios-app-icon.swift "$source_icon" "$target_icon"
          test -s "$target_icon"
          /usr/bin/sips -g pixelWidth -g pixelHeight "$target_icon" | grep -q '1024'
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Compile unsigned physical-device application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/loc-ios-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION=1.1.0 \
            CURRENT_PROJECT_VERSION=12 \
            build
      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/loc-ios-device-build/Build/Products/Debug-iphoneos/App.app"
          test -d "$app"
          test -f "$app/Info.plist"
          test -f "$app/App"
          test -f "$app/public/index.html"
          test -s "$app/Assets.car"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")
          test "$version" = '1.1.0'
          test "$build" = '12'
          test "$icon" = 'AppIcon'
          xcrun lipo -archs "$app/App" | tr ' ' '\n' | grep -qx arm64
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test "$bundle" = "cc.lo3rwang.loc.mobile"
          stage="$RUNNER_TEMP/loc-ios-package"
          mkdir -p "$stage/Payload" "$GITHUB_WORKSPACE/dist"
          ditto "$app" "$stage/Payload/App.app"
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/dist/LOC-1.1.0-rc.2-device-unsigned.ipa" Payload)
          unzip -t "$GITHUB_WORKSPACE/dist/LOC-1.1.0-rc.2-device-unsigned.ipa" | tail -1
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('dist/LOC-1.1.0-rc.2-device-unsigned.ipa') as archive:
              paths=archive.namelist()
              assert all(name.isascii() for name in paths), 'Unicode filenames remain inside IPA'
              prefix='Payload/App.app/public/assets/lunarunes/cards/'
              actual={name for name in paths if name.startswith(prefix) and name.endswith('.png')}
              expected={prefix+f'{index:02}.png' for index in range(0,67)}
              assert actual==expected, f'Expected 66 ASCII-named card images, got {len(actual)}'
              print('IPA verified: ASCII-only paths and 67 numeric card images')
          PY
          test -s "$GITHUB_WORKSPACE/dist/LOC-1.1.0-rc.2-device-unsigned.ipa"
          echo "Unsigned IPA generated. It must be signed on the user's machine; this CI artifact is NOT directly installable."
      - name: Upload unsigned IPA artifact
        id: ipa_upload
        uses: actions/upload-artifact@v4
        with:
          name: LOC-1.1.0-RC2-${{ github.run_number }}-unsigned
          path: dist/LOC-1.1.0-rc.2-device-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Attach unsigned IPA to the 1.1 RC prerelease
        if: ${{ inputs.release_tag == 'v1.1.0-rc.2' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ inputs.release_tag }}' dist/LOC-1.1.0-rc.2-device-unsigned.ipa --clobber
      - name: Publish build summary and artifact link
        env:
          ARTIFACT_URL: ${{ steps.ipa_upload.outputs.artifact-url }}
        run: |
          {
            echo '## LOC 1.1 RC2 iOS device test build (unsigned)'
            echo "- Source branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- [Download IPA Artifact]($ARTIFACT_URL)"
            echo '- IPA is unsigned; Apple signing is required before device installation.'
            echo '- CI validates packaging, not native iPhone tap/navigation behavior.'
          } >> "$GITHUB_STEP_SUMMARY"
