name: RC3 enrich derived graph once

on:
  push:
    paths:
      - '.github/workflows/rc3-enrich-derived-graph-once.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich derived graph projection
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          js_path = Path('js/rune-context-graph.js')
          text = js_path.read_text(encoding='utf-8')

          old = """      for(const part of entry?.surface_runes||[]){\n        const name=String(part||'').trim();\n        if(!runeNames.has(name))continue;\n        addEdge(edges,{\n          source:nodeId('rune',name),target:tid,type:'surface_component_of',\n          source_field:'surface_runes',evidence:`${name} ∈ ${term}`\n        });\n      }\n\n      if(owner&&runeNames.has(owner)){"""

          new = """      const lexicalClass=String(entry?.lexical_class||'').trim();\n      if(lexicalClass){\n        const classId=nodeId('lexical_class',lexicalClass);\n        addNode(nodes,{id:classId,label:lexicalClass,type:'lexical_class',group:DEFAULT_GROUP});\n        addEdge(edges,{source:tid,target:classId,type:'has_lexical_class',source_field:'lexical_class',evidence:lexicalClass});\n      }\n\n      const relationType=String(entry?.relation||'derived').trim()||'derived';\n      const relationId=nodeId('relation_type',relationType);\n      addNode(nodes,{id:relationId,label:relationType,type:'relation_type',group:DEFAULT_GROUP});\n      addEdge(edges,{source:tid,target:relationId,type:'uses_relation',source_field:'relation',evidence:relationType});\n\n      const statusValue=String(entry?.status||'special').trim()||'special';\n      const statusId=nodeId('status',statusValue);\n      addNode(nodes,{id:statusId,label:statusValue,type:'status',group:DEFAULT_GROUP});\n      addEdge(edges,{source:tid,target:statusId,type:'has_status',source_field:'status',evidence:statusValue});\n\n      const surfaceGroups=new Set();\n      for(const part of entry?.surface_runes||[]){\n        const name=String(part||'').trim();\n        if(!runeNames.has(name))continue;\n        addEdge(edges,{\n          source:nodeId('rune',name),target:tid,type:'surface_component_of',\n          source_field:'surface_runes',evidence:`${name} ∈ ${term}`\n        });\n        const sg=runeGroup.get(name);\n        if(sg)surfaceGroups.add(sg);\n      }\n      for(const sg of surfaceGroups){\n        addEdge(edges,{source:tid,target:nodeId('group',sg),type:'surface_group',source_field:'surface_runes',evidence:`${term} 表面涉及 ${sg}組`});\n      }\n      if(surfaceGroups.size>1){\n        addEdge(edges,{source:tid,target:relationId,type:'cross_group_composition',source_field:'surface_runes',evidence:[...surfaceGroups].join(' × ')});\n      }\n\n      if(ownerGroup){\n        addEdge(edges,{source:tid,target:nodeId('group',ownerGroup),type:'resolved_group',source_field:'semantic_owner',evidence:`${term} → ${ownerGroup}組`});\n      }\n\n      if(owner&&runeNames.has(owner)){"""

          if text.count(old) != 1:
              raise SystemExit(f'graph insertion anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace("version:'runes-json-derived-v3'", "version:'runes-json-derived-v4'", 1)
          text = text.replace("derived_does_not_modify_canon:true", "derived_does_not_modify_canon:true,\n        graph_projection:'small_primitives_expand_via_relations'", 1)
          js_path.write_text(text, encoding='utf-8')

          lex_path = Path('data/json/registries/LUNARUNE_DERIVED_LEXICON.json')
          data = json.loads(lex_path.read_text(encoding='utf-8'))
          gov = data.setdefault('governance', {})
          gov['graph_projection'] = {
              'principle': '少量 Canon 與高價值衍生詞，透過關係投影擴張 Graph；不以大量同義詞灌資料。',
              'generated_nodes': ['lexical_class', 'relation_type', 'status'],
              'generated_edges': ['surface_component_of', 'surface_group', 'cross_group_composition', 'has_lexical_class', 'uses_relation', 'has_status', 'resolved_to', 'resolved_group', 'ambiguous_with', 'remains_special'],
              'materialization': 'runtime-derived',
              'source_of_truth': 'Base66 Canon + LUNARUNE_DERIVED_LEXICON.json'
          }
          lex_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Commit enriched graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/rune-context-graph.js data/json/registries/LUNARUNE_DERIVED_LEXICON.json
          git commit -m "feat(graph): project sparse rune data into richer graph"
          git push
