name: Culture second river — isolated verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/culture-river-once-20261026.yml'
      - 'app/modular/features/Culture.jsx'
      - 'app/loc/culture-river-roots.mjs'
      - 'scripts/test-culture-river-roots.mjs'
permissions:
  contents: read
concurrency:
  group: culture-river-20261026
  cancel-in-progress: true
jobs:
  culture-build-no-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies without auditing
        run: npm ci --no-audit --no-fund
      - name: Verify culture classifications and source lazy-loading
        run: node --test scripts/test-culture-river-roots.mjs
      - name: Existing source and time regressions
        run: |
          node --experimental-vm-modules --test scripts/test-numeric-isr.mjs scripts/test-isr-client-cache.mjs scripts/test-empty-scope.mjs
      - name: Next.js static compilation (no deployment or ISR)
        shell: bash
        run: npm run build:static 2>&1 | tee /tmp/culture-build.log
      - name: Verify the publishable JS excludes retired ISR
        run: node scripts/verify-release-static-export.mjs
      - name: Local Chrome dynamic Culture and Statistics smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory out >/tmp/culture-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for route in culture statics lo3rwang/culture lo3rwang/statics; do
            url="http://127.0.0.1:8765/$route/"
            id="${route//\//-}"
            timeout 60s google-chrome --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --disable-background-networking \
              --virtual-time-budget=17000 --dump-dom "$url" \
              >"/tmp/culture-$id.html" 2>"/tmp/culture-$id.log"
            test -s "/tmp/culture-$id.html"
            if grep -Eq '目前資料庫連結失敗|目前資料庫連線失敗|資料庫連結失敗|class="[^"]*scope-error' "/tmp/culture-$id.html"; then
              echo "::error::Culture/Statistics error in $route"
              exit 1
            fi
            if [[ "$route" == *culture ]]; then
              grep -q 'vis-timeline' "/tmp/culture-$id.html" || { echo "::error::Time river missing for $route"; exit 1; }
            else
              grep -Eq 'recharts|scope-stat-chart|scope-stat-data' "/tmp/culture-$id.html" || { echo "::error::Dynamic chart missing for $route"; exit 1; }
            fi
            echo "LOCAL CHROME OK $route rendered DOM bytes=$(wc -c <"/tmp/culture-$id.html")"
          done
      - name: Verify the release still prohibits ISR
        run: node scripts/verify-release-isr.mjs
      - name: Warning and error baseline summary
        if: always()
        shell: bash
        run: |
          if test -f /tmp/culture-build.log; then
            echo '### Next.js build warnings/errors' >> "$GITHUB_STEP_SUMMARY"
            (grep -Ein '(^|[[:space:]])(warning|warn|error|failed)[:[:space:]]' /tmp/culture-build.log || true) | tail -n 100 >> "$GITHUB_STEP_SUMMARY"
          fi
