name: Migrate canonical rune source

on:
  push:
    branches:
      - recovery/1.0rc2-current
    paths:
      - .github/workflows/migrate-rune-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-shot rune source migration
        run: python scripts/migrate_rune_source.py

      - name: Verify generated runtime and zero legacy dependency
        run: |
          python scripts/build_runes_runtime.py
          git diff --exit-code -- js/runes66.js js/direction64.js
          ! grep -R --exclude-dir=.git "runes66.json" .
          test ! -e data/json/core/runes66.json

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove duplicate runes66 JSON dependency"
          git push
