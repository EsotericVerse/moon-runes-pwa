name: RC8.1 UIUX package sync

on:
  push:
    branches:
      - 'RC8.1UI/UX'
    paths:
      - 'package.json'
      - '.github/workflows/rc81-package-sync.yml'

permissions:
  contents: write

jobs:
  sync-packages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC8.1UI/UX
        uses: actions/checkout@v4
        with:
          ref: 'RC8.1UI/UX'
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Synchronize dependencies
        run: npm install motion@13.4.4 --save-exact

      - name: Commit synchronized manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync RC8.1 UIUX dependencies"
            git push origin HEAD:RC8.1UI/UX
          fi
