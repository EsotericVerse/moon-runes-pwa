name: Rune Runtime Consolidation

on:
  push:
    paths:
      - '.github/workflows/rune-runtime-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate rune runtimes
        shell: python
        run: |
          from pathlib import Path

          list_path = Path('js/list.js')
          gov_path = Path('js/rune-display-governance.js')
          list_text = list_path.read_text(encoding='utf-8')
          gov_text = gov_path.read_text(encoding='utf-8')

          start = 'document.addEventListener("DOMContentLoaded", async () => {\n'
          if start not in list_text:
              raise SystemExit('list.js DOMContentLoaded wrapper start not found')
          list_text = list_text.replace(
              start,
              'async function initRunePage() {\n  const file = location.pathname.split("/").pop() || "";\n  if (!["runes.html", "lots.html"].includes(file)) return;\n',
              1
          )
          suffix = '\n});'
          pos = list_text.rfind(suffix)
          if pos < 0:
              raise SystemExit('list.js wrapper end not found')
          list_text = list_text[:pos] + '\n}\n\nif (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initRunePage, {once:true});\nelse initRunePage();' + list_text[pos+len(suffix):]

          banner = '''\n\n/* Shared LunaRunes dynamic card presentation.\n   Fixed page copy belongs in HTML; this section only governs dynamic rune/search cards. */\n'''
          Path('js/rune.js').write_text(list_text.rstrip() + banner + gov_text.strip() + '\n', encoding='utf-8')

          for html_name in ['runes.html','lots.html']:
              p = Path(html_name)
              text = p.read_text(encoding='utf-8')
              old = 'js/list.js?v=20260905-5'
              new = 'js/rune.js?v=20260911-1'
              if old not in text:
                  raise SystemExit(f'{html_name}: old list.js reference not found')
              p.write_text(text.replace(old,new), encoding='utf-8')

          search = Path('search.html')
          text = search.read_text(encoding='utf-8')
          marker = '<script src="js/loc-nav.js"></script>'
          module = '<script type="module" src="js/rune.js?v=20260911-1"></script>\n  '
          if 'js/rune.js?v=20260911-1' not in text:
              if marker not in text:
                  raise SystemExit('search.html loc-nav marker not found')
              text = text.replace(marker, module + marker, 1)
          search.write_text(text, encoding='utf-8')

          nav = Path('js/loc-nav.js')
          text = nav.read_text(encoding='utf-8')
          old = '    if(["runes.html","lots.html","search.html"].includes(file)) appendScript("js/rune-display-governance.js","loc-rune-display-governance");\n'
          if old not in text:
              raise SystemExit('loc-nav rune-display loader not found')
          nav.write_text(text.replace(old,''), encoding='utf-8')

          sw = Path('service-worker.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace('const CACHE_NAME = "moon-runes-pwa-v214";', 'const CACHE_NAME = "moon-runes-pwa-v215";')
          text = text.replace('  "/js/rune-display-governance.js",\n','')
          text = text.replace('  "/js/list.js?v=20260905-5",\n','  "/js/rune.js?v=20260911-1",\n')
          sw.write_text(text, encoding='utf-8')

          list_path.unlink()
          gov_path.unlink()

          forbidden = ['js/list.js','rune-display-governance.js']
          for token in forbidden:
              hits=[]
              for p in Path('.').rglob('*'):
                  if p.is_file() and '.git' not in p.parts and p.name != 'rune-runtime-consolidation.yml':
                      try: body=p.read_text(encoding='utf-8')
                      except Exception: continue
                      if token in body: hits.append(str(p))
              if hits:
                  raise SystemExit(f'{token} references remain: {hits}')

      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate LunaRunes runtime as rune.js" || exit 0
          git push

# trigger
