name: LOC spatial A branch validation (no deployment)

# Integrated A/1.1 RC pre-main check; explicit one-shot after final ZIP parsing changes.
# Isolated engineering check only. Never deploy Pages, Cloudflare, ISR, R2, DO or Vercel.
on:
  # Run on an explicit edit to this workflow, not on every A branch commit.
  # Branch-only workflows cannot rely on workflow_dispatch before main has it.
  push:
    branches:
      - feat/loc-spatial-anchors-20261026
    paths:
      - '.github/workflows/loc-spatial-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loc-spatial-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Existing dependency security gate
        run: npm run audit:security
      - name: Full Node regression suite
        id: full_node
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --experimental-vm-modules --test --test-concurrency=4 scripts/test-*.mjs 2>&1 | tee node-tests.log
      - name: Compare Node baseline from current main (read-only checkout)
        id: main_baseline
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git fetch origin main --depth=1
          mkdir -p /tmp/loc-main-baseline
          git archive origin/main | tar -x -C /tmp/loc-main-baseline
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/loc-main-baseline/node_modules
          (cd /tmp/loc-main-baseline && node --experimental-vm-modules --test --test-concurrency=4 scripts/test-*.mjs) 2>&1 | tee main-node-baseline.log
      - name: A regression integration suite
        id: bootstrap
        continue-on-error: true
        run: npm run test:bootstrap
      - name: Next production build (no deployment)
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee next-build.log
      - name: Check ISR remains disabled
        id: isr
        continue-on-error: true
        run: node scripts/verify-release-isr.mjs
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-validation-logs
          path: |
            node-tests.log
            main-node-baseline.log
            next-build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Require all checks successful
        if: always()
        env:
          NODE_RESULT: ${{ steps.full_node.outcome }}
          BOOTSTRAP_RESULT: ${{ steps.bootstrap.outcome }}
          ISR_RESULT: ${{ steps.isr.outcome }}
        run: |
          echo "node=$NODE_RESULT bootstrap=$BOOTSTRAP_RESULT isr=$ISR_RESULT"
          test "$NODE_RESULT" = success
          test "$BOOTSTRAP_RESULT" = success
          test "$ISR_RESULT" = success
