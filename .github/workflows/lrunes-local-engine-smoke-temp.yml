name: Temporary LunaRunes engine verification
on:
  push:
    branches: [feat/lrunes-replace-boardgame-20261024]
    paths:
      - .github/workflows/lrunes-local-engine-smoke-temp.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify boardgame.io removed and current Immer installed
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {produce} from 'immer';
          const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(p.packages['node_modules/boardgame.io'],undefined);
          assert.equal(p.packages['node_modules/immer']?.version,'11.1.18');
          assert.equal(p.packages['node_modules/svelte'],undefined);
          assert.equal(p.packages['node_modules/koa-socket-2'],undefined);
          assert.equal(produce({value:1},draft=>{draft.value=2}).value,2);
          NODE
      - name: Verify local match rules and move transitions
        run: npm run test:game
      - name: Verify Next.js static build
        run: npm run build
      - name: Audit package vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Commit exact npm-generated lockfile to verification branch
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(lock): regenerate without legacy game server packages [skip ci]'
            git pull --rebase origin feat/lrunes-replace-boardgame-20261024
            git push origin HEAD:feat/lrunes-replace-boardgame-20261024
          fi
