name: One-time Management UI verification (no deployment)
on:
  push:
    branches:
      - fix/management-hero-article-control-20261026
    paths:
      - .github/workflows/management-one-time-ci.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install dependency lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify security gate
        run: npm run audit:security
      - name: Run game regressions
        run: npm run test:game
      - name: Verify full bootstrap has no new failures beyond exact main baseline
        shell: bash
        run: |
          set +e
          npm run test:bootstrap > /tmp/management-bootstrap.log 2>&1
          bootstrap_status=$?
          set -e
          grep -E '^#|not ok|ok [0-9]+' /tmp/management-bootstrap.log | tail -n 18 || true
          node scripts/verify-trace-bootstrap-baseline.mjs /tmp/management-bootstrap.log
          if [ "$bootstrap_status" -ne 0 ]; then
            echo "::warning::Three known untouched-main Settings/Facebook assertions failed; no additional failure was accepted."
          fi
      - name: Build and verify Next static routes
        shell: bash
        run: |
          set -o pipefail
          npm run build:static 2>&1 | tee /tmp/management-build.log
          node scripts/verify-release-static-export.mjs
      - name: Retain failure diagnostics
        if: failure()
        run: |
          echo '## Failed management UI validation' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/management-build.log ]; then
            tail -n 150 /tmp/management-build.log >> "$GITHUB_STEP_SUMMARY"
          fi
