name: Cleanup home nav once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-home-nav-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/cleanup_home_nav_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/loc-nav.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "home: simplify module nav and move quick links to footer"
          git push
