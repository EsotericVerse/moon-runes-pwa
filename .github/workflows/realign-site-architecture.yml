name: Realign site architecture
on:
  push:
    paths:
      - '.github/workflows/realign-site-architecture.yml'
jobs:
  realign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical page split
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # 1) lots.html becomes the operational LunaRunes page.
          src = Path('runes.html').read_text(encoding='utf-8')
          lots = src
          lots = lots.replace('data-page="runes"', 'data-page="runes"')
          lots = lots.replace('runes.html?mode=', 'lots.html?mode=')
          lots = lots.replace('runes.html#draw', 'lots.html#draw')
          lots = lots.replace('runes.html#library', 'lots.html#library')
          lots = lots.replace('runes.html#beginner', 'lots.html#beginner')
          lots = lots.replace("'runes.html'", "'lots.html'")
          lots = lots.replace('"runes.html"', '"lots.html"')
          # Knowledge/RAG entry must stay on runes.html.
          lots = lots.replace('lots.html#reference', 'runes.html#reference')
          Path('lots.html').write_text(lots, encoding='utf-8')

          # 2) loc-nav: page-level routing follows the supplied architecture.
          p = Path('js/loc-nav.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('button("新手上路",{"data-runes-view":"beginner"})', 'link("新手上路","lots.html#beginner")')
          s = s.replace('button("占卜抽籤",{"data-runes-view":"draw"})', 'link("占卜抽籤","lots.html#draw")')
          s = s.replace('button("符文總覽",{"data-runes-view":"library"})', 'link("符文總覽","lots.html#library")')
          s = s.replace('button("符文知識庫",{"data-runes-view":"reference"})', 'link("符文知識庫","runes.html#reference")')
          s = s.replace('if (file === "statics.htm" || file === "statics.html") return "statics";', 'if (file === "statics.htm" || file === "statics.html") return "runes";\n    if (file === "lots.html") return "runes";')
          s = s.replace('else if (file === "runes.html") buildRunes(host);', 'else if (file === "runes.html" || file === "lots.html" || file === "statics.htm" || file === "statics.html") buildRunes(host);')
          s = s.replace('else if (file === "statics.htm" || file === "statics.html") buildStatics(host);', '')
          s = s.replace('link("單卡","runes.html?mode=single#draw")', 'link("單卡","lots.html?mode=single#draw")')
          s = s.replace('link("每日","runes.html?mode=daily#draw")', 'link("每日","lots.html?mode=daily#draw")')
          s = s.replace('link("雙卡","runes.html?mode=2card#draw")', 'link("雙卡","lots.html?mode=2card#draw")')
          s = s.replace('link("三卡","runes.html?mode=3card#draw")', 'link("三卡","lots.html?mode=3card#draw")')
          s = s.replace('link("五卡","runes.html?mode=5card#draw")', 'link("五卡","lots.html?mode=5card#draw")')
          s = s.replace('link("11卡","runes.html?mode=ow3gs#draw")', 'link("11卡","lots.html?mode=ow3gs#draw")')
          s = s.replace('link("說明","runes.html#draw-help")', 'link("說明","lots.html#draw-help")')
          s = s.replace('`runes.html?group=${encodeURIComponent(group)}#library`', '`lots.html?group=${encodeURIComponent(group)}#library`')
          # Section quick menus only belong to lots.html, not runes/statics.
          s = s.replace('const drawView = document.getElementById("drawView");', 'const drawView = fileName() === "lots.html" ? document.getElementById("drawView") : null;')
          s = s.replace('const libraryView = document.getElementById("libraryView");', 'const libraryView = fileName() === "lots.html" ? document.getElementById("libraryView") : null;')
          s = s.replace('if (file === "runes.html") appendScript("js/runes-pwa-ia.js","runes-pwa-ia");', 'if (file === "lots.html") appendScript("js/runes-pwa-ia.js","runes-pwa-ia");')
          p.write_text(s, encoding='utf-8')

          # 3) runes PWA IA is lots-only and all self-links target lots.html.
          p = Path('js/runes-pwa-ia.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('runes.html?mode=', 'lots.html?mode=')
          s = s.replace('runes.html#library', 'lots.html#library')
          s = s.replace('runes.html#beginner', 'lots.html#beginner')
          s = s.replace('runes.html#', 'lots.html#')
          s = s.replace('"runes.html"', '"lots.html"')
          s = s.replace("'runes.html'", "'lots.html'")
          s = s.replace('!=="runes.html"', '!=="lots.html"')
          p.write_text(s, encoding='utf-8')

          # 4) Home operational draw links point to lots.html.
          for name in ['index.html','js/main.js','js/home-canonical.js']:
              p = Path(name)
              if not p.exists(): continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('runes.html?mode=', 'lots.html?mode=')
              s = s.replace('runes.html#draw', 'lots.html#draw')
              p.write_text(s, encoding='utf-8')

          # 5) Rune library group links belong to lots.
          p = Path('js/list.js')
          if p.exists():
              s = p.read_text(encoding='utf-8').replace('runes.html?group=', 'lots.html?group=')
              p.write_text(s, encoding='utf-8')

          # 6) Cache: include lots, stop caching old loc2-game alias, bump version.
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'moon-runes-pwa-v\d+', 'moon-runes-pwa-v192', s, count=1)
          if '"/lots.html"' not in s:
              s = s.replace('"/runes.html",', '"/runes.html",\n  "/lots.html",')
          s = s.replace('  "/loc2-game.html",\n', '')
          p.write_text(s, encoding='utf-8')

          # 7) Remove this one-shot workflow from resulting tree.
          Path('.github/workflows/realign-site-architecture.yml').unlink()
      - name: Commit canonical architecture
        run: |
          git config user.name "EsotericVerse"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align site routes with canonical Lots Runes Statics architecture"
          git push
