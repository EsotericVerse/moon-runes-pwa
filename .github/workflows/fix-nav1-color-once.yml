name: Fix NAV1 color once
on:
  push:
    paths:
      - 'tools/fix_nav1_color_once.py'
      - '.github/workflows/fix-nav1-color-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_nav1_color_once.py
      - run: grep -q 'NAV1 COLOR CANON' css/style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          git commit -m "fix: restore NAV1 text colors"
          git push
