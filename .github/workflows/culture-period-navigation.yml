name: Culture first-river period regression
# Build and tests only. No deployment, ISR writes or data migration.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/modular/features/Culture.jsx'
      - 'app/loc/culture-period-navigation.mjs'
      - 'app/styles/scope-system.css'
      - 'scripts/test-culture-period-navigation.mjs'
      - 'scripts/test-app-bootstrap.mjs'
      - '.github/workflows/culture-period-navigation.yml'
permissions:
  contents: read
concurrency:
  group: culture-period-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Locked dependency install
        run: npm ci --no-audit --no-fund
      - name: Period and independent anchor regression
        run: node --test scripts/test-culture-period-navigation.mjs
      - name: Culture and app bootstrap focused regressions
        # Full baseline has pre-existing unrelated Settings/Facebook importer failures.
        run: |
          node --experimental-vm-modules --test --test-name-pattern='^(?!Settings document import is iOS only).*$' scripts/test-app-bootstrap.mjs
          node --test scripts/test-culture-river-roots.mjs
      - name: Build Next without deploying
        run: npm run build
