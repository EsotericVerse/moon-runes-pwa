name: Culture first-river period regression
# Does not deploy, publish assets, write ISR, or touch the database.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/modular/features/Culture.jsx'
      - 'app/loc/culture-period-navigation.mjs'
      - 'app/styles/scope-system.css'
      - 'scripts/test-culture-period-navigation.mjs'
      - '.github/workflows/culture-period-navigation.yml'
permissions:
  contents: read
concurrency:
  group: culture-period-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Locked dependency install
        run: npm ci --no-audit --no-fund
      - name: Period and independent anchor regression
        run: node --test scripts/test-culture-period-navigation.mjs
      - name: Existing bootstrap regression
        run: npm run test:bootstrap
      - name: Build Next without deploying
        run: npm run build
