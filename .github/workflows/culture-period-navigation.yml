name: Culture first-river period regression
# Build and tests only. No deployment, ISR writes or data migration.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/modular/features/Culture.jsx'
      - 'app/loc/culture-period-navigation.mjs'
      - 'app/loc/time-anchor-ranges.mjs'
      - 'app/loc/culture-time-trace-river.mjs'
      - 'scripts/test-culture-time-trace-river.mjs'
      - 'app/loc/time-schema-migration.mjs'
      - 'app/loc/culture-query.js'
      - 'app/loc/galaxy-query.js'
      - 'app/loc/providers/local-sqlite.mjs'
      - 'app/modular/features/CultureTimelineEditor.jsx'
      - 'app/modular/modules/culture-timeline/CultureTimeline.jsx'
      - 'app/modular/modules/culture-timeline/culture-timeline-model.js'
      - 'app/modular/features/Statistics.jsx'
      - 'supabase/migrations/*time_uid*'
      - 'scripts/test-time-anchor-ranges.mjs'
      - 'scripts/test-time-schema-migration.mjs'
      - 'app/styles/scope-system.css'
      - 'scripts/test-culture-period-navigation.mjs'
      - 'scripts/test-app-bootstrap.mjs'
      - '.github/workflows/culture-period-navigation.yml'
permissions:
  contents: read
concurrency:
  group: culture-period-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Locked dependency install
        run: npm ci --no-audit --no-fund
      - name: Period and independent anchor regression
        run: node --test scripts/test-culture-period-navigation.mjs scripts/test-time-anchor-ranges.mjs scripts/test-time-schema-migration.mjs scripts/test-culture-time-trace-river.mjs
      - name: Culture and app bootstrap focused regressions
        # Full baseline currently has pre-existing unrelated Settings/Facebook importer failures; these checks target the Culture feature.
        run: |
          node --experimental-vm-modules --test --test-name-pattern='Culture|Admin first tab|LOC group member editing' scripts/test-app-bootstrap.mjs
          node --test scripts/test-culture-river-roots.mjs
      - name: Build Next without deploying
        run: npm run build
