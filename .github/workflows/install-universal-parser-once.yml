name: One-time universal parser dependency install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-universal-parser-once.yml'

permissions:
  contents: write

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve universal parser dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify import parsing and existing import contracts
        run: |
          node --test scripts/test-universal-file-import.mjs scripts/test-import-batch.mjs scripts/test-import-source-classification.mjs
      - name: Commit lockfile and remove one-time installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/install-universal-parser-once.yml
          git add package-lock.json
          git commit -m "build(import): lock tested universal parser dependency"
          git push origin HEAD:main
