name: One-time LOC legacy branch cleanup
run-name: Archive and prune 96 obsolete branches before LOC 1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-prune-legacy-branches.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.repository == 'EsotericVerse/moon-runes-pwa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Audit every branch and persist restoration SHAs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner,repo}=context.repo;
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const openPrs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const {data:repository}=await github.rest.repos.get({owner,repo});
            if(repository.default_branch!=='main')throw Error('Default branch is no longer main');
            if(openPrs.length!==0)throw Error('Open PRs detected: aborting branch deletion');
            if(branches.length!==97)throw Error('Expected 97 refs including main, got '+branches.length);
            const main=branches.find(b=>b.name==='main');
            if(main?.commit?.sha!==context.sha)throw Error('main changed during cleanup preflight');
            const candidates=branches.filter(b=>b.name!=='main');
            if(candidates.length!==96||candidates.some(b=>b.protected))throw Error('Unexpected or protected branches');
            const manifest={repository:context.repo,main_sha:context.sha,source_run:context.runId,
              purpose:'One-time cleanup of obsolete pre-1.0 branches; tags/releases untouched',
              branches:candidates.map(b=>({name:b.name,sha:b.commit.sha,protected:b.protected}))};
            fs.writeFileSync('legacy-branch-tip-manifest.json',JSON.stringify(manifest,null,2)+'\n');
            core.notice('Preflight passed: 96 non-main unprotected branches. Manifest recorded.');
      - name: Save branch restoration manifest BEFORE any deletion
        uses: actions/upload-artifact@v4
        with:
          name: loc-pre-1-0-legacy-branch-tip-manifest
          path: legacy-branch-tip-manifest.json
          retention-days: 90
          if-no-files-found: error
      - name: Delete only audited non-main branch refs, never tags
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const manifest=JSON.parse(fs.readFileSync('legacy-branch-tip-manifest.json','utf8'));
            const {owner,repo}=context.repo;
            if(manifest.main_sha!==context.sha||manifest.branches.length!==96)
              throw Error('Manifest differs from audited main');
            const {data:main}=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if(main.object.sha!==manifest.main_sha)throw Error('main changed: abort');
            const openPrs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            if(openPrs.length)throw Error('Open PR detected: abort');
            let deleted=0;
            for(const branch of manifest.branches){
              const ref='heads/'+branch.name;
              const {data:current}=await github.rest.git.getRef({owner,repo,ref});
              if(current.object.sha!==branch.sha)
                throw Error('Branch moved, refusing to delete: '+branch.name);
              await github.rest.git.deleteRef({owner,repo,ref});
              deleted+=1;
            }
            const remaining=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            if(remaining.length!==1||remaining[0].name!=='main')
              throw Error('Cleanup incomplete: remaining '+remaining.map(b=>b.name).join(', '));
            core.notice('Deleted '+deleted+' audited legacy branches; main, tags and releases untouched.');
            await core.summary.addHeading('LOC 1.0 version control cleanup')
              .addRaw('Removed '+deleted+' obsolete branch refs; only main remains. The 90-day artifact contains original SHAs for restoration. Existing tags and GitHub Releases were not modified.').write();
