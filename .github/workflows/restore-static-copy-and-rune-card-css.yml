name: Restore static copy and rune card presentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-static-copy-and-rune-card-css.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge retired JS copy into authoritative HTML and CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Restore unified rune-card presentation into canonical style.css.
          css_path = Path('css/style.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* LunaRunes unified card display (canonical) */'
          if marker not in css:
              css += r'''

/* LunaRunes unified card display (canonical) */
.loc-rune-info-grid,
.rune-result-grid.loc-rune-info-grid,
#attributes .rune66-details.loc-rune-info-grid {
  display:grid!important;grid-template-columns:1fr!important;gap:8px!important;width:100%!important;max-width:none!important;margin-top:10px!important;padding:0!important;border:0!important;
}
.loc-rune-info-bubble,
.rune-result-grid.loc-rune-info-grid>.rune-result-field,
#attributes .rune66-detail.loc-rune-info-bubble,
.special-rune-meta.loc-rune-info-grid>*,
.rune-info .loc-rune-info-grid>* {
  display:block!important;box-sizing:border-box!important;width:100%!important;max-width:none!important;min-width:0!important;margin:0!important;padding:9px 11px!important;border:1px solid var(--line,var(--loc-border,rgba(180,158,255,.22)))!important;border-radius:12px!important;background:rgba(255,255,255,.035)!important;color:var(--muted,var(--loc-muted,#b9bfd0))!important;font-size:.78rem!important;font-weight:400!important;line-height:1.55!important;text-align:left!important;
}
.loc-rune-title-bubble,
.rune-result-name.loc-rune-title-bubble,
#attributes .loc-rune-title-bubble {
  display:block!important;box-sizing:border-box!important;width:100%!important;max-width:none!important;margin:0!important;padding:10px 12px!important;border:1px solid rgba(231,194,125,.42)!important;border-radius:12px!important;background:rgba(231,194,125,.065)!important;color:var(--gold,var(--loc-gold,#e7c27d))!important;font-size:.93rem!important;font-weight:900!important;line-height:1.5!important;text-align:left!important;
}
.loc-rune-info-bubble strong,
.rune-result-grid.loc-rune-info-grid .rune-result-label,
#attributes .rune66-detail.loc-rune-info-bubble strong {display:inline!important;margin:0!important;color:var(--gold,var(--loc-gold,#e7c27d))!important;font-size:inherit!important;font-weight:850!important;line-height:inherit!important}
.rune-result-grid.loc-rune-info-grid .rune-result-value {display:inline!important;margin:0 0 0 .35em!important;color:var(--muted,var(--loc-muted,#b9bfd0))!important;font-size:inherit!important;font-weight:400!important;line-height:inherit!important}
.loc-rune-position-bubble,
.rune-result-grid.loc-rune-info-grid>.loc-rune-position-bubble {padding:11px 13px!important;border-color:rgba(231,194,125,.58)!important;background:rgba(231,194,125,.10)!important;font-size:.88rem!important;font-weight:850!important}
.loc-rune-position-bubble .rune-result-label,.loc-rune-position-bubble .rune-result-value,.loc-rune-position-bubble strong {color:var(--gold,var(--loc-gold,#e7c27d))!important;font-weight:900!important}
.cards-grid[data-count="2"] .rune-result-grid.loc-rune-info-grid,
.cards-grid[data-count="3"] .rune-result-grid.loc-rune-info-grid,
.cards-grid[data-count="5"] .rune-result-grid.loc-rune-info-grid,
.cards-grid[data-count="11"] .rune-result-grid.loc-rune-info-grid {display:grid!important;grid-template-columns:1fr!important;max-width:none!important;width:100%!important;margin:10px 0 0!important}
.cards-grid[data-count="2"] .rune-result-grid.loc-rune-info-grid .rune-result-label,
.cards-grid[data-count="3"] .rune-result-grid.loc-rune-info-grid .rune-result-label,
.cards-grid[data-count="5"] .rune-result-grid.loc-rune-info-grid .rune-result-label,
.cards-grid[data-count="11"] .rune-result-grid.loc-rune-info-grid .rune-result-label {display:inline!important}
.cards-grid[data-count="2"] .rune-result-grid.loc-rune-info-grid .rune-result-field,
.cards-grid[data-count="3"] .rune-result-grid.loc-rune-info-grid .rune-result-field,
.cards-grid[data-count="5"] .rune-result-grid.loc-rune-info-grid .rune-result-field,
.cards-grid[data-count="11"] .rune-result-grid.loc-rune-info-grid .rune-result-field {border-radius:12px!important;text-align:left!important}
article.card [data-semantic-authority="direction"]{opacity:.88}
article.card [data-semantic-authority="extension"]{opacity:.78}
'''
              css_path.write_text(css, encoding='utf-8')

          # 2) Homepage: keep newcomer-facing hero concise; restore author words to HTML.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('治理已知，是為了把時間還給未知。','治理過去的已知，是為了把時間還給現在的未知，才有更充裕的未來。')
          author_marker = '月之符文本身是占卜指示籤詩的分析建議'
          if author_marker not in index:
              author_block = '''\n      <div class="loc-guidance-note author-words">\n        <p>月之符文本身是占卜指示籤詩的分析建議，重在符文本身的語彙交叉分析；巧妙的是，即使轉換語系也能通用，採取的是不帶神秘學預設的中立態度，重在文字本身而不論道德。</p>\n        <p>月典從月之符文開始，後來逐步演變成與月之符文相輔相成的語言系統；而月之符文，也在這個過程中演變成可被分析、治理與推演的符號式語言系統。</p>\n        <p>整合出月典，並不是為了把人生固定成某種發展模式，也不是為了賺錢，而是把散落、原本只能靠直覺掌握的語言與經驗，整理成可回看、可搜尋、可解析的結構，才能進一步面對未來的各種可能。</p>\n      </div>\n'''
              pat = re.compile(r'(<section class="section" aria-labelledby="about-title">.*?<h2 id="about-title">.*?</h2>.*?</div>\s*</div>)', re.S)
              index, n = pat.subn(lambda m: m.group(1)+author_block, index, count=1)
              if n != 1:
                  raise SystemExit('Could not locate homepage author section')
          index_path.write_text(index, encoding='utf-8')

          # 3) Restore retired concept-note copy as static HTML, phrased for each page's role.
          governance_path = Path('governance.html')
          governance = governance_path.read_text(encoding='utf-8')
          if 'id="loc-governance-neutral-note"' not in governance:
              note = '''\n<div id="loc-governance-neutral-note" class="loc-concept-note">\n  <small>Neutrality · De-mystification／中立 · 去神秘化</small>\n  <p><strong>LOC 以中立方式切分與治理語言，把模糊問題拆成可處理的規則、模組與演算法（Algorithm），不替使用者決定哪個答案必然正確。</strong></p>\n  <p>月之符文以「月」作為主體與識別，但描述時仍以語言本身為優先；籤詩的「指引」只是把不確定性整理成可以理解、比較與選擇的可能，不等於神諭、預言或命定。</p>\n  <p>可以把它想成：<strong>把申論題先整理成選擇題。</strong> 系統負責提供可辨認的路徑，人仍保有最後的判斷與選擇。</p>\n</div>\n'''
              start = governance.index('<section class="gov-card" id="principles">')
              end = governance.index('</section>', start)
              governance = governance[:end] + note + governance[end:]
              governance_path.write_text(governance, encoding='utf-8')

          rune_note = '''\n<section id="loc-runes-modular-note" class="loc-concept-note">\n  <small>LunaRunes · Semantic Structure／月之符文 · 語意結構</small>\n  <p><strong>月之符文把符文、群組、方向與組合整理成可辨認、比較與重新組合的語意單位。</strong></p>\n  <p>籤詩保留「指引」形式，但不是替人決定未來；它把原本開放的不確定性先整理成有限而可選的方向，像把申論題先整理成選擇題，再由人判斷怎麼理解與行動。</p>\n  <p>往工程層深入時，這些固定語意邊界可再進入檢索增強生成（Retrieval-Augmented Generation, RAG）、關係圖（Graph）、規則與演算法（Algorithm）等流程；首頁與新手區則不把這些術語當成使用門檻。</p>\n</section>\n'''
          for filename in ('runes.html','lots.html'):
              p = Path(filename); text = p.read_text(encoding='utf-8')
              if 'id="loc-runes-modular-note"' not in text:
                  anchor = '<section class="rune-basics"'
                  pos = text.find(anchor)
                  if pos == -1: raise SystemExit(f'Could not locate rune-basics in {filename}')
                  end = text.find('</section>', pos)
                  if end == -1: raise SystemExit(f'Could not close rune-basics in {filename}')
                  end += len('</section>')
                  text = text[:end] + rune_note + text[end:]
                  p.write_text(text, encoding='utf-8')

          evo_path = Path('evolution.html')
          evo = evo_path.read_text(encoding='utf-8')
          if 'id="loc-evolution-uncertainty-note"' not in evo:
              evo_note = '''\n  <section id="loc-evolution-uncertainty-note" class="loc-concept-note">\n    <small>Evolution · Structured Possibility／推演 · 結構化可能性</small>\n    <p><strong>推演不是預測命運，而是把不確定性拆成可以理解、比較與選擇的可能。</strong></p>\n    <p>月之符文提供一個實際例子：用語意切分把模糊問題拆成不同方向，讓原本必須自由作答的申論題，先變成可以比較的選擇題。這些選項不是命定答案，而是可供判斷的路徑。</p>\n    <p>在工程層，推演（Evolution）把同樣的概念延伸成：<strong>不確定性 → 語意拆分 → 模組化可能性 → 路徑比較 → 人的選擇 → 新結果 → 再次推演</strong>。選擇仍屬於人，新的結果再成為下一輪語言與脈絡的輸入。</p>\n  </section>\n'''
              marker2 = '<div class="metrics">'
              pos = evo.find(marker2)
              if pos == -1: raise SystemExit('Could not locate evolution metrics')
              evo = evo[:pos] + evo_note + evo[pos:]
              evo_path.write_text(evo, encoding='utf-8')

          # Verify that the runtime and restored CSS schema agree.
          rune_js = Path('js/rune.js').read_text(encoding='utf-8')
          style = Path('css/style.css').read_text(encoding='utf-8')
          required = ['loc-rune-info-grid','loc-rune-info-bubble','loc-rune-title-bubble','loc-rune-position-bubble']
          for cls in required:
              if cls not in rune_js or cls not in style:
                  raise SystemExit(f'Missing rune display contract: {cls}')
          PY
      - name: Commit restored canonical copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css index.html governance.html runes.html lots.html evolution.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore canonical static copy and rune card presentation"
          git push
