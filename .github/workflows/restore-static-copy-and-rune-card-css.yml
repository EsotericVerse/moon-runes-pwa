name: Restore static copy and rune card presentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-static-copy-and-rune-card-css.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply static copy merge
        run: python tools/restore_static_copy_once.py
      - name: Commit merged copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css index.html governance.html runes.html lots.html evolution.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore canonical static copy and rune card presentation"
          git push
