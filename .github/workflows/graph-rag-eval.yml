name: Graph RAG Evaluation

on:
  pull_request:
    paths:
      - "card_api/**"
      - "data/shared/LOC_GRAPH_*.json"
      - "data/shared/LOC8_*.json"
      - ".github/workflows/graph-rag-eval.yml"
  push:
    branches: [main]
    paths:
      - "card_api/**"
      - "data/shared/LOC_GRAPH_*.json"
      - "data/shared/LOC8_*.json"
      - ".github/workflows/graph-rag-eval.yml"
  workflow_dispatch:

jobs:
  graph-rag-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: card_api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest test_unified_search.py
      - run: python scripts/evaluate_graph_rag.py
