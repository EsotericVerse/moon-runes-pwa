name: Graph RAG Evaluation

on:
  pull_request:
    paths:
      - "api/**"
      - "data/json/registries/LOC_GRAPH_*.json"
      - "data/json/registries/LOC8_*.json"
      - ".github/workflows/graph-rag-eval.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "data/json/registries/LOC_GRAPH_*.json"
      - "data/json/registries/LOC8_*.json"
      - ".github/workflows/graph-rag-eval.yml"
  workflow_dispatch:

jobs:
  graph-rag-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python scripts/validate_repo_layout.py
      - run: python -m unittest discover -p "test_*.py"
      - run: python scripts/evaluate_graph_rag.py
      - run: python scripts/validate_search_core.py
