name: Unify active NAV1 rendering
on:
  push:
    paths:
      - '.github/workflows/unify-active-nav1.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make current NAV1 item non-clickable
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('js/loc-nav.js')
          s=p.read_text(encoding='utf-8')
          old='''  function paintNav(node, items = DEFAULT_NAV) {
    const active = currentId(node, items);
    node.innerHTML = `<a class="loc-global-brand" href="index.html" aria-label="回到 LOC月典首頁">LOC月典</a><div class="loc-global-links">${items.filter(item => item.id !== "search").map(item => `<a class="loc-global-link" href="${esc(item.href)}"${item.id === active ? ' aria-current="page"' : ""}>${esc(item.label)}</a>`).join("")}<form class="loc-global-search" action="search.html" method="get" role="search"><input name="q" type="search" aria-label="搜尋文字" placeholder="搜尋" /><button class="loc-global-search-submit" type="submit">搜尋</button></form></div>`;
  }'''
          new='''  function paintNav(node, items = DEFAULT_NAV) {
    const active = currentId(node, items);
    const isHome = fileName() === "index.html";
    const brand = isHome
      ? `<span class="loc-global-brand loc-global-current" aria-current="page">LOC月典</span>`
      : `<a class="loc-global-brand" href="index.html" aria-label="回到 LOC月典首頁">LOC月典</a>`;
    const links = items
      .filter(item => item.id !== "search")
      .map(item => item.id === active
        ? `<span class="loc-global-link loc-global-current" aria-current="page">${esc(item.label)}</span>`
        : `<a class="loc-global-link" href="${esc(item.href)}">${esc(item.label)}</a>`)
      .join("");
    node.innerHTML = `${brand}<div class="loc-global-links">${links}<form class="loc-global-search" action="search.html" method="get" role="search"><input name="q" type="search" aria-label="搜尋文字" placeholder="搜尋" /><button class="loc-global-search-submit" type="submit">搜尋</button></form></div>`;
  }'''
          if old not in s:
            raise SystemExit('paintNav target not found')
          s=s.replace(old,new,1)
          s=s.replace('const WEB_BUILD = "0.8";','const WEB_BUILD = "0.9";',1)
          p.write_text(s,encoding='utf-8')

          p=Path('css/loc-nav.css')
          css=p.read_text(encoding='utf-8')
          if '.loc-global-current' not in css:
            css += '\n.loc-global-current{cursor:default;text-decoration:none;pointer-events:none;}\n'
          p.write_text(css,encoding='utf-8')

          p=Path('service-worker.js')
          sw=p.read_text(encoding='utf-8')
          sw=re.sub(r'moon-runes-pwa-v\d+','moon-runes-pwa-v195',sw,count=1)
          p.write_text(sw,encoding='utf-8')

          Path('.github/workflows/unify-active-nav1.yml').unlink()
      - name: Commit
        run: |
          git config user.name "EsotericVerse"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unify current NAV1 item as non-clickable label"
          git push
