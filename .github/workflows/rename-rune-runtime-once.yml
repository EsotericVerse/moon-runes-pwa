name: Rename rune runtime once

on:
  push:
    branches: [main]
    paths:
      - "tools/rename_rune_runtime_once.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rename rune runtime files and references
        run: python tools/rename_rune_runtime_once.py
      - name: Validate repository layout
        run: python card_api/scripts/validate_repo_layout.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: normalize rune runtime naming"
          git push
