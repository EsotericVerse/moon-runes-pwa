name: Merge framework quick selector once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/merge-framework-quick-selector-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/merge_framework_quick_selector_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "home: merge framework quick selector copy into HTML"
          git push
