name: Branch Freeze

on:
  # Historical branch registry is diagnostic only, never a PR gate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-branch-freeze.mjs
