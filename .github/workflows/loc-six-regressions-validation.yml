name: LOC six regression root-cause validation (no deployment)
on:
  push:
    branches: [fix/loc-six-test-regressions-20261026]
    paths: ['.github/workflows/loc-six-regressions-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency audit
        run: npm run audit:security
      - name: Full Node regression suite, including map and spatial queue
        shell: bash
        run: |
          set -o pipefail
          node --experimental-vm-modules --test --test-concurrency=4 scripts/test-*.mjs 2>&1 | tee complete-tests.log
      - name: LOC bootstrap integration
        run: npm run test:bootstrap
      - name: Supported LOC static export for local Chrome smoke, no deployment
        run: npm run build:static
      - name: Chrome Culture UI against the exported site
        env:
          LOC_REQUIRE_CULTURE_BROWSER: '1'
        run: node scripts/test-culture-dynamic-browser.mjs
      - name: ISR stays disabled
        run: node scripts/verify-release-isr.mjs
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loc-six-regressions-logs
          path: complete-tests.log
          if-no-files-found: ignore
          retention-days: 3
