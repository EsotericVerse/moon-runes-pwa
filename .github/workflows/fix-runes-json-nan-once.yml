name: Fix runes JSON NaN once

on:
  push:
    branches: [main]
    paths:
      - "tools/fix_runes_json_nan_once.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fix invalid NaN values
        run: python tools/fix_runes_json_nan_once.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/json/core/runes.json
          git commit -m "fix: make runes.json strict JSON"
          git push
