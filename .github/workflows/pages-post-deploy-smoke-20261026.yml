name: One-time LOC Pages recovery live HTTP smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-post-deploy-smoke-20261026.yml
permissions:
  contents: read
jobs:
  live-http-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify live Pages, Culture and Statistics anonymous data RPC
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const source=readFileSync('app/loc/providers/supabase.mjs','utf8');
          const key=source.match(/DEFAULT_SUPABASE_PUBLISHABLE_KEY='([^']+)'/)?.[1];
          const base=source.match(/DEFAULT_SUPABASE_URL='([^']+)'/)?.[1];
          assert.ok(base&&key,'missing public Supabase URL/key');
          const testPage=async path=>{
            const url='https://loc.lo3rwang.cc'+path;
            const resp=await fetch(url,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            const text=await resp.text();
            assert.equal(resp.status,200,path+' page '+resp.status);
            assert.ok(text.includes('_next/static'),path+' missing Next.js script');
            console.log('LIVE PAGE OK:',path,'status',resp.status,'bytes',text.length);
          };
          for(const path of ['/','/culture/','/statics/'])await testPage(path);
          const rpc=async(name,args)=>{
            const resp=await fetch(base+'/rest/v1/rpc/'+name,{
              method:'POST',headers:{
                'apikey':key,'Content-Type':'application/json',
                'Accept-Profile':'silver','Content-Profile':'silver'
              },body:JSON.stringify(args),signal:AbortSignal.timeout(25000)
            });
            if(!resp.ok)throw Error(name+' HTTP '+resp.status+': '+(await resp.text()).slice(0,280));
            return resp.json();
          };
          const range={p_start:'2026-07-01',p_end:'2026-10-26'};
          const culture=await rpc('read_scope_statistics',{p_scope_id:'lo3rwang',...range,p_include_undated:true});
          assert.ok(Array.isArray(culture)&&culture.length>0,'Culture RPC returned no rows');
          const stats=await rpc('read_scope_overview',{p_scope_id:'lo3rwang',...range});
          assert.ok(stats&&Array.isArray(stats.rows),'Scope statistics overview invalid');
          const loc=await rpc('read_loc_statistics',range);
          assert.ok(loc&&Array.isArray(loc.rows),'LOC statistics invalid');
          console.log('LIVE RPC OK: Culture',culture.length,'Scope overview',stats.rows.length,'LOC overview',loc.rows.length);
          NODE
