name: Rename homepage author note
on:
  push:
    paths:
      - '.github/workflows/rename-home-author-note.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename final homepage block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<p class="eyebrow">Why LOC Exists</p>'
          new = '<p class="eyebrow">作者的話</p>'
          if old not in s:
              raise SystemExit('Expected Why LOC Exists label not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rename-home-author-note.yml
          git add index.html
          git commit -m "Rename homepage final block to 作者的話"
          git push
