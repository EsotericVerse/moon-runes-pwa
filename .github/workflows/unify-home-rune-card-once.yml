name: Unify homepage rune card once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unify-home-rune-card-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/unify_home_rune_card_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/main.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: unify homepage rune card display"
          git push
