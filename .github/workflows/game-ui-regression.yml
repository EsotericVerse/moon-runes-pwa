name: GameBoard Focused Regression

on:
  push:
    branches: [main]
    paths:
      - 'app/lrunes/game/**'
      - 'app/loc/providers/**'
      - 'tests/lunarunes-game-ui.spec.mjs'
      - '.github/workflows/game-ui-regression.yml'
  workflow_dispatch:

concurrency:
  group: game-ui-regression-main
  cancel-in-progress: true

jobs:
  game-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build app
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify GameBoard Desktop
        run: npx playwright test tests/lunarunes-game-ui.spec.mjs --project=desktop-chromium --workers=1
      - name: Preserve failed screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-ui-failures
          path: test-results/
          retention-days: 3
