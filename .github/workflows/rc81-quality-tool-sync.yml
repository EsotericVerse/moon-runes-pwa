name: RC8.1 UIUX quality tool sync

on:
  push:
    branches:
      - 'RC8.1UI/UX'
    paths:
      - '.github/workflows/rc81-quality-tool-sync.yml'

permissions:
  contents: write

jobs:
  sync-quality-tools:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC8.1UI/UX
        uses: actions/checkout@v4
        with:
          ref: 'RC8.1UI/UX'
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install UI quality tools
        run: npm install --save-dev --save-exact @playwright/test@1.63.0 @axe-core/playwright@4.13.0 @lhci/cli@0.15.1

      - name: Commit synchronized manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add RC8.1 UI quality toolchain"
            git push origin HEAD:RC8.1UI/UX
          fi
