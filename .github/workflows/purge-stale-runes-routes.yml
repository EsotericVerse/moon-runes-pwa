name: Purge stale runes routes
on:
  push:
    paths:
      - '.github/workflows/purge-stale-runes-routes.yml'
jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Purge stale operational runes routes
        shell: python
        run: |
          from pathlib import Path
          import re

          exts={'.html','.htm','.js','.md','.json'}
          skip_parts={'.git','data/archive'}
          replacements=[
            ('runes.html?mode=','lots.html?mode='),
            ('runes.html?group=','lots.html?group='),
            ('runes.html#draw','lots.html#draw'),
            ('runes.html#library','lots.html#library'),
            ('runes.html#beginner','lots.html#beginner'),
          ]
          changed=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in exts: continue
            posix=p.as_posix()
            if posix.startswith('data/archive/'): continue
            if posix=='.github/workflows/purge-stale-runes-routes.yml': continue
            try: s=p.read_text(encoding='utf-8')
            except Exception: continue
            original=s
            for old,new in replacements: s=s.replace(old,new)
            if s!=original:
              p.write_text(s,encoding='utf-8'); changed.append(posix)

          # Remove obsolete duplicate third-level builders from runes-pwa-ia.js;
          # section-local quick menus are now owned by loc-nav.js.
          p=Path('js/runes-pwa-ia.js')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'\n  function addDrawThirdLevel\(\)[\s\S]*?(?=\n  function bindGroupShortcuts\(\))','\n',s,count=1)
            s=s.replace('wireNavigation();addDrawThirdLevel();addLibraryThirdLevel();bindGroupShortcuts();','wireNavigation();bindGroupShortcuts();')
            p.write_text(s,encoding='utf-8')

          # Bump cache after route cleanup.
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'moon-runes-pwa-v\d+','moon-runes-pwa-v194',s,count=1)
          p.write_text(s,encoding='utf-8')

          # Guard: active web code must not contain operational runes routes.
          offenders=[]
          needles=['runes.html?mode=','runes.html?group=','runes.html#draw','runes.html#library','runes.html#beginner']
          for p in list(Path('.').glob('*.html'))+list(Path('.').glob('*.htm'))+list(Path('js').glob('*.js')):
            if not p.is_file(): continue
            txt=p.read_text(encoding='utf-8',errors='ignore')
            for n in needles:
              if n in txt: offenders.append(f'{p}:{n}')
          if offenders:
            raise SystemExit('stale operational runes routes remain: '+', '.join(offenders))

          Path('.github/workflows/purge-stale-runes-routes.yml').unlink()
      - name: Commit route cleanup
        run: |
          git config user.name "EsotericVerse"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Purge stale operational runes routes in favor of Lots"
          git push
