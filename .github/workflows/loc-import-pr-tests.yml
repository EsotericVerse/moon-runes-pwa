name: LOC import regression (PR)
# Read-only PR regressions. No deployment, production build, or database access.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loc-import-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Parse application JavaScript and JSX
        run: npm run check:syntax
      - name: Run real LOC archive and reimport regression tests
        run: |
          node --test \
            scripts/test-facebook-backup-place.mjs \
            scripts/test-import-place-anchors.mjs \
            scripts/test-import-createdat-reimport.mjs \
            scripts/test-import-duplicate-check.mjs \
            scripts/test-archive-import-pipeline.mjs \
            scripts/test-archive-media-evidence.mjs \
            scripts/test-private-archive-safety.mjs
      - name: Full app bootstrap and admin regressions
        run: npm run test:bootstrap
