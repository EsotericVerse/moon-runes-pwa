name: LOC import regression (PR)
# Lightweight, read-only parser tests. No Next build, deploy, or database access.
on:
  push:
    branches: ['fix/facebook-trace-geo-object-import']
  pull_request:
    paths:
      - 'app/loc/**'
      - 'scripts/test-facebook-backup-place.mjs'
      - 'scripts/test-import-place-anchors.mjs'
      - 'scripts/test-import-createdat-reimport.mjs'
      - 'scripts/test-import-duplicate-check.mjs'
      - 'scripts/test-universal-archive-import.mjs'
      - '.github/workflows/loc-import-pr-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loc-import-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run real LOC archive and reimport regression tests
        run: |
          node --test \
            scripts/test-facebook-backup-place.mjs \
            scripts/test-import-place-anchors.mjs \
            scripts/test-import-createdat-reimport.mjs \
            scripts/test-import-duplicate-check.mjs \
            scripts/test-archive-import-pipeline.mjs \
            scripts/test-archive-media-evidence.mjs \
            scripts/test-private-archive-safety.mjs
