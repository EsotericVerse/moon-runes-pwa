name: Deploy Main Next to GitHub Pages

# Cost control: no automatic rebuild of the public website on each commit.
# Manually run this workflow only for an intentional GitHub Pages deployment.
on:
  workflow_dispatch:
  # One-time emergency recovery of Culture and Statistics on GitHub Pages.
  # This does NOT deploy Cloudflare or re-enable ISR.
  push:
    branches: [main]
    paths:
      - '.github/recovery/pages-20261026.trigger'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # See next-architecture.yml for why this is pinned instead of
    # ubuntu-latest (the same runner-image migration window).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Security release gate (moderate, high and critical)
        run: npm run audit:security
      - name: Game regression tests
        run: npm run test:game
      - name: Bootstrap performance and Admin regression tests
        run: npm run test:bootstrap
      - name: Build Next static export for GitHub Pages
        # shell: bash enables pipefail; without it `| tee` hides a failed build.
        shell: bash
        run: npm run build:static 2>&1 | tee /tmp/next-build.log
      - name: Check Guest and Admin static route exports
        run: node scripts/verify-release-static-export.mjs
      - name: Report build failure to job summary
        if: failure()
        run: |
          echo '## Build failure output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/next-build.log ]; then
            tail -n 200 /tmp/next-build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Build was not started. See the earlier failed test or setup step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Probe out/ with tar
        if: success()
        run: |
          tar -cf /dev/null --dereference --hard-dereference out 2>/tmp/tar.err; RC=$?
          echo "::notice title=tar-probe::rc=$RC $(head -c 300 /tmp/tar.err | tr '\n' ' ')"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
