name: Deploy Main Next to GitHub Pages

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify shared FlexSearch engine
        run: npm run verify:text-engine && npm run verify:semantic-state && npm run verify:rune-keyword-rules && npm run verify:rune-draw
      - name: Verify public Neon Data API
        run: node --experimental-vm-modules scripts/verify-neon-batching.mjs && npm run verify:neon-public
      - name: Build verified Next static export
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
