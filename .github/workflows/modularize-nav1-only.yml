name: Modularize NAV1 only
on:
  push:
    paths:
      - '.github/workflows/modularize-nav1-only.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch NAV1 module boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          # loc-nav.js: remove NAV1 ownership, keep NAV2 and local section menus.
          p=Path('js/loc-nav.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n  const NAV_URL = .*?\n', '\n', s, count=1)
          s=s.replace('  const WEB_BUILD = "0.8";\n','')
          s=re.sub(r'\n  const DEFAULT_NAV = \[[\s\S]*?\n  \];\n','\n',s,count=1)
          s=re.sub(r'\n  function currentId\([\s\S]*?(?=\n  function installStyles\()','\n',s,count=1)
          # add NAV1 module loader helper before installStyles
          marker='  function installStyles() {'
          helper='''  function loadNav1(){\n    const mount=()=>window.LOCNav1?.mountAll?.();\n    if(window.LOCNav1){mount();return;}\n    const existing=document.querySelector('script[data-loc-nav1-module]');\n    if(existing){existing.addEventListener('load',mount,{once:true});return;}\n    const script=document.createElement('script');\n    script.src='js/loc-nav1.js';\n    script.defer=true;\n    script.dataset.locNav1Module='true';\n    script.addEventListener('load',mount,{once:true});\n    document.head.appendChild(script);\n  }\n\n'''
          if helper not in s:
              s=s.replace(marker,helper+marker,1)
          s=s.replace('    document.querySelectorAll("[data-loc-nav]").forEach(renderNav);\n','    loadNav1();\n')
          # runtime style must not own NAV1 appearance anymore
          s=s.replace('    style.textContent = `.runes-third-nav{display:none!important}.loc-global-search{display:flex!important;align-items:center;gap:6px}.loc-global-search-submit{min-height:34px;padding:5px 8px;border:1px solid rgba(180,158,255,.24);border-radius:8px;background:transparent;color:var(--muted,#b9bfd0);font:inherit;font-size:.8rem;cursor:pointer}`;', '    style.textContent = `.runes-third-nav{display:none!important}`;')
          p.write_text(s,encoding='utf-8')

          # CSS: lock NAV1 typography/spacing independently from page CSS.
          p=Path('css/loc-nav.css')
          css=p.read_text(encoding='utf-8')
          block='''\n/* NAV1 is a single shared module. Page CSS must not alter its typography or spacing. */\nhtml body .loc-global-shell .loc-global-nav{\n  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif !important;\n  font-size:16px !important;\n  font-weight:400 !important;\n  line-height:1.4 !important;\n}\nhtml body .loc-global-shell .loc-global-brand{\n  font-family:inherit !important;\n  font-size:.96rem !important;\n  font-weight:800 !important;\n  line-height:1.4 !important;\n  letter-spacing:.07em !important;\n  padding:0 !important;\n  margin:0 !important;\n}\nhtml body .loc-global-shell .loc-global-link{\n  font-family:inherit !important;\n  font-size:.84rem !important;\n  font-weight:650 !important;\n  line-height:1.4 !important;\n  min-height:36px !important;\n  padding:5px 4px !important;\n  margin:0 !important;\n  border-top:0 !important;\n  border-left:0 !important;\n  border-right:0 !important;\n  border-radius:0 !important;\n  background:transparent !important;\n  box-shadow:none !important;\n  text-transform:none !important;\n}\nhtml body .loc-global-shell .loc-global-links{gap:12px !important;}\nhtml body .loc-global-shell .loc-global-search{\n  display:flex !important;align-items:center !important;gap:6px !important;margin:0 !important;\n}\nhtml body .loc-global-shell .loc-global-search input{\n  font-family:inherit !important;font-size:.82rem !important;font-weight:400 !important;line-height:1.4 !important;\n}\nhtml body .loc-global-shell .loc-global-search-submit{\n  min-height:34px !important;padding:5px 8px !important;border:1px solid rgba(180,158,255,.24) !important;\n  border-radius:8px !important;background:transparent !important;color:var(--muted,var(--loc-muted,#b9bfd0)) !important;\n  font-family:inherit !important;font-size:.8rem !important;font-weight:650 !important;line-height:1.4 !important;cursor:pointer !important;\n}\nhtml body .loc-global-shell .loc-global-current{pointer-events:none !important;cursor:default !important;text-decoration:none !important;}\n@media(max-width:720px){\n  html body .loc-global-shell .loc-global-brand{font-size:.84rem !important;}\n  html body .loc-global-shell .loc-global-link{font-size:.8rem !important;min-height:40px !important;}\n  html body .loc-global-shell .loc-global-links{gap:9px !important;}\n}\n'''
          if 'NAV1 is a single shared module' not in css:
              css += block
          p.write_text(css,encoding='utf-8')

          # service worker: cache NAV1 module and bump.
          p=Path('service-worker.js')
          sw=p.read_text(encoding='utf-8')
          sw=re.sub(r'moon-runes-pwa-v\d+','moon-runes-pwa-v195',sw,count=1)
          if '"/js/loc-nav1.js"' not in sw:
              sw=sw.replace('"/js/loc-nav.js",','"/js/loc-nav.js",\n  "/js/loc-nav1.js",',1)
          p.write_text(sw,encoding='utf-8')

          # Remove failed previous workflow if still present.
          old=Path('.github/workflows/unify-active-nav1.yml')
          if old.exists(): old.unlink()
          Path('.github/workflows/modularize-nav1-only.yml').unlink()
      - name: Commit NAV1 module cleanup
        run: |
          git config user.name "EsotericVerse"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Modularize shared NAV1 and lock its styling"
          git push
