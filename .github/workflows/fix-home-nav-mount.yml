name: Fix homepage canonical NAV mount
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-home-nav-mount.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore homepage NAV mount
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          mount = '  <div class="loc-global-shell"><nav class="loc-global-nav" data-loc-nav data-page="home" aria-label="全站導覽"></nav></div>\n'
          if 'data-loc-nav' not in s:
              target = '<body class="loc-responsive-page loc-page-home">\n'
              if target not in s:
                  raise SystemExit('homepage body mount target not found')
              s = s.replace(target, target + mount, 1)
          p.write_text(s, encoding='utf-8')
          sw = Path('service-worker.js')
          t = sw.read_text(encoding='utf-8')
          import re
          m = re.search(r'moon-runes-pwa-v(\d+)', t)
          if not m:
              raise SystemExit('cache version not found')
          v = int(m.group(1)) + 1
          t = t[:m.start()] + f'moon-runes-pwa-v{v}' + t[m.end():]
          sw.write_text(t, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-home-nav-mount.yml
          git add index.html service-worker.js
          git commit -m "Restore homepage NAV1 NAV2 NAV3 mount"
          git push
