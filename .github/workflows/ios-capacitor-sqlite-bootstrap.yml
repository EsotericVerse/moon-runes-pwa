name: Bootstrap Capacitor SQLite dependencies

on:
  push:
    branches:
      - feat/ios-capacitor-sqlite-deps
    paths:
      - .github/workflows/ios-capacitor-sqlite-bootstrap.yml

permissions:
  contents: write

jobs:
  install-dependencies:
    if: github.repository == 'EsotericVerse/moon-runes-pwa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Capacitor iOS and native SQLite packages
        run: |
          npm install --save-exact --ignore-scripts --no-audit --no-fund \
            @capacitor/core@8.5.3 \
            @capacitor/ios@8.5.3 \
            @capacitor-community/sqlite@8.1.1
          npm install --save-dev --save-exact --ignore-scripts --no-audit --no-fund \
            @capacitor/cli@8.5.3
      - name: Validate lockfile and installed packages
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0 @capacitor/core @capacitor/ios @capacitor/cli @capacitor-community/sqlite
          npx cap --version
      - name: Commit package manifests only and remove bootstrap
        run: |
          git rm .github/workflows/ios-capacitor-sqlite-bootstrap.yml
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(ios): install Capacitor 8 and SQLite dependencies"
          git push origin HEAD:feat/ios-capacitor-sqlite-deps
