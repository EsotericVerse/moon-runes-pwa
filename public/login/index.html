<!doctype html>
<html lang="zh-Hant" data-theme-id="theme-7" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>LOC · 登入</title>
<link rel="stylesheet" href="/login/appearance.css">

</head>
<body>
<div class="login-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回 LOC 月典首頁"><span class="brand-mark" aria-hidden="true">◐</span><span class="brand-copy"><strong>LOC</strong><small>月典</small></span></a>
    <a class="back-link" href="/">繼續瀏覽 <span aria-hidden="true">↗</span></a>
  </header>
  <main class="auth-scene">
    <section class="intro" aria-labelledby="welcome">
      <span class="eyebrow">LANGUAGE · TIME · TRACE</span>
      <h1 id="welcome">回到你的<br><em>文字世界。</em></h1>
      <p class="lead">讓作品、時間與空間重新相遇。登入後，接續你的創作與個人設定。</p>
      <div class="orbit" aria-hidden="true"><span class="orbit-ring"></span><span class="orbit-ring"></span><span class="orbit-ring"></span><span class="orbit-core">◐</span><span class="orbit-dot"></span></div>
      <p class="intro-note">閱讀公開內容，不需要登入。</p>
    </section>
    <section class="auth-surface" aria-label="LOC 登入與身分核驗">
      <div class="auth-top"><span class="eyebrow">YOUR ACCOUNT</span><p>安全登入，繼續原本的工作。</p></div>
      <div id="login-root"></div>
      <div id="signed-in" hidden>
        <h2>身分核驗</h2>
        <p id="user"></p>
        <p>登入後會確認你的帳戶身分；管理與寫入權限仍由 LOC 獨立檢查。</p>
        <div class="actions">
          <button id="return" type="button" disabled>核驗後返回 LOC</button>
          <button id="signout" type="button">登出</button>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite">載入登入介面…</p>
    </section>
  </main>
  <footer class="footer"><span>LOC · 月典</span><span>登入只確認身分，管理權限仍須另行驗證。</span></footer>
</div>
<script type="module">
const byId=id=>document.getElementById(id);
const AUTHORITY='https://auth.lo3rwang.cc';
const LOGIN_RETURN_KEY='loc-management-login-return-v1';
let verifiedForEditor=false;
function validReturnPath(){
 const value=new URLSearchParams(location.search).get('return_to')||'/local/settings/';
 if(!value.startsWith('/')||value.startsWith('//')||value.includes('\\'))
  return '/local/settings/';
 const parsed=new URL(value,location.origin);
 return parsed.origin===location.origin?parsed.pathname+parsed.search+parsed.hash:'/local/settings/';
}
function isProtectedReturn(path){
 return /\/(?:manage|admin)(?:\/|$)/.test(new URL(path,location.origin).pathname);
}
function signIn(provider){
 const url=new URL('/oauth/login',AUTHORITY);
 url.searchParams.set('provider',provider);
 url.searchParams.set('return_to',validReturnPath());
 location.assign(url.href);
}
const panel=byId('login-root');
for(const [provider,text] of [['oidc','使用 Google 繼續'],['github','使用 GitHub 繼續']]){
 const button=document.createElement('button');
 button.type='button';button.className='loc-login-choice';
 button.textContent=text;
 button.addEventListener('click',()=>signIn(provider));
 panel.appendChild(button);
}
byId('return').addEventListener('click',()=>{
 if(!verifiedForEditor)return;
 const path=validReturnPath();
 if(isProtectedReturn(path)){
  try{sessionStorage.setItem(LOGIN_RETURN_KEY,path);}catch{}
 }
 location.assign(path);
});
byId('signout').addEventListener('click',async()=>{
 try{
  const response=await fetch(AUTHORITY+'/oauth/logout',{
   method:'POST',credentials:'include',cache:'no-store'
  });
  if(!response.ok)throw new Error('LOC Auth 登出失敗');
  location.reload();
 }catch(error){byId('status').textContent=String(error.message||error);}
});
async function initialize(){
 const response=await fetch(AUTHORITY+'/v1/auth/session',{
  method:'GET',credentials:'include',cache:'no-store',
  headers:{accept:'application/json'}
 });
 if(!response.ok)throw new Error('LOC Auth 暫時無法確認登入狀態（HTTP '+response.status+'）');
 const data=await response.json();
 const user=data?.user;
 const signedIn=Boolean(data?.provider==='loc'&&/^loc_[A-Za-z0-9_-]{32,80}$/.test(
  String(user?.id||''))&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(user?.email||''))&&
  typeof data?.session?.access_token==='string');
 verifiedForEditor=signedIn;
 panel.hidden=signedIn;
 byId('signed-in').hidden=!signedIn;
 byId('return').disabled=!signedIn;
 byId('user').textContent=signedIn?user.email:'';
 byId('status').textContent=signedIn
  ?(isProtectedReturn(validReturnPath())
   ?'LOC Auth 身分已核驗，返回後將確認編輯權限。'
   :'LOC Auth 身分已核驗，管理與寫入權限由 LOC 獨立確認。')
  :'請選擇 Google 或 GitHub，以 LOC Auth 登入。公開閱讀不需要登入。';
}
initialize().catch(error=>{byId('status').textContent=String(error.message||error);});
</script>
</body>
</html>
