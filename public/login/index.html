<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>LOC · 登入</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,-apple-system,sans-serif;background:#10141c;color:#f3f4f7}
*{box-sizing:border-box}body{margin:0 auto;max-width:580px;padding:40px 16px}
h1{margin:0;font-size:1.7rem}p{color:#bac6d5}
.card{margin:24px 0;background:#1a2330;border:1px solid #45566b;border-radius:16px;padding:24px}
button,.button{background:#355e93;color:white;border-radius:8px;border:1px solid #799ac1;font:inherit;padding:9px 16px;cursor:pointer}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
a{color:#9fd1ff}#status{overflow-wrap:anywhere;white-space:pre-wrap}
#user{overflow-wrap:anywhere}main{min-height:200px}[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>LOC · 登入</h1><p>由獨立身分服務登入。資料庫供應商不參與 OAuth。</p></header>
<main class="card">
  <div id="login-root"></div>
  <div id="signed-in" hidden>
    <h2>已登入 LOC</h2>
    <p id="user"></p>
    <p>身分登入與資料管理權限分開驗證；是否可編輯由 LOC Authority 決定。</p>
    <div class="actions">
      <button id="return" type="button">返回 LOC</button>
      <button id="signout" type="button">登出</button>
    </div>
  </div>
  <p id="status" role="status" aria-live="polite">載入登入介面…</p>
</main>
<script type="module">
const byId=id=>document.getElementById(id);
let clerk=null;
function validReturnPath(){
  const value=new URLSearchParams(location.search).get('return_to')||'/local/settings/';
  if(!value.startsWith('/')||value.startsWith('//')||value.includes('\\')||value.includes('\\r')||value.includes('\\n'))return '/local/settings/';
  try{
    const parsed=new URL(value,location.origin);
    return parsed.origin===location.origin?parsed.pathname+parsed.search+parsed.hash:'/local/settings/';
  }catch{return '/local/settings/';}
}
async function script(url,attributes={}){
  await new Promise((resolve,reject)=>{
    const tag=document.createElement('script');
    tag.src=url;tag.async=true;tag.crossOrigin='anonymous';
    for(const [name,value] of Object.entries(attributes))tag.setAttribute(name,value);
    tag.onload=resolve;tag.onerror=()=>reject(new Error('無法載入 Clerk 登入元件'));
    document.head.appendChild(tag);
  });
}
function update(){
  const signedIn=Boolean(clerk?.isSignedIn&&clerk?.session);
  byId('signed-in').hidden=!signedIn;
  byId('login-root').hidden=signedIn;
  byId('user').textContent=signedIn?clerk.user?.primaryEmailAddress?.emailAddress||'已完成身分驗證':'';
  byId('status').textContent=signedIn?'Clerk 身分驗證成功。':'請使用 Google 等已啟用的方式登入 LOC。';
}
byId('return').onclick=()=>location.assign(validReturnPath());
byId('signout').onclick=async()=>{
  await clerk?.signOut();
  location.reload();
};
async function start(){
  const response=await fetch('/recovery/config.json',{cache:'no-store'});
  if(!response.ok)throw new Error('無法讀取 LOC 登入設定');
  const config=await response.json();
  if(!config.publishableKey||!config.frontendApiUrl)throw new Error('LOC Clerk 尚未設定');
  const domain=new URL(config.frontendApiUrl);
  if(domain.protocol!=='https:'||domain.pathname!=='/'||domain.search||domain.hash)
    throw new Error('登入服務網域無效');
  await script(domain.origin+'/npm/@clerk/ui@1/dist/ui.browser.js');
  await script(domain.origin+'/npm/@clerk/clerk-js@6/dist/clerk.browser.js',
    {'data-clerk-publishable-key':config.publishableKey});
  clerk=window.Clerk;
  if(!clerk)throw new Error('Clerk 未能初始化');
  await clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});
  clerk.addListener(update);
  if(!clerk.isSignedIn)clerk.mountSignIn(byId('login-root'));
  update();
}
start().catch(error=>{byId('status').textContent=String(error.message||error)});
</script>
</body>
</html>
