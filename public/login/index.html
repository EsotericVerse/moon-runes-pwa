<!doctype html>
<html lang="zh-Hant" data-theme-id="theme-7" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>LOC · 登入</title>
<link rel="stylesheet" href="/login/appearance.css">

</head>
<body>
<div class="login-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回 LOC 月典首頁"><span class="brand-mark" aria-hidden="true">◐</span><span class="brand-copy"><strong>LOC</strong><small>月典</small></span></a>
    <a class="back-link" href="/">繼續瀏覽 <span aria-hidden="true">↗</span></a>
  </header>
  <main class="auth-scene">
    <section class="intro" aria-labelledby="welcome">
      <span class="eyebrow">LANGUAGE · TIME · TRACE</span>
      <h1 id="welcome">回到你的<br><em>文字世界。</em></h1>
      <p class="lead">讓作品、時間與空間重新相遇。登入後，接續你的創作與個人設定。</p>
      <div class="orbit" aria-hidden="true"><span class="orbit-ring"></span><span class="orbit-ring"></span><span class="orbit-ring"></span><span class="orbit-core">◐</span><span class="orbit-dot"></span></div>
      <p class="intro-note">閱讀公開內容，不需要登入。</p>
    </section>
    <section class="auth-surface" aria-label="LOC 登入與身分核驗">
      <div class="auth-top"><span class="eyebrow">YOUR ACCOUNT</span><p>安全登入，繼續原本的工作。</p></div>
      <div id="login-root"></div>
      <div id="signed-in" hidden>
        <h2>身分核驗</h2>
        <p id="user"></p>
        <p>登入後會確認你的帳戶身分；管理與寫入權限仍由 LOC 獨立檢查。</p>
        <div class="actions">
          <button id="return" type="button" disabled>核驗後返回 LOC</button>
          <button id="signout" type="button">登出</button>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite">載入登入介面…</p>
    </section>
  </main>
  <footer class="footer"><span>LOC · 月典</span><span>登入只確認身分，管理權限仍須另行驗證。</span></footer>
</div>
<script type="module">
const byId=id=>document.getElementById(id);
let clerk=null,controlUrl='',checkGeneration=0,verifiedForEditor=false,githubMode=false;
const LOGIN_RETURN_KEY='loc-management-login-return-v1';
function isProtectedReturn(path){
  return /\/(?:manage|admin)(?:\/|$)/.test(new URL(path,location.origin).pathname);
}
function validReturnPath(){
  const value=new URLSearchParams(location.search).get('return_to')||'/local/settings/';
  if(!value.startsWith('/')||value.startsWith('//')||value.includes('\\')||value.includes('\\r')||value.includes('\\n'))return '/local/settings/';
  try{
    const parsed=new URL(value,location.origin);
    return parsed.origin===location.origin?parsed.pathname+parsed.search+parsed.hash:'/local/settings/';
  }catch{return '/local/settings/';}
}
async function script(url,attributes={}){
  await new Promise((resolve,reject)=>{
    const tag=document.createElement('script');
    tag.src=url;tag.async=true;tag.crossOrigin='anonymous';
    for(const [name,value] of Object.entries(attributes))tag.setAttribute(name,value);
    tag.onload=resolve;tag.onerror=()=>reject(new Error('無法載入 Clerk 登入元件'));
    document.head.appendChild(tag);
  });
}
async function verify(){
  const generation=++checkGeneration;
  if(!clerk?.isSignedIn||!clerk.session)return;
  byId('status').textContent='Clerk 已登入，正在核驗 LOC 身分…';
  try{
    if(!controlUrl)throw new Error('獨立認證服務尚未設定');
    const token=await clerk.session.getToken();
    if(!token)throw new Error('無法取得 Clerk Session');
    const response=await fetch(controlUrl+'/v1/identity',{
      method:'GET',cache:'no-store',credentials:'omit',
      headers:{authorization:'Bearer '+token,accept:'application/json'}
    });
    if(!response.ok){
      let reason='';
      try{
        const payload=await response.json();
        if(typeof payload?.error==='string')reason=payload.error.slice(0,160);
      }catch{}
      throw new Error('LOC 身分核驗失敗（HTTP '+response.status+(reason?'：'+reason:'')+'）');
    }
    const identity=await response.json();
    if(identity?.provider!=='clerk'||identity.subject!==clerk.user?.id)
      throw new Error('LOC 回傳身分不一致');
    if(generation!==checkGeneration||!clerk.isSignedIn)return;
    verifiedForEditor=Boolean(identity.email);
    byId('return').disabled=!verifiedForEditor;
    byId('status').textContent=verifiedForEditor
      ?(isProtectedReturn(validReturnPath())
        ?'Clerk 身分已核驗。返回後將確認編輯權限。'
        :'Clerk 身分已核驗。進入 LOC 後將再檢查管理權限。')
      :'Clerk Session 尚未提供已驗證的 Email 宣告，無法進入編輯。';
  }catch(error){
    if(generation===checkGeneration&&clerk?.isSignedIn)
      byId('status').textContent=String(error.message||error);
  }
}
function update(){
  const signedIn=Boolean(clerk?.isSignedIn&&clerk?.session);
  if(!signedIn){verifiedForEditor=false;byId('return').disabled=true;}
  byId('signed-in').hidden=!signedIn;
  byId('login-root').hidden=signedIn;
  byId('user').textContent=signedIn?clerk.user?.primaryEmailAddress?.emailAddress||'Clerk Session 已建立':'';
  byId('status').textContent=signedIn?'Clerk Session 已建立；尚未通過 LOC Authority 核驗。':'請使用 Google 等已啟用的方式登入 LOC。';
  if(signedIn)void verify();
}
byId('return').onclick=()=>{
  if(!verifiedForEditor)return;
  const path=validReturnPath();
  if(isProtectedReturn(path)){
    try{sessionStorage.setItem(LOGIN_RETURN_KEY,path);}catch{}
  }
  // The real edit permission is verified on the protected destination.
  location.assign(path);
};
byId('signout').onclick=async()=>{
  if(githubMode){
    await fetch(controlUrl+'/v1/github/logout',{
      method:'POST',credentials:'include',cache:'no-store'
    });
  }else await clerk?.signOut();
  location.reload();
};
async function startGitHub(){
  const status=await fetch(controlUrl+'/v1/github/status',{
    credentials:'include',cache:'no-store'
  }).catch(()=>null);
  if(!status?.ok||!(await status.json())?.configured)return false;
  githubMode=true;
  byId('login-root').innerHTML='<div class="actions"><button type="button" id="github-login">使用 GitHub 登入</button></div>';
  byId('github-login').onclick=async()=>{
    try{
      byId('status').textContent='前往 GitHub 授權…';
      const response=await fetch(controlUrl+'/v1/github/start',{
        credentials:'include',cache:'no-store'
      });
      if(!response.ok)throw Error('GitHub OAuth 尚未就緒');
      const {authorization_url:url}=await response.json();
      const target=new URL(url);
      if(target.origin!=='https://github.com'||target.pathname!=='/login/oauth/authorize')
        throw Error('GitHub 授權網址不正確');
      sessionStorage.setItem('loc-github-return',validReturnPath());
      location.assign(target.href);
    }catch(error){byId('status').textContent=String(error.message||error);}
  };
  const session=await fetch(controlUrl+'/v1/github/session',{
    credentials:'include',cache:'no-store'
  }).catch(()=>null);
  if(session?.ok){
    const identity=await session.json();
    verifiedForEditor=identity.provider==='github'&&Boolean(identity.email);
    byId('signed-in').hidden=false;
    byId('login-root').hidden=true;
    byId('user').textContent=identity.email||'';
    byId('return').disabled=!verifiedForEditor;
    byId('status').textContent=verifiedForEditor
      ?'GitHub 身分已核驗，返回後仍會確認 LOC 管理權限。'
      :'GitHub 帳號缺少已驗證的 Email。';
  }else byId('status').textContent='使用 GitHub 登入 LOC，無須 Clerk。';
  return true;
}
async function start(){
  const response=await fetch('/recovery/config.json',{cache:'no-store'});
  if(!response.ok)throw new Error('無法讀取 LOC 登入設定');
  const config=await response.json();
  if(config.controlUrl){
    const target=new URL(config.controlUrl);
    if(target.protocol!=='https:'||target.username||target.password||target.search||target.hash||
      target.pathname!=='/')throw new Error('LOC Authority 連線設定無效');
    controlUrl=target.origin;
  }
  if(controlUrl&&await startGitHub())return;
  if(!config.publishableKey||!config.frontendApiUrl)throw new Error('LOC Clerk 尚未設定');
  const domain=new URL(config.frontendApiUrl);
  if(domain.protocol!=='https:'||domain.pathname!=='/'||domain.search||domain.hash)
    throw new Error('登入服務網域無效');
  await script(domain.origin+'/npm/@clerk/ui@1/dist/ui.browser.js');
  await script(domain.origin+'/npm/@clerk/clerk-js@6/dist/clerk.browser.js',
    {'data-clerk-publishable-key':config.publishableKey});
  clerk=window.Clerk;
  if(!clerk)throw new Error('Clerk 未能初始化');
  const theme=getComputedStyle(document.documentElement);
  const token=name=>theme.getPropertyValue(name).trim();
  const isDark=document.documentElement.dataset.theme==='dark';
  await clerk.load({
    ui:{ClerkUI:window.__internal_ClerkUICtor},
    appearance:{variables:{
      colorPrimary:token('--loc-accent'),
      colorPrimaryForeground:token(isDark?'--loc-bg':'--loc-panel'),
      colorForeground:token('--loc-text'),
      colorMutedForeground:token('--loc-muted'),
      colorBackground:token('--loc-panel'),
      colorBorder:token('--loc-line'),
      colorInput:token('--loc-panel-2'),
      colorInputForeground:token('--loc-text'),
      colorRing:token('--loc-accent'),
      borderRadius:'14px',
      fontFamily:token('--loc-font-family')
    }},
    localization:{
      signIn:{start:{title:'登入 LOC',subtitle:'選擇帳戶，繼續你的工作',actionText:'還沒有帳號？',actionLink:'註冊'}},
      socialButtonsBlockButton:'使用 {{provider|titleize}} 繼續',
      dividerText:'或',
      formFieldLabel__emailAddress:'電子郵件',
      formFieldInputPlaceholder__emailAddress:'輸入電子郵件',
      formButtonPrimary:'繼續'
    }
  });
  clerk.addListener(update);
  if(!clerk.isSignedIn)clerk.mountSignIn(byId('login-root'));
  update();
}
start().catch(error=>{byId('status').textContent=String(error.message||error)});
</script>
</body>
</html>
